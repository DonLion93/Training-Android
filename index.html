      hold.startPageY = hold.cy + window.scrollY;
      hold.armed = true;
      lifting = true;
      touchDrive = {
        move: function (x, y) { if (hold && hold.armed) { hold.cx = x; hold.cy = y; update(); } },
        end: function (abort) { if (hold && hold.armed) finish(abort); }
      };
      suppress = true;
      hold.item.classList.remove("holding");
      hold.item.classList.add("lifted");
      list.classList.add("sorting");
      hold.trash = trashEl();
      hold.trash.classList.add("show");
      try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) { /* egal */ }

    }

    function update() {
      var h = hold;
      if (!h || !h.armed) return;
      var dy = h.cy + window.scrollY - h.startPageY;
      h.item.style.transform = "translateY(" + dy + "px) scale(1.02)";
      h.over = h.cy >= window.innerHeight - h.trash.offsetHeight;
      h.trash.classList.toggle("hot", h.over);
      var center = h.rects[h.idx].top + h.rects[h.idx].h / 2 + dy, to = h.idx;
      if (!h.over) {
        h.rects.forEach(function (r, k) {
          var mid = r.top + r.h / 2;
          if (k < h.idx && center < mid) to = Math.min(to, k);
          else if (k > h.idx && center > mid) to = Math.max(to, k);
        });
      }
      h.to = to;
      h.items.forEach(function (it, k) {
        if (k === h.idx) return;
        var s = 0;
        if (h.idx < to && k > h.idx && k <= to) s = -h.slot;
        else if (h.idx > to && k >= to && k < h.idx) s = h.slot;
        it.style.transform = s ? "translateY(" + s + "px)" : "";

    /* Am oberen und unteren Rand der Ansicht scrollt die Seite von selbst, damit lange Listen erreichbar bleiben */
    function loop() {
      var h = hold;
      if (!h || !h.armed) return;
      var vh = window.innerHeight, zone = h.trash.offsetHeight, sp = 0;
      if (h.cy < EDGE) sp = -MAX_SCROLL * (1 - Math.max(0, h.cy) / EDGE);

        window.scrollBy(0, sp);

      requestAnimationFrame(loop);
    }

    function onMove(ev) {
      if (!hold || ev.pointerId !== hold.id) return;
      hold.cx = ev.clientX;
      hold.cy = ev.clientY;
      if (!hold.armed) { if (Math.hypot(ev.clientX - hold.x0, ev.clientY - hold.y0) > SLOP) stop(); }
      else update();
    }

    function onUp(ev) {
      var h = hold;
      if (!h || ev.pointerId !== h.id) return;
      if (!h.armed) { stop(); return; }
      finish(false);
    }

    /* Loslassen (oder Abbruch) einer angehobenen Zeile */
    function finish(abort) {
      var h = hold;
      var idx = h.idx, to = h.to, over = h.over, intact = document.contains(list) && list.contains(h.item);
      stop();
      suppressTimer = setTimeout(function () { suppress = false; }, 500);
      if (abort) { say("Abgebrochen."); return; }
      if (!intact) return; /* die Liste wurde währenddessen neu aufgebaut */
      if (over) o.onDelete(idx);
      else if (to !== idx) o.onMove(idx, to);
      else say("Nichts verändert.");
    }

    function onCancel(ev) {
      if (!hold || ev.pointerId !== hold.id) return;
      /* Bei Touch weiterziehen: die Touch-Ereignisse (touchDrive) beenden die Geste */
      if (hold.armed && hold.touch) return;
      var was = hold.armed;
      stop();
      if (was) { suppressTimer = setTimeout(function () { suppress = false; }, 500); say("Abgebrochen."); }
    }

    function onKey(ev) {
      if (!hold || ev.key !== "Escape") return;
      var was = hold.armed;
      stop();
      if (was) { ev.preventDefault(); suppressTimer = setTimeout(function () { suppress = false; }, 500); say("Abgebrochen."); }
    }

  }

  /* Für andere Zieh-Module (js/daydrag.js): Scrollen sperren und bei pointercancel über Touch-Ereignisse weiterziehen */
  function lock(on, drive) { lifting = !!on; touchDrive = on ? drive : null; }

  App.reorder = { attach: attach, lock: lock };
})();

<script>
/* Ein Element aus einer festen Reihe (die Wochentage) per langem Drücken auf einen freien Platz ziehen.
   Die Reihenfolge der Plätze bleibt, es wandert nur der Inhalt: Loslassen über einem gültigen Platz ruft onDrop(von, nach) auf.
   Wer ein Element (itemSel) 3 Sekunden hält, ohne den Finger zu bewegen, hebt es an. Vorher bewegen oder loslassen ist ein normales Tippen.
   Gültige Plätze (canDrop) leuchten auf, der Platz unter dem Finger wird hervorgehoben. Touch und Maus über Pointer-Events,
   die Tastatur-Bedienung liegt bei der Ansicht. Nutzt von js/reorder.js die Scroll-Sperre. */
(function () {
  "use strict";
  var HOLD_MS = 3000, SLOP = 8, REACH = 90;

  /* o: { strip, itemSel, canStart(i), canDrop(von, nach), onDrop(von, nach), say(text), holdMs } */
  function attach(o) {
    var strip = o.strip, holdMs = o.holdMs || HOLD_MS;
    var hold = null, suppress = false, suppressTimer = null;
    function say(t) { if (o.say) o.say(t); }
    function items() { return [].slice.call(strip.querySelectorAll(o.itemSel)); }

    strip.addEventListener("pointerdown", function (ev) {
      if (hold || !ev.isPrimary || (ev.pointerType === "mouse" && ev.button !== 0)) return;
      var item = ev.target.closest(o.itemSel);
      if (!item || !strip.contains(item)) return;
      var idx = items().indexOf(item);
      if (idx < 0 || !o.canStart(idx)) return;
      suppress = false;
      clearTimeout(suppressTimer);
      begin(item, idx, ev);
    });
    /* Nach dem Loslassen eines gehaltenen Tages soll kein Klick mehr ankommen (sonst wird er gewählt) */
    strip.addEventListener("click", function (ev) {
      if (!suppress) return;
      suppress = false;
      ev.preventDefault();
      ev.stopPropagation();
    }, true);
    strip.addEventListener("contextmenu", function (ev) { if (hold) ev.preventDefault(); });
    strip.addEventListener("dragstart", function (ev) { if (hold) ev.preventDefault(); });

    function begin(item, idx, ev) {
      hold = { item: item, idx: idx, id: ev.pointerId, touch: ev.pointerType === "touch", x0: ev.clientX, y0: ev.clientY, cx: ev.clientX, cy: ev.clientY, armed: false, to: -1 };
      item.style.setProperty("--hold-ms", holdMs + "ms");
      item.classList.add("holding");
      hold.timer = setTimeout(arm, holdMs);
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onCancel);
      document.addEventListener("keydown", onKey, true);
    }

    function stop() {
      if (!hold) return;
      var h = hold;
      hold = null;
      clearTimeout(h.timer);
      h.item.classList.remove("holding", "lifted");
      h.item.style.transform = "";
      items().forEach(function (it) { it.classList.remove("drop-ok", "drop-hot", "drop-no"); });
      strip.classList.remove("dragging");
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onCancel);
      document.removeEventListener("keydown", onKey, true);
      App.reorder.lock(false);
    }

    function arm() {
      if (!hold) return;
      var list = items();
      if (list.indexOf(hold.item) !== hold.idx) { stop(); return; }
      hold.rects = list.map(function (it) { var r = it.getBoundingClientRect(); return { l: r.left + window.scrollX, t: r.top + window.scrollY, w: r.width, h: r.height }; });
      hold.start = { x: hold.cx + window.scrollX, y: hold.cy + window.scrollY };
      hold.armed = true;
      App.reorder.lock(true, {
        move: function (x, y) { if (hold && hold.armed) { hold.cx = x; hold.cy = y; update(); } },
        end: function (abort) { if (hold && hold.armed) finish(abort); }
      });
      suppress = true;
      hold.item.classList.remove("holding");
      hold.item.classList.add("lifted");
      strip.classList.add("dragging");
      list.forEach(function (it, k) {
        if (k === hold.idx) return;
        it.classList.add(o.canDrop(hold.idx, k) ? "drop-ok" : "drop-no");
      });
      try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) { /* egal */ }
      say("Tag angehoben. Ziehe ihn auf einen freien Tag, der aufleuchtet.");
      update();
    }

    /* Welcher gültige Platz liegt unter dem Finger? Nächster nach Breite, Höhe großzügig */
    function target() {
      var h = hold, px = h.cx + window.scrollX, py = h.cy + window.scrollY, best = -1, bestD = 1e9;
      var top = h.rects[0].t - REACH, bottom = h.rects[0].t + h.rects[0].h + REACH;
      if (py < top || py > bottom) return -1;
      h.rects.forEach(function (r, k) {
        if (k === h.idx || !o.canDrop(h.idx, k)) return;
        var d = Math.abs(px - (r.l + r.w / 2));
        if (d < r.w * 0.75 && d < bestD) { best = k; bestD = d; }
      });
      return best;
    }

    function update() {
      var h = hold;
      if (!h || !h.armed) return;
      h.item.style.transform = "translate(" + (h.cx + window.scrollX - h.start.x) + "px," + (h.cy + window.scrollY - h.start.y) + "px) scale(0.9)";
      var to = target();
      if (to !== h.to) {
        items().forEach(function (it, k) { it.classList.toggle("drop-hot", k === to); });
        h.to = to;
      }
    }

    function onMove(ev) {
      var h = hold;
      if (!h || ev.pointerId !== h.id) return;
      h.cx = ev.clientX;
      h.cy = ev.clientY;
      if (!h.armed) {
        /* Vor Ablauf der Zeit bewegt: kein Halten, normales Tippen oder Scrollen */
        if (Math.abs(h.cx - h.x0) > SLOP || Math.abs(h.cy - h.y0) > SLOP) stop();
        return;
      }
      update();
    }

    function onUp(ev) {
      var h = hold;
      if (!h || ev.pointerId !== h.id) return;
      if (!h.armed) { stop(); return; }
      finish(false);
    }

    function finish(abort) {
      var h = hold, from = h.idx, to = h.to;
      stop();
      suppressTimer = setTimeout(function () { suppress = false; }, 500);
      if (abort) { say("Abgebrochen."); return; }
      if (to < 0) { say("Abgebrochen. Zum Verschieben auf einen freien Tag ziehen."); return; }
      o.onDrop(from, to);
    }

    function onCancel(ev) {
      if (!hold || ev.pointerId !== hold.id) return;
      /* Bei Touch weiterziehen: die Touch-Ereignisse beenden die Geste */
      if (hold.armed && hold.touch) return;
      var was = hold.armed;
      stop();
      if (was) { suppressTimer = setTimeout(function () { suppress = false; }, 500); say("Abgebrochen."); }
    }

    function onKey(ev) {
      if (ev.key !== "Escape" || !hold) return;
      ev.preventDefault();
      var was = hold.armed;
      stop();
      if (was) { suppressTimer = setTimeout(function () { suppress = false; }, 500); say("Abgebrochen."); }
    }
  }

  App.daydrag = { attach: attach };
})();

</script>
<script>
/* Wischen zwischen den Reitern, zwei getrennte Optionen (Einstellungen > Darstellung, beide standardmäßig aus):
   swipeNav:  Finger auf der unteren Reiterleiste nach links oder rechts ziehen, der Reiter unter dem Finger beim Loslassen wird geöffnet.
   swipePage: im Inhaltsbereich nach links wischen = nächster Reiter, nach rechts = vorheriger.
   Die Optionen werden bei jeder Geste frisch gelesen, ein Umschalten wirkt also sofort. */
(function () {
  "use strict";
  var S = App.store;
  var MIN_DX = 70, RATIO = 1.8, MAX_MS = 800, EDGE = 24, NAV_SLOP = 10;

  function opt(k) { var v = S.state().settings.view; return !!(v && v[k]); }
  function tabs() { return [].slice.call(document.querySelectorAll("#tabs .tab")); }
  function current() { return tabs().findIndex(function (a) { return a.getAttribute("aria-current") === "page"; }); }

  /* touch-action der Leiste nur bei aktiver Option sperren, sonst bleibt alles wie gewohnt */
  function classes() { document.documentElement.classList.toggle("sw-nav", opt("swipeNav")); }
  S.onChange(classes);
  classes();

  function go(i, dir) {
    var t = tabs()[i];
    if (!t) return;
    var v = document.getElementById("view");
    if (v && dir) {
      v.classList.remove("sw-in-l", "sw-in-r");
      void v.offsetWidth;
      v.classList.add(dir > 0 ? "sw-in-l" : "sw-in-r");
      setTimeout(function () { v.classList.remove("sw-in-l", "sw-in-r"); }, 320);
    }
    location.hash = "#" + t.getAttribute("data-id");
  }

  /* --- 1. Wischen über die Reiterleiste --- */
  var box = document.getElementById("tabs");
  var nav = null;
  function idxAt(x) {
    var list = tabs(), best = 0, bestD = Infinity;
    for (var i = 0; i < list.length; i++) {
      var r = list[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right) return i;
      var d = Math.min(Math.abs(x - r.left), Math.abs(x - r.right));

              var v = Math.min(99999, C.doneOf(S.state(), r.day, r.e.id) + n);
              setDone(r.day, r.e.id, v);
              r.num.value = String(v);
              paintAll();
            },
            close: function () { rows.forEach(paintTimer); }
          }));
        }
        paintToggle(r);
      }

      function paintToggle(r) {
        if (!r.tg) return;
        var open = T.isOpen(r.day, r.e.id);
        r.tg.setAttribute("aria-expanded", String(open));
        r.tg.classList.toggle("on", open);
        var blocked = open ? T.isActive() : !!T.current();
        r.tg.disabled = blocked;
        var label = (open ? "Timer schließen: " : "Timer starten: ") + r.e.name;
        r.tg.setAttribute("aria-label", label);
        r.tg.title = blocked ? (open ? "Verwirf oder trage die Zeit zuerst ein" : "Beende zuerst den offenen Timer") : label;
      }

      function toggleTimer(r) {
        if (T.isOpen(r.day, r.e.id)) T.closeIdle();
        else T.open(r.day, r.e);
        rows.forEach(paintTimer);
      }

      function buildRow(e) {
        var cid = "chk-" + sel + "-" + e.id;
        var chk = el("input", { type: "checkbox", id: cid });
        var num = el("input", { type: "number", id: "num-" + sel + "-" + e.id, min: "0", inputmode: "numeric", placeholder: "0", "aria-label": e.name + " erreicht (" + e.unit + ")" });
        var v = C.doneOf(S.state(), sel, e.id);
        if (v > 0) num.value = String(v);
        var goal = el("span", { class: "ex-goal" });
        var fill = el("i");
        var li = el("li", { class: "xrow" },
          el("label", { class: "chk" }, chk, el("span", { class: "box", "aria-hidden": "true" })),
          el("div", { class: "ex" }, el("label", { class: "ex-name", for: cid, text: e.name }), goal),
          el("div", { class: "cnt" }, num, el("span", { class: "of", text: "/ " + e.target })),
          el("span", { class: "rb" }, fill)
        );
        var r = { e: e, li: li, chk: chk, num: num, goal: goal, fill: fill, day: sel };
        if (T.supports(e.unit)) {
          r.tg = el("button", { type: "button", class: "tm-toggle", onclick: function () { toggleTimer(r); } });
          r.tg.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2.5h5M12 2.5v3.5M19 6l1.5-1.5"/></svg>'; /* festes Symbol, keine Nutzerdaten */
          r.slot = el("div", { class: "tm-slot", hidden: true });
          li.querySelector(".cnt").prepend(r.tg);
          li.insertBefore(r.slot, li.querySelector(".rb"));
        }
        chk.addEventListener("change", function () {
          setDone(sel, e.id, chk.checked ? e.target : 0);
          num.value = chk.checked ? String(e.target) : "";
          paintAll();
        });
        num.addEventListener("input", function () {
          setDone(sel, e.id, Math.min(99999, Math.max(0, Math.floor(Number(num.value) || 0))));
          paintAll();
        });
        rows.push(r);
        return li;
      }

      /* Notiz zum gewählten Tag: ein Aufklapper, offen, wenn schon etwas drinsteht. Speichert beim Tippen. */
      function noteBox() {
        var day = sel, st = S.state(), max = S.NOTE_MAX;
        if (!st.notes) st.notes = {};
        var text = st.notes[day] || "";
        var ta = el("textarea", { class: "in note", id: "note-" + day, rows: "3", maxlength: String(max),
          placeholder: "Wie lief es? Zum Beispiel: Schulter zwickt, nächstes Mal mehr Pause.", "aria-label": "Notiz zu " + App.DAYS[day].n });
        ta.value = text;
        var count = el("span", { class: "note-count", "aria-hidden": "true" });
        var mark = el("span", { class: "note-dot", "aria-hidden": "true" });
        var d = el("details", { class: "note-box", id: "note-box" },
          el("summary", null, el("span", { class: "note-t", text: "Notiz" }), mark, el("span", { class: "sr", id: "note-state" })),
          el("div", { class: "note-body" }, ta, count));
        function paint() {
          var has = ta.value.trim().length > 0;
          mark.hidden = !has;
          d.querySelector("#note-state").textContent = has ? "(vorhanden)" : "";
          count.textContent = ta.value.length > max - 100 ? ta.value.length + " / " + max : "";
        }
        d.open = !!text;
        ta.addEventListener("input", function () {
          var t = ta.value.slice(0, max).trim();
          if (t) st.notes[day] = t; else delete st.notes[day];
          S.touch();
          paint();
        });
        paint();
        return d;
      }

      /* Trainingstag nur für diese Woche verschieben (js/shift.js) und Verschiebungen zurücknehmen */
      function shiftBox() {
        var SH = App.shift, day = sel, st = S.state();
        var box = el("div", { class: "shift", id: "shift-box" });
        var sh = SH.info();
        if (sh) {
          var list = sh.moves.map(function (m) { return App.DAYS[m.from].s + " → " + App.DAYS[m.to].s; }).join(", ");
          box.append(el("p", { class: "hint", id: "shift-info", text: "Diese Woche verschoben: " + list + "." }),
            App.confirmButton("Verschiebungen zurücknehmen", "Wirklich zurücknehmen", function () { SH.revert(); buildPanel(); paintAll(); }, { id: "shift-revert" }));
        }
        return box.childNodes.length ? box : document.createDocumentFragment();
      }

      /* Pause nötig (Krankheit, Urlaub): der Tag zählt nicht als ausgelassen. Nur ohne Einträge an diesem Tag. */
      function pauseBox(date) {
        if (App.pause.hasProgress(date)) return document.createDocumentFragment();
        return el("div", { class: "pausebox" },
          el("button", { type: "button", class: "btn", id: "pause-on", text: "Pause nötig", onclick: function () { App.pause.set(date, true); buildPanel(); paintAll(); } }),
          el("p", { class: "hint", text: "Krank oder unterwegs? Ein Pausentag zählt nicht als ausgelassen und unterbricht keine Serie." }));
      }

      function buildPanel() {
        var st = S.state();
        var d = App.DAYS[sel], train = !!st.days[sel];
        var date = App.pause.dateOfDay(sel), paused = train && App.pause.is(date);
        rows = [];
        /* Ein offener Timer, dessen Übung oder Tag es nicht mehr gibt oder keine Zeiteinheit mehr hat, wird verworfen */
        var cur = T.current();
        if (cur) {
          var ex = st.exercises.filter(function (x) { return x.id === cur.id; })[0];
          if (!ex || !st.days[cur.day] || !T.supports(ex.unit)) { T.discard(); cur = null; }
        }
        panel.replaceChildren(el("div", { class: "card-head" },
          el("h2", { text: (sel === today ? "Heute · " : "") + d.n }),
          el("span", { class: "pill" + (train && !paused ? "" : " rest"), text: paused ? "Pause" : train ? (App.shift.note(sel) ? "Verschoben von " + App.DAYS[App.shift.note(sel).other].s : "Training") : "Ruhetag" })
        ));
        if (cur && cur.day !== sel) {
          panel.append(el("p", { class: "tm-banner" },
            "Timer offen: " + cur.name + " (" + App.DAYS[cur.day].n + ") ",
            el("button", { type: "button", class: "btn", text: "Anzeigen", onclick: function () { sel = cur.day; buildPanel(); paintAll(); } })));
        }
        if (paused) {
          panel.append(el("p", { class: "hint", id: "pause-info", text: (sel === today ? "Heute ist" : "Dieser Tag ist") + " als Pause markiert. Er zählt nicht als ausgelassen und unterbricht keine Serie." }),
            el("div", null, el("button", { type: "button", class: "btn", id: "pause-off", text: "Pause aufheben", onclick: function () { App.pause.set(date, false); buildPanel(); paintAll(); } })));
          return;
        }
        if (!train) {
          var mv = App.shift.note(sel);
          panel.append(el("p", { class: "hint", text: mv ? "Das Training dieses Tages wurde auf " + App.DAYS[mv.other].n + " verschoben." : sel === today ? App.persona.addr("Heute ist Pause") + ". Die Erholung gehört zum Plan, hier gibt es nichts abzuhaken." : "An diesem Tag ist Pause." }), shiftBox(), noteBox());
          return;
        }
        if (!st.exercises.length) {
          panel.append(el("p", { class: "hint", text: "Noch keine Übungen angelegt." }), shiftBox(), noteBox());
          return;
        }
        var ul = el("ul", { class: "xrows" });
        st.exercises.forEach(function (e) { ul.append(buildRow(e)); });
        panel.append(ul, shiftBox(), noteBox(), pauseBox(date));
        ul.addEventListener("focusout", function () { setTimeout(function () { applyOrder(false); }, 150); });
        applyOrder(true);
        rows.forEach(paintTimer);
        T.onChange(function () { rows.forEach(paintToggle); });
      }

      buildPanel();
      paintAll();
    }
  });
})();

</script>
<script>
/* Reiter 2: Übungen. Trainingstage festlegen, Übungen mit Ziel und Einheit anlegen und ändern.
   Tippen klappt eine Übung zum Bearbeiten auf. 3 Sekunden Halten hebt sie an: dann verschieben oder auf den Mülleimer ziehen
   (js/reorder.js). Gelöscht wird erst nach Rückfrage (js/dialog.js). Mit der Tastatur: Alt + Pfeil hoch oder runter, Entf. */
(function () {
  "use strict";
  var el = App.el, S = App.store;
  var UNITS = ["Wdh.", "Sek.", "Min."];
  var expanded = null; /* id der aufgeklappten Übung */

  function uid() { return "e" + Math.random().toString(36).slice(2, 8); }
  function goalText(e) { return "Ziel: " + e.target + " " + e.unit; }

  App.register({
    id: "uebungen",
    label: "Übungen",
    title: "Übungen",
    icon: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
    render: function (root) {
      var daysBox = el("nav", { class: "strip", "aria-label": "Trainingstage" });
      var list = el("div", { class: "exlist" });
      var live = el("p", { class: "vh", "aria-live": "polite", id: "ex-live" });
      var addBtn = el("button", { type: "button", class: "btn primary", text: "Übung hinzufügen", onclick: addExercise });
      var arcWrap = el("div", { id: "ex-arc-wrap" });

      root.append(
        el("section", { class: "card" },
          el("h2", { text: "Trainingstage" }),
          el("p", { class: "hint", text: "Tippe auf einen Tag, um ihn zwischen Training und Ruhetag zu wechseln." }),
          daysBox
        ),
        el("section", { class: "card" },
          el("h2", { text: "Übungen" }),
          el("p", { class: "hint", text: "Tippe auf eine Übung, um Name, Ziel und Einheit zu ändern. Halte sie 3 Sekunden gedrückt, um sie zu verschieben oder zu löschen. Das Ziel gilt für jeden Trainingstag, schon eingetragene Werte bleiben erhalten." }),
          el("p", { class: "vh", id: "ex-help", text: "Alt plus Pfeil nach oben oder unten verschiebt die Übung, Entf löscht sie." }),
          list, live,
          el("div", null, addBtn)
        ),
        arcWrap
      );

      function say(t) { live.textContent = ""; setTimeout(function () { live.textContent = t; }, 30); }

      function paintDays() {
        var st = S.state();
        daysBox.replaceChildren();
        App.DAYS.forEach(function (d, i) {
          var on = !!st.days[i];
          daysBox.append(el("button", {
            type: "button",
            class: "day" + (on ? "" : " rest"),
            "aria-pressed": String(on),
            "aria-label": d.n + ": " + (on ? "Training" : "Ruhetag"),
            onclick: function () { st.days[i] = !st.days[i]; if (st.shift) st.shift.base[i] = st.days[i]; S.touch(); paintDays(); }
          },
            el("span", { class: "dn", text: d.s }),
            el("span", { class: "pb" + (on ? " on" : "") }),
            el("span", { class: "dp", text: on ? "" : "Ruhe" })
          ));
        });
      }

      function moveTo(from, to) {
        var st = S.state();
        if (from === to || to < 0 || to >= st.exercises.length) return;
        var e = st.exercises.splice(from, 1)[0];
        st.exercises.splice(to, 0, e);
        S.touch();
        paintList({ sum: e.id });
        say(e.name + " ist jetzt Übung " + (to + 1) + " von " + st.exercises.length + ".");
      }

      /* Archiv: die Übung verschwindet aus Plan und Liste, behält aber Ziel, Einheit und MET-Wert. Berichte und Rekorde bleiben. */
      function archive(e) {
        var st = S.state(), idx = st.exercises.indexOf(e);
        if (idx < 0) return;
        st.exercises.splice(idx, 1);
        st.archive.unshift(e);
        if (st.archive.length > 50) st.archive.length = 50;
        if (expanded === e.id) expanded = null;
        S.touch();
        var next = st.exercises[Math.min(idx, st.exercises.length - 1)];
        paintList(next ? { sum: next.id } : { add: true });
        paintArchive();
        say(e.name + " ist jetzt im Archiv.");
      }

      function unarchive(e) {
        var st = S.state(), idx = st.archive.indexOf(e);
        if (idx < 0) return;
        st.archive.splice(idx, 1);
        st.exercises.push(e);
        S.touch();
        paintList({ sum: e.id });
        paintArchive();
        say(e.name + " ist wieder im Plan.");
      }

      function paintArchive() {
        var st = S.state();
        arcWrap.replaceChildren();
        if (!st.archive.length) return;
        var ul = el("ul", { class: "arc-list", id: "ex-arc" });
        st.archive.forEach(function (e) {
          ul.append(el("li", { "data-id": e.id },
            el("span", { class: "arc-n" }, el("strong", { text: e.name }), el("span", { class: "hint", text: goalText(e) })),
            el("button", { type: "button", class: "btn", text: "Zurückholen", "aria-label": e.name + " zurückholen", onclick: function () { unarchive(e); } }),
            App.confirmButton("Löschen", "Wirklich löschen", function () {
              var s2 = S.state();
              s2.archive = s2.archive.filter(function (x) { return x.id !== e.id; });
              S.touch(); paintArchive(); say(e.name + " wurde gelöscht.");
            }, { "aria-label": e.name + " endgültig löschen" })));
        });
        arcWrap.append(App.fold("arc", "Archiv (" + st.archive.length + ")", "ex-archive", [
          el("p", { class: "hint", text: "Archivierte Übungen sind nicht im Plan, behalten aber Ziel, Einheit und MET-Wert. Berichte und Rekorde bleiben erhalten." }),
          ul
        ]));
      }

      function remove(e) {
        var st = S.state(), idx = st.exercises.indexOf(e);
        st.exercises = st.exercises.filter(function (x) { return x.id !== e.id; });
        Object.keys(st.done).forEach(function (k) { if (st.done[k]) delete st.done[k][e.id]; });
        if (expanded === e.id) expanded = null;
        S.touch();
        var next = st.exercises[Math.min(idx, st.exercises.length - 1)];
        paintList(next ? { sum: next.id } : { add: true });
        say(e.name + " wurde gelöscht.");
      }

      /* Immer erst fragen, egal ob per Mülleimer oder Tastatur */
      function askRemove(e) {
        App.dialog.confirm({
          title: "„" + e.name + "“ löschen?",
          text: "Die Übung und ihre eingetragenen Werte der laufenden Woche werden entfernt. Gespeicherte Berichte bleiben unverändert.",
          ok: "Löschen",
          cancel: "Abbrechen"
        }).then(function (yes) {
          if (!yes) return;
          if (S.state().exercises.indexOf(e) < 0) return;
          remove(e);
        });
      }

      function addExercise() {
        var st = S.state();
        var e = { id: uid(), name: "Neue Übung", target: 10, unit: "Wdh." };
        st.exercises.push(e);
        expanded = e.id;
        S.touch();
        paintList({ name: e.id });
      }

      function setOpen(id) {
        expanded = expanded === id ? null : id;
        list.querySelectorAll(".exitem").forEach(function (it) {
          var open = it.getAttribute("data-id") === expanded;
          it.classList.toggle("open", open);
          it.querySelector(".ex-sum").setAttribute("aria-expanded", String(open));
          it.querySelector(".ex-panel").hidden = !open;
        });
      }

      function item(e, idx) {
        var open = expanded === e.id;
        var nameId = "ex-name-" + e.id, tgtId = "ex-tgt-" + e.id;
        var nameOut = el("span", { class: "ex-n", text: e.name });
        var goalOut = el("span", { class: "ex-g", text: goalText(e) });

        var name = el("input", { type: "text", class: "in name", id: nameId, maxlength: "40", placeholder: "Name der Übung", "aria-label": "Name der Übung" });
        name.value = e.name;
        name.addEventListener("input", function () { e.name = name.value.slice(0, 40); nameOut.textContent = e.name || "Übung"; S.touch(); });
        name.addEventListener("blur", function () {
          e.name = name.value.trim() || "Übung";
          name.value = e.name;
          nameOut.textContent = e.name;
          S.touch();
        });

        var tgt = el("input", { type: "number", class: "in num", id: tgtId, min: "1", max: "99999", inputmode: "numeric", "aria-label": "Ziel für " + e.name });
        tgt.value = String(e.target);
        tgt.addEventListener("input", function () {
          var n = Math.floor(Number(tgt.value));
          if (n >= 1) { e.target = Math.min(n, 99999); goalOut.textContent = goalText(e); S.touch(); }
        });
        tgt.addEventListener("blur", function () { tgt.value = String(e.target); });

        var unit = el("select", { class: "in", id: "ex-unit-" + e.id, "aria-label": "Einheit für " + e.name });
        UNITS.forEach(function (u) {
          var o = el("option", { value: u, text: u });
          if (u === e.unit) o.selected = true;
          unit.append(o);
        });
        /* Eigener Kalorienverbrauch je Einheit. Leer = automatische Schätzung. */
        var PER = { "Wdh.": "Wiederholung", "Sek.": "Sekunde", "Min.": "Minute" };
        var kcId = "ex-kcal-" + e.id;
        var kcLab = el("label", { class: "lab", for: kcId });
        var kc = el("input", { type: "text", class: "in num", id: kcId, inputmode: "decimal", maxlength: "9" });
        function fmtK(n) { return n.toLocaleString("de-DE", { maximumFractionDigits: 3 }); }
        function paintKcal() {
          kcLab.textContent = "kcal pro " + PER[e.unit];
          kc.setAttribute("aria-label", "Kalorienverbrauch pro " + PER[e.unit] + " für " + e.name + ", leer für automatisch");
          kc.value = e.kcal ? fmtK(e.kcal) : "";
          var w = App.health.currentKg();
          var auto = w > 0 ? App.health.autoPer(e.name, e.unit, w, e.met, e.sec) : 0;
          kc.placeholder = auto > 0 ? "auto " + fmtK(Math.round(auto * 1000) / 1000) : "auto";
          paintBasis();
        }

        /* Berechnungsgrundlage: kcal = MET x Gewicht x Dauer. Ändert sich Gewicht oder MET, ändert sich der Wert von selbst. */
        var metId = "ex-met-" + e.id, secId = "ex-sec-" + e.id;
        var met = el("input", { type: "text", class: "in num", id: metId, inputmode: "decimal", maxlength: "6" });
        var sec = el("input", { type: "text", class: "in num", id: secId, inputmode: "decimal", maxlength: "6" });
        var secLine = el("div", { class: "line" }, el("label", { class: "lab", for: secId, text: "Sekunden je Wiederholung" }), sec);
        var basis = el("p", { class: "hint kc-basis", id: "ex-basis-" + e.id });
        function fmtN(n) { return n.toLocaleString("de-DE", { maximumFractionDigits: 2 }); }
        function paintBasis() {
          var d = App.health.defaults(e.name, e.unit), reps = e.unit === "Wdh.";
          met.value = e.met ? fmtN(e.met) : "";
          met.placeholder = "auto " + fmtN(d.met);
          met.setAttribute("aria-label", "MET-Wert für " + e.name + ", leer für automatisch");
          sec.value = e.sec ? fmtN(e.sec) : "";
          sec.placeholder = reps ? "auto " + fmtN(d.sec) : "";
          sec.setAttribute("aria-label", "Sekunden je Wiederholung für " + e.name + ", leer für automatisch");
          secLine.hidden = !reps;
          var w = App.health.currentKg();
          var m = e.met || d.met, s = reps ? (e.sec || d.sec) : (e.unit === "Min." ? 60 : 1);
          var t;
          if (e.kcal) t = "Du hast einen eigenen kcal-Wert eingetragen, er hat Vorrang. Leere das Feld oben, dann wird mit dem MET-Wert gerechnet.";
          else if (!(w > 0)) t = "Trage dein Gewicht unter Einstellungen ein, dann wird der Verbrauch automatisch berechnet.";
          else t = "Rechnung: " + fmtN(m) + " MET × " + fmtN(w) + " kg × " + fmtN(s) + " s ÷ 3600 = " + fmtK(Math.round(m * w * s / 3600 * 1000) / 1000) + " kcal pro " + PER[e.unit] + ". Das Gewicht kommt aus deinem Gewichtsverlauf.";
          basis.textContent = t;
        }
        function numField(input, key, clean) {
          input.addEventListener("input", function () {
            var t = input.value.trim().replace(",", ".");
            if (t === "") { delete e[key]; S.touch(); paintBasisAndPlaceholder(); return; }
            var n = clean(Number(t));
            if (n) { e[key] = n; S.touch(); paintBasisAndPlaceholder(); }
          });
          input.addEventListener("blur", paintKcal);
        }
        function paintBasisAndPlaceholder() {
          var w = App.health.currentKg();
          var auto = w > 0 ? App.health.autoPer(e.name, e.unit, w, e.met, e.sec) : 0;
          kc.placeholder = auto > 0 ? "auto " + fmtK(Math.round(auto * 1000) / 1000) : "auto";
          var d = App.health.defaults(e.name, e.unit), reps = e.unit === "Wdh.";
          var m = e.met || d.met, s = reps ? (e.sec || d.sec) : (e.unit === "Min." ? 60 : 1);
          if (!e.kcal && w > 0) basis.textContent = "Rechnung: " + fmtN(m) + " MET × " + fmtN(w) + " kg × " + fmtN(s) + " s ÷ 3600 = " + fmtK(Math.round(m * w * s / 3600 * 1000) / 1000) + " kcal pro " + PER[e.unit] + ". Das Gewicht kommt aus deinem Gewichtsverlauf.";
        }
        numField(met, "met", S.cleanMet);
        numField(sec, "sec", S.cleanSec);
        paintKcal();
        kc.addEventListener("input", function () {
          var t = kc.value.trim().replace(",", ".");
          if (t === "") { delete e.kcal; S.touch(); return; }
          var n = S.cleanKcal(Number(t));
          if (n) { e.kcal = n; S.touch(); }
        });
        kc.addEventListener("blur", paintKcal);
        kc.addEventListener("input", paintBasis);

        unit.addEventListener("change", function () {
          var old = e.unit;
          e.unit = unit.value;
          /* Sekunden und Minuten lassen sich umrechnen, bei Wiederholungen gilt der Wert nicht mehr */
          if (e.kcal) {
            var f = old === "Min." && e.unit === "Sek." ? 1 / 60 : old === "Sek." && e.unit === "Min." ? 60 : 0;
            var n = f ? S.cleanKcal(e.kcal * f) : null;
            if (n) e.kcal = n; else delete e.kcal;
          }
          goalOut.textContent = goalText(e);
          paintKcal();
          S.touch();
        });

        var sum = el("button", {
          type: "button", class: "ex-sum", id: "ex-sum-" + e.id,
          "aria-expanded": String(open), "aria-controls": "ex-panel-" + e.id, "aria-describedby": "ex-help",
          onclick: function () { setOpen(e.id); }
        }, el("span", { class: "ex-t" }, nameOut, goalOut), el("span", { class: "ex-bar" }));
        var chev = el("span", { class: "ex-chev", "aria-hidden": "true" });
        chev.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'; /* festes Symbol */
        sum.insertBefore(chev, sum.querySelector(".ex-bar"));

        sum.addEventListener("keydown", function (ev) {
          var i = S.state().exercises.indexOf(e);
          if (ev.altKey && (ev.key === "ArrowUp" || ev.key === "ArrowDown")) { ev.preventDefault(); moveTo(i, i + (ev.key === "ArrowUp" ? -1 : 1)); }
          else if (ev.key === "Delete") { ev.preventDefault(); askRemove(e); }
        });

        var panel = el("div", { class: "ex-panel", id: "ex-panel-" + e.id, hidden: !open },
          name,
          el("div", { class: "line" }, el("label", { class: "lab", for: tgtId, text: "Ziel" }), tgt, unit),
          el("div", { class: "line" }, kcLab, kc),
          el("div", { class: "line" }, el("label", { class: "lab", for: metId, text: "MET-Wert (Anstrengung)" }), met),
          secLine,
          basis,
          el("div", { class: "line ex-arcline" }, el("button", { type: "button", class: "btn", id: "ex-arch-" + e.id, text: "Archivieren", "aria-label": e.name + " archivieren", onclick: function () { archive(e); } }),
            el("span", { class: "hint", text: "Aus dem Plan nehmen, ohne die Einstellungen zu verlieren." }))
        );

        return el("div", { class: "exitem" + (open ? " open" : ""), "data-id": e.id }, sum, panel);
      }

      function paintList(opts) {
        var st = S.state();
        list.replaceChildren();
        if (!st.exercises.length) {
          list.append(el("p", { class: "hint", text: "Noch keine Übungen. Lege deine erste Übung an." }));
        } else {
          st.exercises.forEach(function (e, i) { list.append(item(e, i)); });
        }
        if (!opts) return;
        var t = null;
        if (opts.name) { t = document.getElementById("ex-name-" + opts.name); if (t) { t.focus(); t.select(); } }
        else if (opts.sum) { t = document.getElementById("ex-sum-" + opts.sum); if (t) t.focus(); }
        else if (opts.add) addBtn.focus();
      }

      App.reorder.attach({
        list: list, itemSel: ".exitem", handleSel: ".ex-sum", say: say,
        onMove: moveTo,
        onDelete: function (idx) { var e = S.state().exercises[idx]; if (e) askRemove(e); }
      });

      paintDays();
      paintList();
      paintArchive();
    }
  });
})();

<script>
/* Reiter 3: Berichte. Wochen oder Monate, Verlaufsdiagramm, aufklappbare Details, Daten sichern und importieren. */
(function () {
  "use strict";
  var el = App.el, C = App.calc, R = App.reports, F = App.files;
  var mode = "weeks";
  var flash = null;

  function perf(v) { return v === null ? "–" : C.pct(v) + " %"; }
  function monthKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
  function monthDate(k) { return new Date(+k.slice(0, 4), +k.slice(5) - 1, 1); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  /* Gesundheitswerte einer Woche: geschätzte kcal und BMI nach den Körperwerten, die für den Bericht gelten */
  function weekHealth(r) {
    var H = App.health, b = H.basis(r);
    var total = H.kcalDays(r.d, b.kg);
    var kcal = b.kg > 0 || total > 0 ? total : null;
    var bmi = H.bmi(b.cm, b.kg);
    return { kcal: kcal, bmi: bmi, now: b.now };
  }

  /* Zeilen aufsteigend nach Zeit: je Woche oder je Kalendermonat (nach dem Datum jedes Tages) */
  function buildRows(m) {
    var list = R.all();
    if (m === "weeks") {
      return list.map(function (r) {
        var mon = C.parseYmd(r.w), sun = C.addDays(mon, 6), kw = C.isoWeek(mon);
        return {
          kind: "week", key: r.w, w: r.w, d: r.d, n: r.n || null, live: !!r.live, label: String(kw), title: "KW " + kw,
          sub: C.fmtDay(mon) + " – " + C.fmtDay(sun) + " " + sun.getFullYear(), agg: C.aggregate(r.d), health: weekHealth(r)
        };
      });
    }
    var months = {}, keys = [];
    list.forEach(function (r) {
      var mon = C.parseYmd(r.w), wh = weekHealth(r), H = App.health, kgw = H.basis(r).kg;
      for (var i = 0; i < 7; i++) {
        var k = monthKey(C.addDays(mon, i));
        var o = months[k];
        if (!o) { o = months[k] = { days: [], weeks: {}, live: false, kcal: null, bmi: null, now: false }; keys.push(k); }
        o.days.push(r.d[i]);
        if (wh.kcal !== null) o.kcal = (o.kcal || 0) + H.kcalDay(r.d[i], kgw);
        if (wh.bmi !== null) o.bmi = wh.bmi;
        if (wh.now) o.now = true;
        o.weeks[r.w] = 1;
        if (r.live) o.live = true;
      }
    });
    keys.sort();
    return keys.map(function (k) {
      var o = months[k], a = C.aggregate(o.days), dt = monthDate(k);
      return {
        kind: "month", key: k, live: o.live, d: null,
        label: dt.toLocaleDateString("de-DE", { month: "short" }).replace(".", ""),
        title: dt.toLocaleDateString("de-DE", { month: "long", year: "numeric" }),
        sub: plural(a.trainDays, "Trainingstag", "Trainingstage") + " · " + plural(Object.keys(o.weeks).length, "Woche", "Wochen"),
        agg: a, health: { kcal: o.kcal, bmi: o.bmi, now: o.now }
      };
    });
  }

  /* Zeilen für Wochen- und Monatsberichte, leer wenn weder Gewicht noch Größe bekannt sind */
  function healthRows(h) {
    var H = App.health, out = [], suffix = h.now ? " · mit deinen heutigen Angaben" : "";
    if (h.kcal !== null) out.push(["Kalorien (geschätzt)", H.fmtKcal(h.kcal) + suffix]);
    if (h.bmi !== null) out.push(["BMI", H.fmt1(h.bmi) + " · " + H.bmiCat(h.bmi) + suffix]);
    return out;
  }

  function statsDl(rows) {
    var dl = el("dl", { class: "stats" });
    rows.forEach(function (r) { dl.append(el("div", null, el("dt", { text: r[0] }), el("dd", { text: r[1] }))); });
    return dl;
  }

  function dayStrip(days) {
    var strip = el("div", { class: "strip" });
    days.forEach(function (items, i) {
      var a = items ? C.aggregate([items]) : null;
      var p = a && a.slots ? C.pct(a.perfAll) : null;
      var fill = el("i");
      fill.style.width = p === null ? "0%" : Math.min(100, p) + "%";
      C.tint(fill, p);
      strip.append(el("div", { class: "day" + (items ? "" : " rest") + (p === 100 ? " full" : "") + (p !== null && p > 100 ? " over" : "") },
        el("span", { class: "dn", text: App.DAYS[i].s }),
        el("span", { class: "pb" }, fill),
        el("span", { class: "dp", text: !items ? "Ruhe" : p === null ? "–" : p + "%" })
      ));
    });
    return strip;
  }

  /* Notizen der Woche, nur Wochenberichte haben welche */
  function notesList(n) {
    var days = n ? Object.keys(n).sort() : [];
    if (!days.length) return null;
    var ul = el("ul", { class: "notes-list" });
    days.forEach(function (i) { ul.append(el("li", null, el("strong", { text: App.DAYS[i].s }), el("span", { text: n[i] }))); });
    return el("div", { class: "totals notes" }, el("p", { class: "sub-h", text: "Notizen" }), ul);
  }

  function totals(a) {
    var box = el("div", { class: "totals" }, el("p", { class: "sub-h", text: "Pro Übung" }));
    a.order.forEach(function (k) {
      var t = a.byEx[k], p = C.pct(t.v / t.g);
      box.append(el("div", { class: "trow" },
        el("span", { class: "tn", text: t.name }),
        el("span", { class: "tv", text: t.v + " von " + t.g + " " + t.unit }),
        el("span", { class: "tp" + (p > 100 ? " over" : ""), text: p + " %" })
      ));
    });
    return box;
  }

  function item(r) {
    var a = r.agg, p = C.pct(a.perfAll);
    var state = p > 100 ? "over" : p === 100 ? "full" : "";
    var fill = el("i");
    fill.style.width = Math.min(100, p) + "%";
    C.tint(fill, p);
    var title = el("span", { class: "rep-t", text: r.title });
    if (r.live) title.append(" ", el("span", { class: "pill", text: "läuft" }));
    var body = el("div", { class: "rep-body" },
      statsDl([
        ["Übungen erreicht", a.reached + " von " + a.slots],
        ["Trainingstage komplett", a.fullDays + " von " + a.trainDays],
        ["Leistung der gemachten Übungen", perf(a.perfStarted)]
      ].concat(healthRows(r.health))),
      r.kind === "week" ? dayStrip(r.d) : null,
      r.kind === "week" ? notesList(r.n) : null,
      totals(a),
      r.kind === "week" && !r.live
        ? App.confirmButton("Bericht löschen", "Wirklich löschen", function () { R.remove(r.w); App.rerender(); })
        : null
    );
    return el("details", { class: "rep" + (state ? " is-" + state : "") },
      el("summary", null,
        title,
        el("span", { class: "rep-p" + (state ? " " + state : ""), text: p + " %" }),
        el("span", { class: "rep-s", text: r.sub }),
        el("div", { class: "bar" }, fill)
      ),
      body
    );
  }

  /* Diagramm: die letzten 12 Zeilen, eine Skala für Balken und Ziellinie, Werte über den Balken */
  function chartCard(rs) {
    var shown = rs.slice(-12);
    var vals = shown.map(function (r) { return C.pct(r.agg.perfAll); });
    var max = Math.max(120, Math.ceil(Math.max.apply(null, vals) * 1.15 / 20) * 20);
    var plot = el("div", { class: "plot" });
    var goal = el("div", { class: "goal" });
    goal.style.bottom = (100 / max * 100) + "%";
    plot.append(goal);
    var xl = el("div", { class: "xl", "aria-hidden": "true" });
    shown.forEach(function (r, i) {
      var p = vals[i];
      var bar = el("div", { class: "b" }, el("span", { class: "v", text: String(p) }));
      bar.style.height = (p / max * 100) + "%";
      C.tint(bar, p);
      plot.append(el("div", {
        class: "col" + (r.live ? " live" : "") + (p === 100 ? " full" : "") + (p > 100 ? " over" : ""),
        role: "img", title: r.title + ": " + p + " %", "aria-label": r.title + ": " + p + " Prozent" + (r.live ? ", läuft noch" : "")
      }, bar));
      xl.append(el("span", { text: r.label }));
    });

    var rated = rs.filter(function (r) { return r.agg.slots > 0; });
    var best = rated.reduce(function (b, r) { return !b || r.agg.perfAll > b.agg.perfAll ? r : b; }, null);
    var avg = rated.reduce(function (s, r) { return s + r.agg.perfAll; }, 0) / (rated.length || 1);
    var unit = mode === "weeks" ? plural(rs.length, "Woche", "Wochen") : plural(rs.length, "Monat", "Monate");

    return App.fold("rvl", "Verlauf", "rep-verlauf", [
      el("p", { class: "hint", text: "Leistung in Prozent vom Ziel, " + (mode === "weeks" ? "pro Kalenderwoche" : "pro Monat") + "." }),
      el.apply(null, ["div", { class: "legend" }].concat(C.legendItems(), [el("span", null, el("i", { class: "d" }), "Ziel (100 %)")])),
      plot, xl,
      el("p", { class: "sum", text: unit + " · Ø " + C.pct(avg) + " % · Bestwert " + (best ? C.pct(best.agg.perfAll) + " % (" + best.title + ")" : "–") })
    ]);
  }

  function dataCard() {
    var msg = el("p", { class: "msg", role: "status", id: "rep-export-msg" });
    function say(t, err) { msg.textContent = t || ""; msg.classList.toggle("err", !!err); }
    var day = C.ymd(new Date());

    function exportBtn(label, name, make, mime) {
      return el("button", {
        type: "button", class: "btn", text: label,
        onclick: function () {
          if (!R.archivedCount()) { say("Noch keine abgeschlossene Woche zum Sichern.", true); return; }
          F.save(name, make(), mime).then(function (r) {
            if (r === "ok") say("Datei erstellt: " + name);
            else if (r === "unsupported") say("Speichern ist hier nicht möglich. Nutze „JSON kopieren“.", true);
            else if (r === "error") say("Das Speichern hat nicht geklappt. Nutze „JSON kopieren“.", true);
          });
        }
      });
    }

    var imp = F.importBox({
      id: "rep",
      parse: function (text) {
        var r = R.parse(text);
        if (!r.ok) return r;
        return {
          ok: true,
          text: plural(r.reports.length, "Wochenbericht", "Wochenberichte") + " gefunden, " + r.range + ". Gleiche Wochen werden ersetzt, alles andere bleibt.",
          actions: [{ label: "Hinzufügen", primary: true, run: function () {
            var saved = App.backup.snapshot("merge");
            flash = plural(R.merge(r.reports), "Bericht", "Berichte") + " importiert." + (saved ? " Rückgängig machen kannst du es in den Einstellungen unter „Sicherheitskopie“." : "");
            App.rerender();
          } }]
        };
      }
    });

    if (flash) App.fold.show("rsi");
    var card = App.fold("rsi", "Datensicherung", "rep-data", [
      el("h3", { text: "Berichte sichern" }),
      el("p", { class: "hint", text: "Gespeichert werden alle abgeschlossenen Wochen. Die laufende Woche kommt am Montag dazu. Die CSV-Datei öffnest du in Excel." }),
      el("div", { class: "btns" },
        exportBtn("JSON speichern", "trainingswoche-berichte-" + day + ".json", R.toJson, "application/json"),
        exportBtn("CSV speichern", "trainingswoche-berichte-" + day + ".csv", R.toCsv, "text/csv"),
        el("button", { type: "button", class: "btn", text: "JSON kopieren", onclick: function () {
          if (!R.archivedCount()) { say("Noch keine abgeschlossene Woche zum Sichern.", true); return; }
          F.copy(R.toJson()).then(function (ok) { say(ok ? "In die Zwischenablage kopiert." : "Kopieren ist hier nicht möglich.", !ok); });
        } })
      ),
      msg,
      el("h3", { text: "Berichte importieren" }),
      el("p", { class: "hint", text: "Wähle eine JSON-Datei, die du hier gesichert hast." }),
      imp.node
    ]);
    if (flash) { imp.say(flash); flash = null; }
    return card;
  }

  /* Auf einen Blick: Wochenziel, Serie, Kalorien und Gewicht, zugeklappt, bis man es öffnet */
  function summary() {
    var st = App.store.state(), H = App.health;
    var days = C.allDays(st), a = C.aggregate(days);
    var p = a.slots ? C.pct(a.perfAll) : 0;
    var serie = App.stats.compute(R.all(), st.weekStart).current;
    var kg = H.currentKg();
    var anyOwn = st.exercises.some(function (e) { return e.kcal > 0; });
    var kcal = kg > 0 || anyOwn ? H.kcalDays(days, kg) : null;
    var wl = App.weight.list(), P = App.persona.get();
    var last = wl.length ? wl[wl.length - 1] : null;
    var wText = last ? last.kg : P.weight;
    var g = H.goalState(wl, P);
    var wSub = g ? (g.reached ? "Ziel erreicht" : "Noch " + H.fmt1(g.left) + " kg bis zum Ziel") : (wText > 0 ? "aktuell" : "nicht eingetragen");
    function tile(id, h, big, sub) {
      return el("section", { class: "rec", id: id }, el("p", { class: "rec-h", text: h }), el("p", { class: "rec-big", text: big }), el("p", { class: "rec-sub", text: sub }));
    }
    var left = a.slots - a.reached;
    return App.fold("sum", "Auf einen Blick", "rep-sum", [
      el("div", { class: "hv-two" },
        tile("sum-week", "Diese Woche", p + " %", a.slots ? a.reached + " von " + a.slots + " Zielen erreicht" : "keine Trainingstage"),
        tile("sum-streak", "Serie", String(serie), serie === 1 ? "Woche in Folge" : "Wochen in Folge"),
        tile("sum-kcal", "Kalorien", kcal === null ? "–" : H.fmtKcal(kcal).replace("≈ ", ""), kcal === null ? "Gewicht fehlt" : "geschätzt, diese Woche"),
        tile("sum-weight", "Gewicht", wText > 0 ? H.fmt1(wText) + " kg" : "–", wSub))
    ]);
  }

  App.register({
    id: "berichte",
    label: "Berichte",
    title: "Berichte",
    icon: '<path d="M5 20V11M12 20V5M19 20v-7M3 20h18"/>',
    render: function (root) {
      var holder = el("div", { class: "rep-holder" });
      var seg = el("div", { class: "seg", role: "group", "aria-label": "Zeitraum" });

      function paint() {
        seg.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === mode)); });
        holder.replaceChildren();
        var rs = buildRows(mode === "compare" ? "weeks" : mode);
        if (!rs.length) {
          holder.append(el("section", { class: "card" }, el("div", { class: "empty" },
            el("strong", { text: "Noch keine Berichte" }),
            el("p", { text: "Sobald du etwas im Trainingsplan einträgst, erscheint die laufende Woche hier als Zwischenstand. Am Montag wird sie als Bericht gespeichert." })
          )));
          return;
        }
        if (mode === "compare") { holder.append(App.compare.view(buildRows)); return; }
        var ul = el("ul", { class: "reports" });
        rs.slice().reverse().forEach(function (r) { ul.append(el("li", null, item(r))); });
        holder.append(chartCard(rs), App.stats.card(), App.fold(mode === "weeks" ? "rwo" : "rmo", mode === "weeks" ? "Wochenberichte" : "Monatsberichte", "rep-list", [ul]));
      }

      [["weeks", "Wochen"], ["months", "Monate"], ["compare", "Vergleich"]].forEach(function (m) {
        seg.append(el("button", { type: "button", "data-mode": m[0], text: m[1], onclick: function () { mode = m[0]; paint(); } }));
      });
      root.append(summary(), seg, holder, App.calendar.card(), App.health.card(), App.records.card(), App.badges.card(), dataCard());
      paint();
    }
  });
})();

</script>
<script>
/* Reiter 4: Einstellungen. Modus und Akzentfarbe, Speicherung, Backup und Zurücksetzen der Woche. */
(function () {
  "use strict";
  var el = App.el, S = App.store, T = App.theme, B = App.backup, R = App.reports, F = App.files, C = App.calc;
  var flash = null; /* { to: "imp" | "set" | "undo" | "info", t: Text }, wird nach dem Neuzeichnen angezeigt */
  var MODES = [["system", "System"], ["light", "Hell"], ["dark", "Dunkel"], ["black", "Schwarz"]];

  var fold = App.fold;

  function persoenlich() {
    var P = App.persona, S2 = App.store;
    var msg = el("p", { class: "msg", role: "status", id: "pf-msg" });
    var cur = P.get();
    function say(t) { msg.textContent = t || ""; msg.classList.toggle("err", !!t); }

    var nick = el("input", { type: "text", class: "in", id: "pf-nick", maxlength: String(S2.NICK_MAX), autocomplete: "nickname", placeholder: "z. B. Liri" });
    nick.value = cur.nick;
    nick.addEventListener("input", function () { P.set({ nick: nick.value }); });
    nick.addEventListener("change", function () { nick.value = P.get().nick; });

    var cm = el("input", { type: "number", class: "in num", id: "pf-h", min: "100", max: "250", step: "1", inputmode: "numeric", placeholder: "175" });
    var kg = el("input", { type: "text", class: "in num", id: "pf-w", inputmode: "decimal", autocomplete: "off", maxlength: "6", placeholder: "70,5" });
    function showKg(v) { return v === null ? "" : String(v).replace(".", ","); }
    if (cur.height !== null) cm.value = String(cur.height);
    kg.value = showKg(cur.weight);
    /* Zahlen erst beim Verlassen des Felds prüfen, damit man beim Tippen nicht unterbrochen wird */
    cm.addEventListener("change", function () {
      var t = cm.value.trim();
      if (!t) { P.set({ height: null }); say(""); return; }
      var v = Math.round(Number(t.replace(",", ".")));
      if (!(v >= 100 && v <= 250)) { say("Bitte gib eine Körpergröße zwischen 100 und 250 cm ein."); cm.value = P.get().height === null ? "" : String(P.get().height); return; }
      P.set({ height: v }); cm.value = String(v); say("");
    });
    kg.addEventListener("change", function () {
      var t = kg.value.trim();
      if (!t) { P.set({ weight: null }); say(""); return; }
      var v = Math.round(Number(t.replace(",", ".")) * 10) / 10;
      if (!isFinite(v)) v = NaN;
      if (!(v >= 20 && v <= 300)) { say("Bitte gib ein Gewicht zwischen 20 und 300 kg ein."); kg.value = showKg(P.get().weight); return; }
      P.set({ weight: v }); kg.value = showKg(v); say("");
    });

    var tg = el("input", { type: "text", class: "in num", id: "pf-t", inputmode: "decimal", autocomplete: "off", maxlength: "6", placeholder: "68,0" });
    tg.value = showKg(cur.target);
    tg.addEventListener("change", function () {
      var t = tg.value.trim();
      if (!t) { P.set({ target: null }); say(""); return; }
      var v = Math.round(Number(t.replace(",", ".")) * 10) / 10;
      if (!(v >= 20 && v <= 300)) { say("Bitte gib ein Zielgewicht zwischen 20 und 300 kg ein."); tg.value = showKg(P.get().target); return; }
      P.set({ target: v }); tg.value = showKg(v); say("");
    });

    /* Zwei Kästchen, es kann höchstens eines angekreuzt sein */
    var boxes = {};
    function box(key, label) {
      var c = el("input", { type: "checkbox", class: "tgl-in", role: "switch", id: "pf-g-" + key });
      c.checked = cur.gender === key;
      c.addEventListener("change", function () {
        P.set({ gender: c.checked ? key : null });
        Object.keys(boxes).forEach(function (k) { boxes[k].checked = P.get().gender === k; });
      });
      boxes[key] = c;
      return el("label", { class: "tgl", for: "pf-g-" + key }, el("span", { text: label }), c);
    }
    var gender = el("fieldset", { class: "pf-gender" }, el("legend", { text: "Geschlecht" }), box("m", "männlich"), box("w", "weiblich"));

    function field(id, label, input, unit) {
      return el("div", { class: "pf-field" }, el("label", { for: id, text: label }), el("div", { class: "pf-in" }, input, unit ? el("span", { class: "pf-unit", text: unit }) : null));
    }

    return fold("pers", "Persönliche Angaben", "persona", [
      el("p", { class: "hint", text: "Alles ist freiwillig. Die Angaben bleiben in deiner App und sind im Backup enthalten. Mit dem Spitznamen sprechen dich Hinweise der App persönlicher an." }),
      field("pf-nick", "Spitzname", nick, null),
      gender,
      el("div", { class: "pf-row" }, field("pf-h", "Körpergröße", cm, "cm"), field("pf-w", "Gewicht", kg, "kg")),
      el("div", { class: "pf-row" }, field("pf-t", "Zielgewicht", tg, "kg")),
      App.weightRemind.settingsNode(),
      msg
    ]);
  }

  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function hintUndo(saved) { return saved ? " Rückgängig machen kannst du es unter „Sicherheitskopie“." : " Eine Sicherheitskopie war nicht möglich."; }

  function darstellung() {
    var seg = el("div", { class: "seg", role: "group", "aria-label": "Modus" });
    var std = el("button", { type: "button", class: "btn", text: "Standard", onclick: function () { T.setAccent(null); paintAccent(); } });
    var custom = el("input", { type: "color", class: "clr", id: "acc-custom", "aria-label": "Eigene Akzentfarbe" });
    var customLabel = el("label", { class: "custom", for: "acc-custom" }, custom, "Eigene");
    var sw = el("div", { class: "swatches", role: "group", "aria-label": "Akzentfarbe" }, std);
    var presets = T.PRESETS.map(function (p) {
      var b = el("button", { type: "button", class: "sw", "aria-label": p[0], title: p[0], onclick: function () { T.setAccent(p[1]); paintAccent(); } });
      b.style.background = p[1];
      sw.append(b);
      return b;
    });
    sw.append(customLabel);

    MODES.forEach(function (m) {
      seg.append(el("button", { type: "button", "data-v": m[0], text: m[1], onclick: function () { T.setTheme(m[0]); paintMode(); } }));
    });

    function paintMode() {
      var cur = S.state().settings.theme;
      seg.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === cur)); });
    }
    function paintPressed() {
      var cur = S.state().settings.accent, isPreset = false;
      std.setAttribute("aria-pressed", String(!cur));
      T.PRESETS.forEach(function (p, i) {
        var on = cur === p[1];
        if (on) isPreset = true;
        presets[i].setAttribute("aria-pressed", String(on));
      });
      customLabel.classList.toggle("on", !!cur && !isPreset);
    }
    function paintAccent() {
      paintPressed();
      custom.value = S.state().settings.accent || T.PRESETS[0][1];
    }
    /* Beim Ziehen im Farbwähler sofort anzeigen, erst beim Schließen auf den lesbaren Wert einrasten */
    custom.addEventListener("input", function () { T.setAccent(custom.value); paintPressed(); });
    custom.addEventListener("change", function () { T.setAccent(custom.value); paintAccent(); });

    function toggle(key, text) {
      var inp = el("input", { type: "checkbox", class: "tgl-in", role: "switch", id: "view-" + key });
      inp.checked = !!S.state().settings.view[key];
      inp.addEventListener("change", function () { S.state().settings.view[key] = inp.checked; S.touch(); });
      return el("label", { class: "tgl", for: "view-" + key }, el("span", { text: text }), inp);
    }

    var fill = el("i");
    fill.style.width = "62%";
    paintMode();
    paintAccent();

    return fold("dar", "Darstellung", null, [
      el("p", { class: "hint", text: "System folgt der Einstellung deines Geräts. Schwarz ist ein echter Schwarz-Modus, der auf OLED-Bildschirmen Strom spart." }),
      seg,
      el("h3", { text: "Akzentfarbe" }),
      el("p", { class: "hint", text: "Die Farbe wird bei Bedarf leicht aufgehellt oder abgedunkelt, damit sie in jedem Modus gut lesbar bleibt." }),
      sw,
      el("div", { class: "preview", "aria-hidden": "true" },
        el("span", { class: "pill", text: "Vorschau" }),
        el("div", { class: "bar" }, fill),
        el("span", { class: "btn primary", text: "Knopf" })
      ),
      el("h3", { text: "Trainingsplan" }),
      toggle("sticky", "Kacheln oben anheften"),
      toggle("hideDone", "Erledigte Übungen nach unten"),
      el("h3", { text: "Steuerung" }),
      toggle("swipeNav", "Navigation swipen"),
      toggle("swipePage", "Seiten swipen")
    ]);
  }

  function daten(imp) {
    var msg = el("p", { class: "msg", role: "status", id: "set-msg" });
    function say(t, err) { msg.textContent = t || ""; msg.classList.toggle("err", !!err); }
    var day = C.ymd(new Date());
    var rem = App.reminder.settingsNode();

    return fold("bak", "Backup", null, [
      el("p", { class: "hint", text: "Sichert alles: Übungen, Trainingstage, Haken der Woche, Berichte und Einstellungen." }),
      F.canShareFiles() ? el("p", { class: "hint", id: "bak-share-hint", text: "„Backup speichern“ öffnet das Teilen-Menü deines Handys. Wähle dort zum Beispiel Google Drive, Dateien oder eine E-Mail an dich selbst, dann liegt die Sicherung außerhalb der App." }) : null,
      el("div", { class: "btns" },
        el("button", { type: "button", class: "btn", text: "Backup speichern", onclick: function () {
          var name = "trainingswoche-backup-" + day + ".json";
          F.save(name, B.toJson(), "application/json").then(function (r) {
            if (r === "ok") { App.reminder.markBackup(); rem.refresh(); say(F.canShareFiles() ? "Backup weitergegeben: " + name : "Datei erstellt: " + name); }
            else if (r === "unsupported") say("Speichern ist hier nicht möglich. Nutze „Backup kopieren“.", true);
            else if (r === "error") say("Das Speichern hat nicht geklappt. Nutze „Backup kopieren“.", true);
          });
        } }),
        el("button", { type: "button", class: "btn", text: "Backup kopieren", onclick: function () {
          F.copy(B.toJson()).then(function (ok) { if (ok) { App.reminder.markBackup(); rem.refresh(); } say(ok ? "In die Zwischenablage kopiert." : "Kopieren ist hier nicht möglich.", !ok); });
        } })
      ),
      msg,
      rem,
      el("h3", { text: "Backup einspielen" }),
      imp.node,
      el("h3", { text: "Woche zurücksetzen" }),
      el("p", { class: "hint", text: "Löscht nur die Haken und Zahlen der laufenden Woche. Gespeicherte Berichte, Übungen und Einstellungen bleiben." }),
      el("div", null, App.confirmButton("Woche zurücksetzen", "Wirklich zurücksetzen", function () {
        var has = Object.keys(S.state().done).length > 0;
        var saved = has ? B.snapshot("reset") : null;
        S.state().done = {};
        S.touch();
        flash = { to: "set", t: "Die laufende Woche ist zurückgesetzt." + (has ? hintUndo(saved) : "") };
        App.rerender();
      }))
    ]);
  }

  function sicherheit() {
    var u = B.undoInfo();
    var msg = el("p", { class: "msg", role: "status", id: "undo-msg" });
    var body = u
      ? [el("p", { class: "hint", id: "undo-info", text: "Letzte Kopie: " + App.diag.fmt(u.at) + ", " + u.label + ". Sie enthält " + plural(u.exercises, "Übung", "Übungen") + " und " + plural(u.reports, "Bericht", "Berichte") + "." }),
         el("div", { class: "btns" }, App.confirmButton("Wiederherstellen", "Wirklich wiederherstellen", function () {
           if (B.undoRestore()) flash = { to: "undo", t: "Wiederhergestellt. Der Stand davor liegt jetzt als Sicherheitskopie bereit." };
           App.rerender();
         }))]
      : [el("p", { class: "hint", id: "undo-info", text: "Noch keine Kopie vorhanden." })];
    return fold("undo", "Sicherheitskopie", "undo-card", [
      el("p", { class: "hint", text: "Vor dem Einspielen eines Backups und dem Zurücksetzen der Woche legt die App automatisch eine Kopie an. Es gibt immer nur die letzte, und sie liegt nur auf diesem Gerät." }),
      body[0], body[1] || null, msg
    ]);
  }

  function speicher() {
    return fold("spe", "Speicherung", null, [
      el("p", { class: "hint", text: S.cloud
        ? "Dein Stand wird auf diesem Gerät und in deinem Konto gespeichert und zwischen deinen Geräten abgeglichen. Der Status steht oben neben dem Titel."
        : "Dein Stand liegt nur auf diesem Gerät. Sichere ihn regelmäßig mit dem Backup." })
    ]);
  }

  function info() {
    var D = App.diag;
    var msg = el("p", { class: "msg", role: "status", id: "info-msg" });
    function say(t, err) { msg.textContent = t || ""; msg.classList.toggle("err", !!err); }
    var box = el("div", { class: "report-box" });

    var facts = el("dl", { class: "stats facts" });
    D.facts().forEach(function (r) { facts.append(el("div", null, el("dt", { text: r[0] }), el("dd", { text: r[1] }))); });

    var errs = D.errors();
    var errList = el("ul", { class: "errlog", id: "errlog" });
    errs.slice().reverse().forEach(function (e) {
      errList.append(el("li", null, el("time", { text: D.fmt(e.t) + (e.n > 1 ? " (" + e.n + "×)" : "") }), el("span", { text: e.m })));
    });

    var log = el("div", { class: "changelog" });
    App.changelog.forEach(function (c, i) {
      var ul = el("ul");
      c.items.forEach(function (t) { ul.append(el("li", { text: t })); });
      log.append(el("details", { class: "ver", open: i === 0 },
        el("summary", null, el("strong", { text: "Version " + c.v }), c.date ? el("span", { class: "d", text: new Date(c.date + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) }) : null),
        ul));
    });

    return fold("info", "Info und Diagnose", "info", [
      el("p", { class: "ver-line" }, "Trainingswoche App ", el("strong", { id: "ver", text: "Version " + App.version })),
      el("h3", { text: "Zustand" }),
      facts,
      el("h3", { text: "Fehlerprotokoll" }),
      errs.length ? errList : el("p", { class: "hint", id: "errlog", text: "Keine Fehler aufgezeichnet." }),
      el("div", { class: "btns" },
        el("button", { type: "button", class: "btn", text: "Diagnose kopieren", onclick: function () {
          var text = D.report();
          F.copy(text).then(function (ok) {
            box.replaceChildren();
            if (ok) { say("Diagnose kopiert. Du kannst sie jetzt einfügen und mir schicken."); return; }
            say("Kopieren ist hier nicht möglich. Markiere den Text unten und kopiere ihn.", true);
            var ta = el("textarea", { class: "in paste", id: "diag-text", rows: "8", readonly: true, "aria-label": "Diagnose" });
            ta.value = text;
            box.append(ta);
            ta.focus(); ta.select();
          });
        } }),
        errs.length ? el("button", { type: "button", class: "btn", text: "Fehlerprotokoll leeren", onclick: function () { D.clear(); flash = { to: "info", t: "Fehlerprotokoll geleert." }; App.rerender(); } }) : null
      ),
      msg, box,
      el("p", { class: "hint", text: "Die Diagnose enthält Zahlen und Zustände der App, aber keine Namen oder Werte deiner Übungen." }),
      el("h3", { text: "Änderungsprotokoll" }),
      log
    ]);
  }

  App.register({
    id: "optionen",
    label: "Einstellungen",
    title: "Einstellungen",
    icon: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
    render: function (root) {
      var imp = F.importBox({
        id: "bak",
        parse: function (text) {
          var r = B.parse(text);
          if (!r.ok) return r;
          var info = plural(r.exercises, "Übung", "Übungen") + ", " + plural(r.reports, "Bericht", "Berichte");
          var actions = [{
            label: "Alles ersetzen", confirm: "Wirklich ersetzen",
            run: function () { var saved = B.restore(r.state); flash = { to: "imp", t: "Backup eingespielt: " + info + "." + hintUndo(saved) }; App.rerender(); }
          }];
          if (r.reports) {
            actions.push({
              label: "Nur Berichte hinzufügen",
              run: function () { var saved = B.snapshot("merge"); flash = { to: "imp", t: plural(R.merge(r.state.reports), "Bericht", "Berichte") + " hinzugefügt." + hintUndo(saved) }; App.rerender(); }
            });
          }
          return { ok: true, text: "Backup gefunden: " + info + ". „Alles ersetzen“ überschreibt deine jetzigen Daten.", actions: actions };
        }
      });
      var inf = info();
      root.append(persoenlich(), darstellung(), App.notify.card(), daten(imp), sicherheit(), speicher(), inf);
      if (flash) {
        var target = { imp: "#bak-msg", set: "#set-msg", undo: "#undo-msg", info: "#info-msg" }[flash.to];
        var node = root.querySelector(target);
        if (node) { node.textContent = flash.t; var f = node.closest("details.fold"); if (f) App.fold.show(f.getAttribute("data-fold"), root); }
        flash = null;
      }
    }
  });
})();

</script>


<script>
(function () {
  var errs = [];
  window.addEventListener("error", function (e) { errs.push(String(e.message || e.error || "Fehler")); });
  window.addEventListener("load", function () {
    setTimeout(function () {
      var t = document.getElementById("title");
      if (window.App && t && t.textContent) return;
      var d = document.createElement("div");
      d.setAttribute("role", "alert");
      d.style.cssText = "margin:16px;padding:14px;border:2px solid #b3261e;border-radius:12px;background:#fff;color:#121c26;font:15px/1.4 system-ui,sans-serif";
      d.textContent = "Die App konnte nicht starten. " + (errs.length ? "Fehler: " + errs.slice(0, 3).join(" | ") : "Bitte die Seite neu laden. Hilft das nicht, alle Dateien neu hochladen.");
      document.body.prepend(d);
    }, 1500);
  });
})();
</script>
</body>
</html>
