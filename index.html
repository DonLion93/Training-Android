<script>
/* Backup (Daten): der ganze Stand als JSON, mit Prüfung beim Einspielen. Die Ansicht dazu steht in views/einstellungen.js. */
(function () {
  "use strict";
  var S = App.store;

  function toJson() {
    return JSON.stringify({ app: "trainingswoche", kind: "backup", v: 1, exportedAt: new Date().toISOString(), state: S.state() }) + "\n";
  }

  function parse(text) {
    if (typeof text !== "string" || !text.trim()) return { ok: false, error: "Es wurde kein Inhalt gefunden." };
    if (text.length > 3000000) return { ok: false, error: "Die Datei ist zu groß." };
    var obj;
    try { obj = JSON.parse(text.replace(/^﻿/, "")); } catch (e) { return { ok: false, error: "Das ist keine gültige JSON-Datei." }; }
    if (!obj || obj.app !== "trainingswoche") return { ok: false, error: "Diese Datei stammt nicht aus der Trainingswoche." };
    if (obj.kind === "reports") return { ok: false, error: "Das sind nur Berichte. Importiere sie im Reiter „Berichte“." };
    if (obj.kind !== "backup") return { ok: false, error: "Diese Datei ist kein Backup." };
    var st = S.clean(obj.state);
    if (!st) return { ok: false, error: "Das Backup ist beschädigt." };
    return { ok: true, state: st, exercises: st.exercises.length, reports: st.reports.length };
  }

  /* Sicherheitskopie: genau ein Platz im Browser. Vor jeder riskanten Aktion wird der aktuelle Stand abgelegt,
     damit man sie zurücknehmen kann. Die Kopie liegt nur auf diesem Gerät, nicht im Konto. */
  var UNDO_KEY = "trainingswoche-app-undo";
  var KINDS = {
    restore: "vor dem Einspielen eines Backups",
    merge: "vor dem Hinzufügen von Berichten",
    reset: "vor dem Zurücksetzen der Woche",
    undo: "vor dem Wiederherstellen einer Sicherheitskopie"
  };

  function snapshot(kind) {
    try {
      localStorage.setItem(UNDO_KEY, JSON.stringify({ v: 1, at: Date.now(), kind: KINDS[kind] ? kind : "restore", state: S.state() }));
      return true;
    } catch (e) {
      App.diag.log("Sicherheitskopie nicht möglich: " + (e && e.name));
      return false;
    }
  }

  function loadUndo() {
    try {
      var o = JSON.parse(localStorage.getItem(UNDO_KEY) || "null");
      if (!o || typeof o.at !== "number" || !KINDS[o.kind]) return null;
      var st = S.clean(o.state);
      return st ? { at: o.at, kind: o.kind, state: st } : null;
    } catch (e) { return null; }
  }

  function undoInfo() {
    var o = loadUndo();
    return o ? { at: o.at, label: KINDS[o.kind], exercises: o.state.exercises.length, reports: o.state.reports.length } : null;
  }

  /* Stellt die Sicherheitskopie wieder her. Der jetzige Stand wird dabei selbst zur Sicherheitskopie, man kann also hin und her wechseln. */
  function undoRestore() {
    var o = loadUndo();
    if (!o) return false;
    snapshot("undo");
    S.replace(o.state);
    return true;
  }

  /* Alles ersetzen, mit vorheriger Sicherheitskopie. Gibt zurück, ob die Kopie angelegt werden konnte. */
  function restore(st) {
    var saved = snapshot("restore");
    S.replace(st);
    return saved;
  }

  App.backup = { toJson: toJson, parse: parse, restore: restore, snapshot: snapshot, undoInfo: undoInfo, undoRestore: undoRestore };
})();

</script>
<script>
/* Backup-Erinnerung. Die App kann nicht von selbst benachrichtigen, deshalb zeigt der Trainingsplan einen Hinweis, wenn das letzte Backup
   länger her ist als eingestellt. Gespeichert wird nur auf diesem Gerät (eigener Schlüssel), nicht im Konto:
   { last: Zeit des letzten Backups, since: seit wann die App Daten kennt, snooze: bis wann nicht fragen, days: Abstand, 0 = aus }.
   Nur ein vollständiges Backup (Datei oder Kopie aus den Einstellungen) zählt. */
(function () {
  "use strict";
  var el = App.el, S = App.store;
  var KEY = "trainingswoche-app-backup";
  var DAY = 86400000;
  var DEFAULT_DAYS = 14, SNOOZE_DAYS = 3;
  var CHOICES = [[0, "Aus"], [7, "7 Tage"], [14, "14 Tage"], [30, "30 Tage"]];

  function load() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { o = null; }
    if (!o || typeof o !== "object") o = {};
    var days = CHOICES.some(function (c) { return c[0] === o.days; }) ? o.days : DEFAULT_DAYS;
    return { last: typeof o.last === "number" ? o.last : null, since: typeof o.since === "number" ? o.since : null, snooze: typeof o.snooze === "number" ? o.snooze : 0, days: days };
  }
  function save(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { return false; }
  }

  function hasData() {
    var st = S.state();
    return st.reports.length > 0 || Object.keys(st.done).length > 0;
  }

  /* Liefert { due, days, last, ageDays } für die aktuelle Zeit. due: Hinweis jetzt zeigen. */
  function status(now) {
    now = now == null ? Date.now() : now;
    var o = load();
    if (o.since === null && hasData()) { o.since = now; save(o); }
    var base = o.last !== null ? o.last : o.since;
    var age = base === null ? 0 : Math.floor((now - base) / DAY);
    return {
      days: o.days, last: o.last, ageDays: age,
      due: o.days > 0 && base !== null && hasData() && now - base >= o.days * DAY && now >= o.snooze
    };
  }

  function markBackup(now) {
    var o = load();
    o.last = now == null ? Date.now() : now;
    o.snooze = 0;
    return save(o);
  }
  function snooze(now) { var o = load(); o.snooze = (now == null ? Date.now() : now) + SNOOZE_DAYS * DAY; return save(o); }
  function setDays(d) { var o = load(); o.days = d; o.snooze = 0; return save(o); }

  function ageText(s) {
    if (s.last === null) return "Noch nicht gesichert";
    if (s.ageDays <= 0) return "Zuletzt gesichert: heute";
    return "Zuletzt gesichert: vor " + (s.ageDays === 1 ? "1 Tag" : s.ageDays + " Tagen");
  }

  /* Hinweiskarte für den Trainingsplan, oder null wenn nichts zu zeigen ist */
  function banner() {
    var s = status();
    if (!s.due) return null;
    var box = el("section", { class: "card remind", id: "remind", role: "region", "aria-label": "Backup-Erinnerung" });
    box.append(
      el("p", { class: "remind-t", text: (App.persona.nick() ? App.persona.nick() + ", " : "") + (s.last === null ? (App.persona.nick() ? "du hast" : "Du hast") + " noch kein Backup gemacht." : (App.persona.nick() ? "dein" : "Dein") + " letztes Backup ist " + s.ageDays + " Tage alt.") }),
      el("p", { class: "hint", text: "Ein Backup schützt deine Übungen und Berichte, falls dieses Gerät oder der Browser mal zurückgesetzt wird." }),
      el("div", { class: "btns" },
        el("button", { type: "button", class: "btn primary", text: "Jetzt sichern", onclick: function () {
          App.fold.show("bak");
          location.hash = "#optionen";
        } }),
        el("button", { type: "button", class: "btn", text: "Später", onclick: function () { snooze(); box.remove(); } }),
        el("button", { type: "button", class: "btn", text: "Nicht mehr erinnern", onclick: function () { setDays(0); box.remove(); } })
      )
    );
    return box;
  }

  /* Einstellung für den Block „Backup“ in den Einstellungen */
  function settingsNode() {
    var s0 = status();
    var info = el("p", { class: "hint", id: "bak-last" });
    var seg = el("div", { class: "seg", role: "group", "aria-label": "Backup-Erinnerung" });
    function paint() {
      var s = status();
      info.textContent = ageText(s) + (s.days ? ". Erinnerung nach " + s.days + " Tagen ohne Backup." : ". Erinnerung ist aus.");
      seg.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-d") === s.days)); });
    }
    CHOICES.forEach(function (c) {
      seg.append(el("button", { type: "button", "data-d": String(c[0]), text: c[1], onclick: function () { setDays(c[0]); paint(); } }));
    });
    paint();
    var wrap = el("div", { class: "remind-set" }, el("h3", { text: "Erinnerung" }),
      el("p", { class: "hint", text: "Der Trainingsplan zeigt einen Hinweis, wenn dein letztes Backup so lange her ist." }), seg, info);
    wrap.refresh = paint;
    return wrap;
  }

  App.reminder = { status: status, markBackup: markBackup, snooze: snooze, setDays: setDays, banner: banner, settingsNode: settingsNode, CHOICES: CHOICES };
})();

</script>
<script>
/* Trainingstag verschieben: nur für die laufende Woche, der feste Plan (Reiter Übungen) bleibt unberührt.
   Ein Verschieben macht den Quelltag zum Ruhetag und den Zieltag (ein Ruhetag) zum Trainingstag. Schon eingetragene Werte wandern mit.
   Im Stand steht state.shift = { base: der feste Plan (7 Wahrheitswerte), moves: [{ from, to }] }. state.days ist der Plan dieser Woche.
   Beim Wochenwechsel stellt der Speicher state.days aus base wieder her (store.js). Die Berichte bekommen die verschobenen Tage so, wie sie waren. */
(function () {
  "use strict";
  var S = App.store;
  var MAX_MOVES = 7;

  function info() {
    var sh = S.state().shift;
    return sh && sh.moves.length ? sh : null;
  }

  /* Freie Tage dieser Woche: alle Ruhetage */
  function targets(from) {
    var st = S.state();
    var out = [];
    for (var i = 0; i < 7; i++) if (i !== from && !st.days[i]) out.push(i);
    return out;
  }

  function canMove(from, to) {
    var st = S.state();
    if (from === to || from < 0 || from > 6 || to < 0 || to > 6) return false;
    if (!st.days[from] || st.days[to]) return false;
    var sh = st.shift;
    return !(sh && sh.moves.length >= MAX_MOVES);
  }

  function hasValues(d) { return !!d && Object.keys(d).length > 0; }

  function move(from, to) {
    if (!canMove(from, to)) return false;
    var st = S.state();
    if (!st.shift) st.shift = { base: st.days.slice(), moves: [] };
    st.days[from] = false;
    st.days[to] = true;
    /* Werte des Quelltags gehören zum Training und ziehen mit um. Alte Reste auf dem Ruhetag werden ersetzt. */
    if (hasValues(st.done[from])) { st.done[to] = st.done[from]; delete st.done[from]; }
    else if (st.done[to]) delete st.done[to];
    st.shift.moves.push({ from: from, to: to });
    S.touch();
    return true;
  }

  /* Alle Verschiebungen dieser Woche zurücknehmen, in umgekehrter Reihenfolge, Werte wandern zurück */
  function revert() {
    var st = S.state(), sh = st.shift;
    if (!sh) return false;
    for (var k = sh.moves.length - 1; k >= 0; k--) {
      var m = sh.moves[k];
      if (hasValues(st.done[m.to]) && !hasValues(st.done[m.from])) { st.done[m.from] = st.done[m.to]; delete st.done[m.to]; }
    }
    st.days = sh.base.slice();
    st.shift = null;
    S.touch();
    return true;
  }

  /* Letzte Verschiebung, die diesen Tag betrifft: { kind: "to" | "from", other } oder null */
  function note(day) {
    var sh = info();
    if (!sh) return null;
    var st = S.state();
    for (var k = sh.moves.length - 1; k >= 0; k--) {
      var m = sh.moves[k];
      if (m.to === day && st.days[day]) return { kind: "to", other: m.from };
      if (m.from === day && !st.days[day]) return { kind: "from", other: m.to };
    }
    return null;
  }

  App.shift = { info: info, targets: targets, canMove: canMove, move: move, revert: revert, note: note, MAX_MOVES: MAX_MOVES };
})();

</script>
<script>
/* Timer für Übungen mit Zeiteinheit (Sek. oder Min.), zum Beispiel Plank.
   Es läuft immer nur ein Timer. Er zählt nach der Uhrzeit und bleibt deshalb auch bei gesperrtem Bildschirm genau.
   Vor der eigentlichen Zeit läuft eine Vorbereitung von 2 Sekunden: die Anzeige startet bei −00:02, damit man nach dem Drücken
   in Position gehen kann. Erst ab 00:00 zählt die Zeit für Ziel und Eintrag.
   Die Zeit wird erst bei „Eintragen“ zum Wert der Übung addiert. Der Timer-Zustand liegt im Speicher und überlebt
   Reiterwechsel, aber kein Neuladen der Seite. Die Anzeige im Trainingsplan steht in views/plan.js. */
(function () {
  "use strict";
  var el = App.el;

  var t = null;     /* { day, id, name, unit, target, acc, since, fired, go, done } */
  var ui = null;    /* Elemente des gerade sichtbaren Timers */
  var iv = null, lock = null, audio = null, onChange = null;

  function supports(unit) { return unit === "Sek." || unit === "Min."; }
  function per(unit) { return unit === "Min." ? 60 : 1; }
  var LEAD_MS = 2000;  /* Vorbereitung vor dem Start der Zeit */
  function rawMs() { return t ? t.acc + (t.since ? Date.now() - t.since : 0) : 0; }
  /* Die Zeit der Übung ohne Vorbereitung */
  function elapsedMs() { return Math.max(0, rawMs() - LEAD_MS); }
  function leadLeft() { return t ? Math.max(0, Math.ceil((LEAD_MS - rawMs()) / 1000)) : 0; }
  function active() { return !!t && (!!t.since || t.acc > 0); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(sec) { sec = Math.max(0, Math.floor(sec)); return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60); }

  /* Wie viel zum Wert der Übung dazukommt, in ihrer eigenen Einheit */
  function amount() {
    var s = elapsedMs() / 1000;
    return t.unit === "Min." ? Math.round(s / 60) : Math.round(s);
  }

  function baseSec() { return (t.done ? t.done() : 0) * per(t.unit); }
  function goalSec() { return t.target * per(t.unit); }

  function beep() {
    try {
      if (!audio) return;
      if (audio.state === "suspended") audio.resume();
      for (var i = 0; i < 3; i++) {
        var o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime + i * 0.3;
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.25, at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.2);
        o.connect(g); g.connect(audio.destination);
        o.start(at); o.stop(at + 0.22);
      }
    } catch (e) { /* Ton ist nur eine Zugabe */ }
  }

  /* Kurzer Ton, wenn die Vorbereitung vorbei ist und die Zeit beginnt */
  function beepGo() {
    try {
      if (navigator.vibrate) navigator.vibrate(80);
      if (!audio) return;
      if (audio.state === "suspended") audio.resume();
      var o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime;
      o.frequency.value = 660;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.2, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);
      o.connect(g); g.connect(audio.destination);
      o.start(at); o.stop(at + 0.2);
    } catch (e) { /* Ton ist nur eine Zugabe */ }
  }

  function alertGoal() {
    t.fired = true;
    try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) { /* egal */ }
    beep();
    if (ui) ui.ann.textContent = "Ziel erreicht";
  }

  function requestLock() {
    try {
      if (!navigator.wakeLock || lock) return;
      navigator.wakeLock.request("screen").then(function (l) {
        if (!t || !t.since) { l.release(); return; }
        lock = l;
        l.addEventListener("release", function () { if (lock === l) lock = null; });
      }, function () { /* nicht erlaubt: der Bildschirm darf ausgehen */ });
    } catch (e) { /* egal */ }
  }
  function releaseLock() {
    try { if (lock) { lock.release(); lock = null; } } catch (e) { lock = null; }
  }

  function paint() {
    if (!ui || !t) return;
    /* Alles in ganzen Sekunden, damit Zeit und Rest zusammenpassen */
    var sec = Math.floor(elapsedMs() / 1000), total = baseSec() + sec, goal = goalSec(), n = amount();
    var lead = leadLeft();
    ui.time.textContent = lead > 0 ? "−" + fmt(lead) : fmt(sec);
    var rest;
    if (lead > 0 && t.since) {
      rest = "Gleich geht es los";
    } else if (total >= goal) {
      var over = total - goal;
      rest = over > 0 ? "Ziel erreicht, " + fmt(over) + " darüber" : "Ziel erreicht";
    } else {
      rest = "Noch " + fmt(goal - total) + " bis zum Ziel";
    }
    ui.rest.textContent = rest;
    ui.box.setAttribute("data-goal", String(total >= goal));
    ui.box.setAttribute("data-running", String(!!t.since));
    ui.main.textContent = t.since ? "Pause" : t.acc > 0 ? "Weiter" : "Start";
    ui.main.classList.toggle("primary", !t.since);
    ui.add.textContent = "+" + n + " " + t.unit + " eintragen";
    ui.add.disabled = n < 1;
    ui.discard.textContent = active() ? "Verwerfen" : "Schließen";
  }

  function tick() {
    if (!t) return;
    if (!t.go && t.since && rawMs() >= LEAD_MS) { t.go = true; beepGo(); }
    if (!t.fired && t.since && baseSec() + elapsedMs() / 1000 >= goalSec()) alertGoal();
    paint();
  }

  function stopAll() {
    clearInterval(iv); iv = null;
    releaseLock();
  }

  function start() {
    if (!t || t.since) return;
    try {
      if (!audio) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
      if (audio && audio.state === "suspended") audio.resume();
    } catch (e) { audio = null; }
    t.since = Date.now();
    if (rawMs() < LEAD_MS && ui) ui.ann.textContent = "Gleich geht es los";
    if (baseSec() >= goalSec() && t.acc === 0) t.fired = true; /* Ziel schon vor dem Start erreicht: kein Signal */
    clearInterval(iv);
    iv = setInterval(tick, 250);
    requestLock();
    paint();
    if (onChange) onChange();
  }

  function pause() {
    if (!t || !t.since) return;
    t.acc += Date.now() - t.since;
    t.since = null;
    stopAll();
    paint();
    if (onChange) onChange();
  }

  function discard() {
    stopAll();
    t = null; ui = null;
  }

  function commit() {
    var n = t ? amount() : 0;
    discard();
    return n;
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    if (t && t.since) requestLock();
    tick();
  });

  /* ctx: { e: Übung, done(): aktueller Wert, add(n): Zeit eintragen, close(): Anzeige schließen } */
  function panel(ctx) {
    if (!t) return null;
    t.done = ctx.done;
    t.target = ctx.e.target;
    t.unit = ctx.e.unit;
    t.name = ctx.e.name;
    var time = el("div", { class: "tm-time", role: "timer", "aria-label": "Zeit" });
    var rest = el("p", { class: "tm-rest" });
    var ann = el("span", { class: "vh", "aria-live": "polite" });
    var main = el("button", { type: "button", class: "btn primary", onclick: function () { if (t.since) pause(); else start(); } });
    var add = el("button", { type: "button", class: "btn", onclick: function () {
      var n = commit();
      if (n > 0) ctx.add(n);
      ctx.close();
    } });
    var discardBtn = el("button", { type: "button", class: "btn", onclick: function () { discard(); ctx.close(); } });
    var box = el("div", { class: "tm" },
      el("div", { class: "tm-top" }, time, rest),
      el("div", { class: "btns" }, main, add, discardBtn),
      ann
    );
    ui = { box: box, time: time, rest: rest, main: main, add: add, discard: discardBtn, ann: ann };
    paint();
    return box;
  }

  App.timer = {
    supports: supports,
    current: function () { return t ? { day: t.day, id: t.id, name: t.name } : null; },
    isOpen: function (day, id) { return !!t && t.day === day && t.id === id; },
    isActive: active,
    /* Wird nach Start und Pause aufgerufen, damit der Trainingsplan seine Timer-Knöpfe nachziehen kann */
    onChange: function (fn) { onChange = fn; },
    /* Öffnet den Timer für diese Übung, falls kein anderer offen ist */
    open: function (day, e) {
      if (!supports(e.unit)) return false;
      if (t) return t.day === day && t.id === e.id;
      t = { day: day, id: e.id, name: e.name, unit: e.unit, target: e.target, acc: 0, since: null, fired: false, go: false, done: null };
      return true;
    },
    closeIdle: function () { if (t && !active()) discard(); },
    discard: discard,
    panel: panel
  };
})();

</script>
<script>
/* Serie und Bestwerte, berechnet aus den Wochenberichten (inklusive der laufenden Woche).
   Eine Woche zählt als geschafft, wenn ihr Wochenziel 100 % erreicht, also genau die Zahl, die der Trainingsplan anzeigt.
   Eine Woche ohne Eintrag unterbricht die Serie. Die laufende Woche unterbricht sie nicht, solange sie noch läuft.
   compute() ist reine Rechnung, card() baut die Karte für den Reiter Berichte. */
(function () {
  "use strict";
  var el = App.el, C = App.calc, R = App.reports;
  var STRIP = 12;

  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function mondayOf(d) { return C.ymd(C.addDays(d, -((d.getDay() + 6) % 7))); }
  function prev(w) { return C.ymd(C.addDays(C.parseYmd(w), -7)); }
  function next(w) { return C.ymd(C.addDays(C.parseYmd(w), 7)); }

  /* list: Wochen wie R.all() sie liefert ({ w, d, live }), nach Woche sortiert. cur: Montag der laufenden Woche. */
  function compute(list, cur) {
    var weeks = {}, order = [];
    list.forEach(function (r) {
      var a = C.aggregate(r.d);
      var p = a.slots ? C.pct(a.perfAll) : null;
      weeks[r.w] = { w: r.w, live: !!r.live, pct: p, ok: p !== null && p >= 100, agg: a };
      order.push(r.w);
    });
    order.sort();

    /* Aktuelle Serie: ab der laufenden Woche, falls sie schon geschafft ist, sonst ab der Woche davor */
    var w = weeks[cur] && weeks[cur].ok ? cur : prev(cur), now = 0;
    /* Eine Woche ohne Bericht, in der alle Trainingstage pausiert sind, wird übersprungen */
    while (true) {
      if (weeks[w] && weeks[w].ok) now++;
      else if (!weeks[w] && App.pause.skipped(w)) { /* übersprungen */ }
      else break;
      w = prev(w);
    }

    var best = 0, run = 0, last = null;
    order.forEach(function (k) {
      if (!weeks[k].ok) { run = 0; last = null; return; }
      var n = last ? next(last) : null;
      while (n && n < k && App.pause.skipped(n)) n = next(n);
      run = last && n === k ? run + 1 : 1;
      last = k;
      if (run > best) best = run;
    });

    var reached = 0, total = 0;
    order.forEach(function (k) {
      var x = weeks[k];
      if (x.live && !x.ok) return;
      total++;
      if (x.ok) reached++;
    });

    var strip = [], k = cur, i;
    for (i = 0; i < STRIP; i++) { strip.unshift(k); k = prev(k); }
    strip = strip.map(function (wk) {
      var x = weeks[wk];
      return { w: wk, kw: C.isoWeek(C.parseYmd(wk)), live: wk === cur, pct: x ? x.pct : null, state: !x || x.pct === null ? "none" : x.ok ? "ok" : "miss" };
    });

    return { current: now, best: best, reached: reached, total: total, strip: strip, records: records(list, cur) };
  }

  /* Bestwerte je Übung (gleicher Name und gleiche Einheit): bester Tag und beste Woche.
     fresh: In der laufenden Woche wurde ein früherer Bestwert übertroffen. */
  function records(list, cur) {
    var map = {}, order = [];
    function slot(name, unit) {
      var key = name + "|" + unit;
      if (!map[key]) { map[key] = { name: name, unit: unit, day: { v: 0 }, week: { v: 0 }, base: { day: 0, week: 0 } }; order.push(key); }
      return map[key];
    }
    function pass(live) {
      list.forEach(function (r) {
        if (!!r.live !== live) return;
        var mon = C.parseYmd(r.w), sums = {};
        r.d.forEach(function (items, i) {
          if (!items) return;
          items.forEach(function (it) {
            var s = slot(it[0], it[1]), v = it[3];
            sums[it[0] + "|" + it[1]] = (sums[it[0] + "|" + it[1]] || 0) + v;
            if (v > s.day.v) { s.day = { v: v, date: C.ymd(C.addDays(mon, i)), w: r.w }; }
          });
        });
        Object.keys(sums).forEach(function (key) {
          var s = map[key];
          if (sums[key] > s.week.v) s.week = { v: sums[key], w: r.w, kw: C.isoWeek(mon) };
        });
      });
    }
    pass(false);
    order.forEach(function (key) { map[key].base = { day: map[key].day.v, week: map[key].week.v }; });
    pass(true);
    return order.map(function (key) {
      var s = map[key];
      return {
        name: s.name, unit: s.unit, day: s.day, week: s.week,
        freshDay: s.day.w === cur && s.base.day > 0 && s.day.v > s.base.day,
        freshWeek: s.week.w === cur && s.base.week > 0 && s.week.v > s.base.week
      };
    }).filter(function (r) { return r.day.v > 0; });
  }

  function dateText(ymd) { return C.parseYmd(ymd).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }); }

  function card() {
    var d = compute(R.all(), mondayOf(new Date()));
    var dots = el("div", { class: "wk-strip" });
    var n = { ok: 0, miss: 0, none: 0 };
    d.strip.forEach(function (x) {
      n[x.state]++;
      var label = "KW " + x.kw + (x.live ? " (läuft)" : "") + ": " + (x.pct === null ? "kein Eintrag" : x.pct + " %");
      dots.append(el("span", { class: "wk " + x.state + (x.live ? " live" : ""), title: label }));
    });
    dots.setAttribute("role", "img");
    dots.setAttribute("aria-label", "Letzte " + STRIP + " Wochen: " + n.ok + " geschafft, " + n.miss + " nicht geschafft, " + n.none + " ohne Eintrag");

    var recs = el("ul", { class: "recs" });
    d.records.forEach(function (r) {
      var li = el("li", null, el("strong", { text: r.name }));
      li.append(el("span", null, "Bester Tag: " + r.day.v + " " + r.unit + " am " + dateText(r.day.date), r.freshDay ? el("span", { class: "pill", text: "neu" }) : null));
      if (r.week.v > 0) li.append(el("span", null, "Beste Woche: " + r.week.v + " " + r.unit + " (KW " + r.week.kw + ")", r.freshWeek ? el("span", { class: "pill", text: "neu" }) : null));
      recs.append(li);
    });

    var dl = el("dl", { class: "stats" });
    [["Aktuelle Serie", plural(d.current, "Woche", "Wochen")],
     ["Längste Serie", plural(d.best, "Woche", "Wochen")],
     ["Wochen mit erreichtem Ziel", d.reached + " von " + d.total]].forEach(function (r) {
      dl.append(el("div", null, el("dt", { text: r[0] }), el("dd", { text: r[1] })));
    });

    return App.fold("rst", "Serie und Bestwerte", "stats-card", [
      dl, dots,
      el("div", { class: "legend" },
        el("span", null, el("i", { class: "wk ok" }), "geschafft"),
        el("span", null, el("i", { class: "wk miss" }), "nicht geschafft"),
        el("span", null, el("i", { class: "wk none" }), "kein Eintrag")
      ),
      el("p", { class: "hint", text: "Eine Woche zählt, wenn das Wochenziel 100 % erreicht. Eine Woche ohne Eintrag unterbricht die Serie, die laufende Woche nicht, solange sie noch läuft. Gezeigt werden die letzten " + STRIP + " Wochen." }),
      d.records.length ? el("h3", { text: "Bestwerte pro Übung" }) : null,
      d.records.length ? recs : null
    ]);
  }

  App.stats = { compute: compute, card: card };
})();

</script>
<script>
/* Aufklapper für Themenblöcke. App.fold(key, titel, id, kinder, offenAmAnfang) liefert eine Karte, die anfangs zu ist (außer offenAmAnfang ist wahr).
   Welche offen sind, merkt sich die App bis zum Neuladen (nach key). */
(function () {
  "use strict";
  var el = App.el;
  var openSet = {};

  function fold(key, title, domId, children, startOpen) {
    var d = el("details", { class: "card fold", "data-fold": key });
    if (domId) d.id = domId;
    d.open = openSet[key] === undefined ? !!startOpen : !!openSet[key];
    d.addEventListener("toggle", function () { openSet[key] = d.open; });
    /* Der Klick kommt vor dem Umschalten und vor dem (verzögerten) toggle-Ereignis, so geht nichts verloren, wenn gleich neu gezeichnet wird */
    var sum = el("summary", null, el("h2", { text: title }));
    sum.addEventListener("click", function () { openSet[key] = !d.open; });
    d.append(sum, el.apply(null, ["div", { class: "fold-body" }].concat(children.filter(Boolean))));
    return d;
  }

  /* Einen Block von außen öffnen (z. B. damit eine Meldung sichtbar ist). Wirkt auch auf einen schon gebauten Block. */
  fold.show = function (key, root) {
    openSet[key] = true;
    var d = root && root.querySelector('details.fold[data-fold="' + key + '"]');
    if (d) d.open = true;
  };

  App.fold = fold;
})();

</script>
<script>
/* Bestätigungsdialog im Seitendesign. Der Browser-Dialog confirm() steht in der Claude-Ansicht nicht zur Verfügung.
   App.dialog.confirm({ title, text, ok, cancel }) gibt ein Versprechen zurück: true bei Bestätigung, sonst false.
   Vorgewählt ist immer „Abbrechen“. Escape, Tippen neben den Dialog und Abbrechen verwerfen. */
(function () {
  "use strict";
  var el = App.el, n = 0;

  function confirm(o) {
    return new Promise(function (resolve) {
      var id = "dlg" + (++n);
      var prevFocus = document.activeElement, prevOverflow = document.body.style.overflow;
      var cancel = el("button", { type: "button", class: "btn", text: o.cancel || "Abbrechen" });
      var ok = el("button", { type: "button", class: "btn danger", text: o.ok || "OK" });
      var box = el("div", { class: "dlg", role: "alertdialog", "aria-modal": "true", "aria-labelledby": id + "-t", "aria-describedby": id + "-d" },
        el("h2", { id: id + "-t", text: o.title }),
        el("p", { id: id + "-d", text: o.text }),
        el("div", { class: "btns" }, cancel, ok)
      );
      var back = el("div", { class: "dlg-back" }, box);

      function done(v) {
        document.removeEventListener("keydown", key, true);
        back.remove();
        document.body.style.overflow = prevOverflow;
        try { if (prevFocus && document.contains(prevFocus)) prevFocus.focus(); } catch (e) { /* egal */ }
        resolve(v);
      }
      function key(ev) {
        if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); done(false); }
        else if (ev.key === "Tab") {
          ev.preventDefault();
          var f = [cancel, ok], i = f.indexOf(document.activeElement);
          f[i < 0 ? 0 : (i + (ev.shiftKey ? f.length - 1 : 1)) % f.length].focus();
        }
      }
      cancel.addEventListener("click", function () { done(false); });
      ok.addEventListener("click", function () { done(true); });
      back.addEventListener("click", function (ev) { if (ev.target === back) done(false); });
      document.addEventListener("keydown", key, true);
      document.body.style.overflow = "hidden";
      document.body.append(back);
      cancel.focus();
    });
  }

  /* Infofenster ohne Entscheidung: App.dialog.info({ title, body: Knoten }). Schließen mit Knopf, Escape oder Tippen daneben. */
  function info(o) {
    var id = "dlg" + (++n);
    var prevFocus = document.activeElement, prevOverflow = document.body.style.overflow;
    var close = el("button", { type: "button", class: "btn", text: "Schließen" });
    var box = el("div", { class: "dlg dlg-info", role: "dialog", "aria-modal": "true", "aria-labelledby": id + "-t" },
      el("h2", { id: id + "-t", text: o.title }), o.body, el("div", { class: "btns one" }, close));
    var back = el("div", { class: "dlg-back" }, box);
    function done() {
      document.removeEventListener("keydown", key, true);
      back.remove();
      document.body.style.overflow = prevOverflow;
      try { if (prevFocus && document.contains(prevFocus)) prevFocus.focus(); } catch (e) { /* egal */ }
    }
    function key(ev) {
      if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); done(); }
      else if (ev.key === "Tab") { ev.preventDefault(); close.focus(); }
    }
    close.addEventListener("click", done);
    back.addEventListener("click", function (ev) { if (ev.target === back) done(); });
    document.addEventListener("keydown", key, true);
    document.body.style.overflow = "hidden";
    document.body.append(back);
    close.focus();
  }

  App.dialog = { confirm: confirm, info: info };
})();

</script>
<script>
/* Eingabefelder über der Bildschirmtastatur: Tippt man in ein Textfeld, wird die Seite so gescrollt, dass das Feld im oberen Teil
   des sichtbaren Bereichs steht und die Tastatur es nicht verdeckt. Das gilt für jedes Feld der App, ohne dass ein Modul etwas tun muss.
   Damit auch Felder ganz unten hochkommen, bekommt die Seite während der Eingabe unten Platz (Klasse kb-open auf <html>, siehe CSS).
   Die Tastatur lässt sich nicht direkt messen (eingebettete Seiten melden sie oft nicht), deshalb zielt die Rechnung auf das obere Drittel. */
(function () {
  "use strict";
  var TYPES = /^(text|search|number|tel|email|url|password)$/;
  var root = document.documentElement;
  var timers = [], hideTimer = null;

  function isField(t) {
    if (!t || !t.tagName) return false;
    if (t.tagName === "TEXTAREA") return !t.readOnly && !t.disabled;
    return t.tagName === "INPUT" && TYPES.test(t.type || "text") && !t.readOnly && !t.disabled;
  }

  function visibleHeight() {
    var h = window.innerHeight, vv = window.visualViewport;
    return vv && vv.height ? Math.min(h, vv.height) : h;
  }

  /* Liegt das Feld nicht im oberen Teil des sichtbaren Bereichs, scrolle es dorthin */
  function reveal() {
    var t = document.activeElement;
    if (!isField(t)) return;
    var vh = visibleHeight();
    var r = t.getBoundingClientRect();
    var tall = r.height > vh * 0.4;
    var wantTop = tall ? vh * 0.1 : vh * 0.2;
    var fits = r.top >= vh * 0.05 && (tall ? r.top <= vh * 0.3 : r.bottom <= vh * 0.45);
    if (fits) return;
    var top = Math.max(0, r.top + window.pageYOffset - wantTop);
    try { window.scrollTo({ top: top, behavior: "smooth" }); } catch (e) { window.scrollTo(0, top); }
  }

  function later() {
    timers.forEach(clearTimeout);
    /* die Tastatur braucht einen Moment zum Einblenden und ändert dabei den sichtbaren Bereich */
    timers = [60, 350, 800].map(function (ms) { return setTimeout(reveal, ms); });
  }

  document.addEventListener("focusin", function (e) {
    if (!isField(e.target)) return;
    clearTimeout(hideTimer);
    root.classList.add("kb-open");
    later();
  });
  document.addEventListener("focusout", function () {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      if (!isField(document.activeElement)) root.classList.remove("kb-open");
    }, 250);
  });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", function () {
    if (isField(document.activeElement)) later();
  });
  window.addEventListener("orientationchange", function () { if (isField(document.activeElement)) later(); });
  /* Wächst ein mehrzeiliges Feld beim Tippen, bleibt die Schreibstelle im Blick */
  document.addEventListener("input", function (e) {
    if (e.target && e.target.tagName === "TEXTAREA" && isField(e.target)) {
      clearTimeout(timers[0]);
      timers[0] = setTimeout(reveal, 80);
    }
  });

  App.keyboard = { reveal: reveal };
})();

</script>
<script>
/* Benachrichtigungen (Erinnerungen). Gedacht für die Android-App (Capacitor, Plugin "LocalNotifications"): dort plant das Handy
   die Meldungen selbst, ohne Server. Im Browser und in der installierten Web-App gibt es sie nicht, die Einstellungen lassen sich aber schon bearbeiten.
   Zwei Arten:
   - Training: an einem Trainingstag, zur eingestellten Uhrzeit (Standard 20:00), wenn der Tag noch keine 100 % hat.
   - Gewicht: sonntags, zur eingestellten Uhrzeit (Standard 18:00), wenn für den Tag noch kein Gewicht eingetragen ist.
   Ein Handy kann eine Meldung nicht "nur wenn" auslösen. Deshalb plant die App die Meldungen der nächsten 14 Tage im Voraus
   und rechnet bei jeder Änderung neu: Wer sein Training oder Gewicht einträgt, nimmt die Meldung dieses Tages damit zurück.
   Öffnet man die App länger als 14 Tage nicht, laufen die geplanten Meldungen aus. */
(function () {
  "use strict";
  var el = App.el, C = App.calc, S = App.store;
  var DAYS_AHEAD = 14, CHANNEL = "erinnerungen", TEST_ID = 1;
  var KIND = { train: 1, weight: 2 };
  var TITLE = { train: "Training", weight: "Gewicht" };

  function cfg() { return S.state().settings.notify; }

  /* {name} wird zum Spitznamen. Ohne Spitznamen entfällt er samt Leerzeichen: "Hey {name}, los" wird "Hey, los". */
  function render(text, nick) {
    if (nick) return text.replace(/\{name\}/g, nick);
    return text.replace(/\s*\{name\}/g, "").replace(/^\s*[,.!:;-]\s*/, "").trim();
  }

  function atTime(day, hhmm) {
    var p = hhmm.split(":");
    return new Date(day.getFullYear(), day.getMonth(), day.getDate(), +p[0], +p[1], 0, 0);
  }

  /* Wochentag eines Datums, 0 = Montag */
  function wdOf(d) { return (d.getDay() + 6) % 7; }

  /* Reine Rechnung: welche Meldungen sind ab jetzt geplant? st = Stand, now = Zeitpunkt, nick = Spitzname */
  function plan(st, now, nick) {
    var n = st.settings.notify, out = [];
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var base = st.shift ? st.shift.base : st.days;           /* Trainingstage für Wochen nach der laufenden */
    var weights = {};
    st.weights.forEach(function (x) { weights[x.d] = 1; });
    for (var i = 0; i < DAYS_AHEAD; i++) {
      var day = C.addDays(today, i), key = C.ymd(day), wd = wdOf(day);
      var mon = C.ymd(C.addDays(day, -wd)), cur = mon === st.weekStart;
      if (n.train.on) {
        var at = atTime(day, n.train.time);
        if (at > now) {
          var train = cur ? !!st.days[wd] : !!base[wd];
          var paused = st.pauses.indexOf(key) >= 0;
          var open = true;
          if (cur) {
            var items = C.dayItems(st, wd), a = items ? C.aggregate([items]) : null;
            open = !!a && a.slots > 0 && C.pct(a.perfAll) < 100;
          }
          if (train && !paused && open) out.push({ key: key, kind: "train", at: at, body: render(n.train.text, nick) });
        }
      }
      if (n.weight.on && wd === 6) {
        var wat = atTime(day, n.weight.time);
        if (wat > now && !weights[key]) out.push({ key: key, kind: "weight", at: wat, body: render(n.weight.text, nick) });
      }
    }
    out.forEach(function (x) { x.id = Number(x.key.replace(/-/g, "")) * 10 + KIND[x.kind]; x.title = TITLE[x.kind]; });
    return out;
  }

  /* --- Brücke zum Handy --- */
  function plugin() {
    var c = window.Capacitor;
    try { if (!c || !c.isNativePlatform || !c.isNativePlatform()) return null; } catch (e) { return null; }
    /* Je nach Capacitor-Version steht das Plugin unter Capacitor.Plugins oder wird über registerPlugin geholt */
    try {
      if (c.Plugins && c.Plugins.LocalNotifications) return c.Plugins.LocalNotifications;
      if (typeof c.registerPlugin === "function") return c.registerPlugin("LocalNotifications");
    } catch (e) { /* kein Plugin */ }
    return null;
  }

  var perm = null;            /* "granted", "denied", "prompt" oder null (unbekannt) */
  var busy = false, again = false, asked = false, timer = null, statusNode = null, allowNode = null;

  function paintStatus() {
    if (!statusNode) return;
    var txt;
    if (!plugin()) txt = "Die Erinnerungen funktionieren in der Android-App. Hier im Browser kannst du sie schon einstellen, sie werden aber nicht gesendet.";
    else if (perm === "granted") txt = "Benachrichtigungen sind erlaubt.";
    else if (perm === "denied") txt = "Benachrichtigungen sind für die App ausgeschaltet. Erlaube sie in den Handy-Einstellungen unter Apps > Trainingswoche > Benachrichtigungen.";
    else txt = "Die App braucht noch die Erlaubnis für Benachrichtigungen.";
    statusNode.textContent = txt;
    if (allowNode) allowNode.hidden = !(plugin() && perm !== "granted" && perm !== "denied");
  }

  function run() {
    var P = plugin();
    if (!P) return;
    if (busy) { again = true; return; }
    busy = true;
    var list = plan(S.state(), new Date(), App.persona.get().nick);
    Promise.resolve().then(function () { return P.checkPermissions(); }).then(function (r) {
      if ((r.display === "prompt" || r.display === "prompt-with-rationale") && !asked && list.length) {
        asked = true;   /* nur einmal pro Start nachfragen */
        return P.requestPermissions();
      }
      return r;
    }).then(function (r) {
      perm = r.display === "prompt-with-rationale" ? "prompt" : r.display;
      if (perm !== "granted") return null;
      return Promise.resolve(P.createChannel ? P.createChannel({ id: CHANNEL, name: "Erinnerungen", description: "Erinnerungen an Training und Gewicht", importance: 4, visibility: 1, vibration: true }) : null)
        .catch(function () { /* Kanal gibt es schon oder wird nicht unterstützt */ })
        .then(function () { return P.getPending(); })
        .then(function (p) {
          var ids = (p.notifications || []).filter(function (x) { return x.id !== TEST_ID; }).map(function (x) { return { id: x.id }; });
          return ids.length ? P.cancel({ notifications: ids }) : null;
        })
        .then(function () {
          if (!list.length) return null;
          return P.schedule({ notifications: list.map(function (x) {
            return { id: x.id, title: x.title, body: x.body, channelId: CHANNEL, schedule: { at: x.at, allowWhileIdle: true } };
          }) });
        });
    }).catch(function (e) {
      App.diag.log("Benachrichtigungen: " + String(e && e.message ? e.message : e).slice(0, 120));
    }).then(function () {
      busy = false;
      paintStatus();
      if (again) { again = false; run(); }
    });
  }

  function sync() {
    if (!plugin()) return;
    clearTimeout(timer);
    timer = setTimeout(run, 700);
  }

  function allow() {
    var P = plugin();
    if (!P) return;
    P.requestPermissions().then(function (r) { perm = r.display; paintStatus(); sync(); }, function () { /* abgebrochen */ });
  }

  function test() {
    var P = plugin();
    if (!P) return Promise.resolve(false);
    var nick = App.persona.get().nick;
    return P.requestPermissions().then(function (r) {
      perm = r.display;
      paintStatus();
      if (r.display !== "granted") return false;
      return Promise.resolve(P.createChannel ? P.createChannel({ id: CHANNEL, name: "Erinnerungen", importance: 4, visibility: 1 }) : null).catch(function () {}).then(function () {
        return P.schedule({ notifications: [{ id: TEST_ID, title: "Test", body: render(cfg().train.text, nick), channelId: CHANNEL, schedule: { at: new Date(Date.now() + 5000), allowWhileIdle: true } }] });
      }).then(function () { return true; });
    }).catch(function () { return false; });
  }

  /* --- Einstellungen --- */
  function block(key, heading, help) {
    var c = cfg()[key], D = S.NOTIFY_DEFAULTS[key], base = "ntf-" + key;
    var on = el("input", { type: "checkbox", class: "tgl-in", role: "switch", id: base + "-on" });
    on.checked = c.on;
    var time = el("input", { type: "time", class: "in time", id: base + "-time", "aria-label": heading + ", Uhrzeit" });
    time.value = c.time;
    var text = el("input", { type: "text", class: "in", id: base + "-text", maxlength: "140", "aria-label": heading + ", Text" });
    text.value = c.text;
    var prev = el("p", { class: "hint ntf-prev", id: base + "-prev" });
    function paintPrev() { prev.textContent = "Vorschau: " + render(cfg()[key].text, App.persona.get().nick); }
    function paintOff() { time.disabled = text.disabled = !cfg()[key].on; }
    on.addEventListener("change", function () { cfg()[key].on = on.checked; paintOff(); S.touch(); });
    time.addEventListener("change", function () {
      if (/^([01]\d|2[0-3]):[0-5]\d$/.test(time.value)) { cfg()[key].time = time.value; S.touch(); }
      else time.value = cfg()[key].time;
    });
    text.addEventListener("input", function () {
      var t = text.value.replace(/\s+/g, " ").trim().slice(0, 140);
      if (t) { cfg()[key].text = t; S.touch(); paintPrev(); }
    });
    text.addEventListener("blur", function () { text.value = cfg()[key].text; });
    var reset = el("button", { type: "button", class: "btn", id: base + "-reset", text: "Text zurücksetzen", onclick: function () {
      cfg()[key].text = D.text; text.value = D.text; S.touch(); paintPrev();
    } });
    paintPrev(); paintOff();
    return el("section", { class: "ntf-block" },
      el("label", { class: "tgl", for: base + "-on" }, el("strong", { text: heading }), on),
      el("p", { class: "hint", text: help }),
      el("div", { class: "line" }, el("label", { class: "lab", for: base + "-time", text: "Uhrzeit" }), time),
      el("div", { class: "line ntf-text" }, el("label", { class: "lab", for: base + "-text", text: "Text" }), text),
      prev,
      el("div", null, reset));
  }

  function card() {
    statusNode = el("p", { class: "hint", id: "ntf-status", role: "status" });
    var allowBtn = allowNode = el("button", { type: "button", class: "btn primary", id: "ntf-allow", text: "Benachrichtigungen erlauben", onclick: allow });
    var testMsg = el("p", { class: "msg", role: "status", id: "ntf-test-msg" });
    var native = !!plugin();
    var kids = [
      statusNode,
      el("div", null, allowBtn),
      block("train", "Training: nicht aufgeben", "Kommt an Trainingstagen zur Uhrzeit, wenn du noch keine 100 % erreicht hast. Pausentage zählen nicht."),
      block("weight", "Sonntag: Gewicht eintragen", "Kommt sonntags zur Uhrzeit, wenn für den Tag noch kein Gewicht eingetragen ist."),
      el("p", { class: "hint", text: "{name} wird durch deinen Spitznamen ersetzt, den du unter Persönliche Angaben einträgst. Ohne Spitznamen entfällt er." })
    ];
    if (native) {
      kids.push(el("div", null, el("button", { type: "button", class: "btn", id: "ntf-test", text: "Test in 5 Sekunden", onclick: function () {
        testMsg.classList.remove("err");
        testMsg.textContent = "";
        test().then(function (ok) {
          testMsg.classList.toggle("err", !ok);
          testMsg.textContent = ok ? "Die Test-Meldung kommt in 5 Sekunden. Lege die App ruhig in den Hintergrund." : "Das hat nicht geklappt. Prüfe, ob Benachrichtigungen erlaubt sind.";
        });
      } })), testMsg);
    }
    kids.push(el("p", { class: "hint", text: "Kommen die Meldungen verspätet oder gar nicht, schränkt dein Handy die App im Hintergrund ein. Erlaube der App dann in den Handy-Einstellungen unter Akku, im Hintergrund zu laufen (bei Huawei und Xiaomi „Autostart“ und „Keine Einschränkung“). Die Meldungen sind für die nächsten 14 Tage geplant und werden bei jedem Öffnen und jeder Änderung neu berechnet." }));
    var node = App.fold("ntf", "Benachrichtigungen", "notify", kids);
    paintStatus();
    return node;
  }

  /* Neu berechnen bei Änderungen, beim Öffnen und beim Zurückkehren in die App */
  S.onChange(sync);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) sync(); });
  document.addEventListener("DOMContentLoaded", function () { setTimeout(sync, 1500); });

  App.notify = { plan: plan, render: render, card: card, sync: sync, run: run, test: test, permission: function () { return perm; } };
})();

</script>
<script>
/* Vergleich: mehrere Wochen oder Monate auswählen und als Diagramm nebeneinander sehen.
   Gesamtleistung als Balken, dazu je Übung ein kleines Diagramm und eine Tabelle mit den Werten.
   App.compare.view(build) liefert die Ansicht. build("weeks" | "months") gibt die Zeilen wie in views/berichte.js zurück
   ({ key, label, title, live, agg }), aufsteigend nach Zeit. */
(function () {
  "use strict";
  var el = App.el, C = App.calc;
  var MAX = 12, DEFAULT = 4;
  var base = "weeks";
  var picked = { weeks: null, months: null }; /* Schlüssel der gewählten Zeilen, null = noch nichts gewählt (Standard) */

  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  function colClass(p, live) { return "col" + (live ? " live" : "") + (p === 100 ? " full" : "") + (p > 100 ? " over" : ""); }

  /* Eine Balkenreihe. items: [{ p: Prozent | null, label, title, live }] */
  function bars(items, max, mini) {
    var plot = el("div", { class: "plot" + (mini ? " mini" : "") });
    var goal = el("div", { class: "goal" });
    goal.style.bottom = (100 / max * 100) + "%";
    plot.append(goal);
    var xl = el("div", { class: "xl", "aria-hidden": "true" });
    items.forEach(function (it) {
      var col = el("div", { class: it.p === null ? "col" : colClass(it.p, it.live), role: "img", title: it.title + ": " + (it.p === null ? "keine Daten" : it.p + " %"),
        "aria-label": it.title + ": " + (it.p === null ? "keine Daten" : it.p + " Prozent") + (it.live ? ", läuft noch" : "") });
      if (it.p !== null) {
        var b = el("div", { class: "b" }, el("span", { class: "v", text: String(it.p) }));
        b.style.height = (it.p / max * 100) + "%";
        C.tint(b, it.p);
        col.append(b);
      }
      plot.append(col);
      xl.append(el("span", { text: it.label }));
    });
    return [plot, xl];
  }

  function scale(values) {
    var hi = Math.max.apply(null, values.concat([0]));
    return Math.max(120, Math.ceil(hi * 1.15 / 20) * 20);
  }

  function view(build) {
    var holder = el("div", { class: "cmp" });
    var seg = el("div", { class: "seg", role: "group", "aria-label": "Vergleich von" });
    var msg = el("p", { class: "msg", role: "status", id: "cmp-msg" });

    function paint() {
      var rows = build(base);
      var keys = rows.map(function (r) { return r.key; });
      var sel = (picked[base] || keys.slice(-DEFAULT)).filter(function (k) { return keys.indexOf(k) >= 0; });
      picked[base] = sel;
      seg.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-base") === base)); });
      holder.replaceChildren();

      function set(list) { picked[base] = list.slice(-MAX); paint(); }

      /* Auswahl */
      var pick = el("div", { class: "pick", role: "group", "aria-label": base === "weeks" ? "Wochen auswählen" : "Monate auswählen" });
      rows.slice().reverse().forEach(function (r) {
        pick.append(el("button", {
          type: "button", class: "chip", "aria-pressed": String(sel.indexOf(r.key) >= 0), "data-key": r.key, text: r.title + (r.live ? " ·" : ""),
          onclick: function () {
            var i = sel.indexOf(r.key);
            if (i >= 0) { set(sel.filter(function (k) { return k !== r.key; })); return; }
            if (sel.length >= MAX) { paint(); msg.textContent = "Es passen höchstens " + MAX + " gleichzeitig ins Diagramm."; return; }
            set(sel.concat([r.key]));
          }
        }));
      });
      function quick(label, n) {
        return el("button", { type: "button", class: "btn", text: label, onclick: function () { set(keys.slice(-n)); } });
      }
      var chosen = rows.filter(function (r) { return sel.indexOf(r.key) >= 0; });

      holder.append(el("section", { class: "card" },
        el("h2", { text: "Vergleich" }),
        el("p", { class: "hint", text: "Wähle " + (base === "weeks" ? "Wochen" : "Monate") + " aus, die du nebeneinander sehen möchtest (höchstens " + MAX + ")." }),
        seg,
        el("div", { class: "quick" }, quick("Letzte 4", 4), quick("Letzte 8", 8), quick("Letzte " + MAX, MAX),
          el("button", { type: "button", class: "btn", text: "Auswahl leeren", onclick: function () { set([]); } })),
        pick,
        el("p", { class: "hint", text: plural(chosen.length, base === "weeks" ? "Woche" : "Monat", base === "weeks" ? "Wochen" : "Monate") + " ausgewählt. Das Zeichen · markiert einen laufenden Zeitraum." }),
        msg
      ));

      if (chosen.length < 2) {
        holder.append(el("section", { class: "card" }, el("div", { class: "empty" },
          el("strong", { text: chosen.length ? "Wähle noch mindestens einen weiteren Zeitraum" : "Noch nichts ausgewählt" }),
          el("p", { text: "Für den Vergleich brauchst du mindestens zwei " + (base === "weeks" ? "Wochen" : "Monate") + "." })
        )));
        return;
      }

      /* Gesamtleistung */
      var items = chosen.map(function (r) { return { p: C.pct(r.agg.perfAll), label: r.label, title: r.title, live: r.live }; });
      var first = items[0].p, last = items[items.length - 1].p, diff = last - first;
      var best = items.reduce(function (b, it) { return !b || it.p > b.p ? it : b; }, null);
      var avg = chosen.reduce(function (s, r) { return s + r.agg.perfAll; }, 0) / chosen.length;
      var trend = diff === 0 ? "unverändert" : (diff > 0 ? "+" : "−") + Math.abs(diff) + " Punkte";
      var main = bars(items, scale(items.map(function (i) { return i.p; })), false);
      var overall = App.fold("cvo", "Gesamtleistung", "cmp-overall", [
        el("p", { class: "hint", text: "Leistung in Prozent vom Ziel, ältester Zeitraum links." }),
        el.apply(null, ["div", { class: "legend" }].concat(C.legendItems(), [el("span", null, el("i", { class: "d" }), "Ziel (100 %)")])),
        main[0], main[1],
        el("p", { class: "sum", id: "cmp-sum", text: "Ø " + C.pct(avg) + " % · Bestwert " + best.p + " % (" + best.title + ") · Verlauf von " + chosen[0].title + " zu " + chosen[chosen.length - 1].title + ": " + trend })
      ], true);
      holder.append(overall);

      /* Je Übung: gleiche Namen und Einheiten werden zusammengefasst, wie in den Berichten */
      var exKeys = [], seen = {};
      chosen.forEach(function (r) { r.agg.order.forEach(function (k) { if (!seen[k]) { seen[k] = 1; exKeys.push(k); } }); });
      if (exKeys.length) {
        var per = {}, all = [];
        exKeys.forEach(function (k) {
          per[k] = chosen.map(function (r) {
            var t = r.agg.byEx[k];
            var p = t && t.g > 0 ? C.pct(t.v / t.g) : null;
            if (p !== null) all.push(p);
            return { p: p, label: r.label, title: r.title, live: r.live };
          });
        });
        var mx = scale(all);
        var box = el("div", { class: "cmp-ex" });
        exKeys.forEach(function (k) {
          var name = k.split("|")[0], unit = k.split("|")[1];
          var b = bars(per[k], mx, true);
          box.append(el("div", { class: "cmp-one", "data-ex": name }, el("h3", { text: name + (unit ? " (" + unit + ")" : "") }), b[0], b[1]));
        });
        holder.append(App.fold("cve", "Je Übung", "cmp-ex", [
          el("p", { class: "hint", text: "Gleiche Skala für alle Übungen. Eine Lücke heißt: in diesem Zeitraum gab es die Übung nicht." }),
          box]));
      }

      /* Tabelle: dieselben Zahlen zum Nachlesen und für Screenreader */
      var tbl = el("table", { class: "tbl" },
        el("thead", null, el("tr", null, el("th", { scope: "col", text: "Zeitraum" }), el("th", { scope: "col", text: "Leistung" }), el("th", { scope: "col", text: "Erreicht" }), el("th", { scope: "col", text: "Tage komplett" }))),
        el("tbody"));

<script>
/* Trainingskalender: eine Monatsansicht, in der jeder Tag nach Erfüllung gefärbt ist.
   Daten: archivierte Wochen (App.reports.all()) plus die laufende Woche aus dem Plan.
   Wochen ohne Bericht zwischen der ersten bekannten Woche und heute zählen die Trainingstage deines jetzigen Plans als verpasst. */
(function () {
  "use strict";
  var el = App.el, C = App.calc;
  var selDate = null;  /* gewählter Tag, bis zum Neuladen gemerkt */
  var month = null;   /* erster Tag des gezeigten Monats, bis zum Neuladen gemerkt */

  function ymd(d) { return C.ymd(d); }
  function first(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function monthOf(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1); }

  /* Karte Datum -> { state, pct, done, total }. state: ok, part, miss, open (heute, noch nichts), rest, future, none (unbekannt) */
  function build() {
    var st = App.store.state(), today = ymd(new Date()), cur = st.weekStart;
    var byWeek = {}, firstW = cur;
    App.reports.all().forEach(function (r) { byWeek[r.w] = r.d; if (r.w < firstW) firstW = r.w; });
    byWeek[cur] = C.allDays(st);
    var out = {}, pz = {};
    st.pauses.forEach(function (d) { pz[d] = 1; });
    var w = firstW;
    while (w <= cur) {
      var mon = C.parseYmd(w);
      for (var i = 0; i < 7; i++) {
        var key = ymd(C.addDays(mon, i));
        var items = byWeek[w] ? byWeek[w][i] : (st.days[i] ? [] : null);   /* Woche ohne Bericht: jetziger Plan */
        var gap = !byWeek[w];
        if (pz[key]) { out[key] = { state: "pause" }; continue; }
        if (key > today) { out[key] = { state: "future" }; continue; }
        if (!items) { out[key] = { state: "rest" }; continue; }
        var a = C.aggregate([items.length ? items : null]);
        if (!items.length || !a.slots) { out[key] = { state: key === today ? "open" : "miss", pct: 0 }; continue; }
        var pct = C.pct(a.perfAll);
        if (a.fullDays === 1) out[key] = { state: "ok", pct: pct, done: a.reached, total: a.slots };
        else if (a.started > 0) out[key] = { state: "part", pct: pct, done: a.reached, total: a.slots };
        else out[key] = { state: key === today ? "open" : "miss", pct: 0, done: 0, total: a.slots };
        if (gap) out[key].gap = true;
      }
      w = ymd(C.addDays(mon, 7));
    }
    /* Pausentage außerhalb des Zeitraums oben (zum Beispiel geplanter Urlaub) */
    st.pauses.forEach(function (d) { if (!out[d]) out[d] = { state: "pause" }; });
    return { days: out, firstW: firstW };
  }

  var WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  var NAME = { ok: "alle Ziele erreicht", part: "teilweise", miss: "nicht trainiert", open: "heute noch offen", rest: "Ruhetag", pause: "Pause", future: "noch nicht", none: "keine Daten" };

  function mondayOf(date) { return ymd(C.addDays(C.parseYmd(date), -((C.parseYmd(date).getDay() + 6) % 7))); }

  /* Pausieren geht für die laufende Woche und später sowie für Wochen ohne Bericht. Berichte vergangener Wochen ändern sich nicht. */
  function canPause(date, x) {
    var st = App.store.state();
    if (x.state === "ok" || x.state === "part" || x.state === "none") return false;
    if (date >= st.weekStart) return true;
    var w = mondayOf(date);
    return !st.reports.some(function (r) { return r.w === w; });
  }

  function card() {
    var data = build();
    var today = new Date();
    if (!month) month = first(today);
    var minM = first(C.parseYmd(data.firstW)), maxM = monthOf(first(today), 3);
    if (month < minM) month = minM;
    if (month > maxM) month = maxM;

    var title = el("p", { class: "cal-title", id: "cal-title", "aria-live": "polite" });
    var prev = el("button", { type: "button", class: "btn cal-nav", id: "cal-prev", "aria-label": "Vorheriger Monat", text: "‹" });
    var next = el("button", { type: "button", class: "btn cal-nav", id: "cal-next", "aria-label": "Nächster Monat", text: "›" });
    var grid = el("div", { class: "cal-grid", id: "cal-grid", role: "grid" });
    var sum = el("p", { class: "hint", id: "cal-sum" });
    var selBox = el("div", { class: "cal-sel", id: "cal-sel" });

    function paintSel() {
      selBox.replaceChildren();
      if (!selDate) {
        selBox.append(el("p", { class: "hint", text: "Tippe auf einen Tag, um ihn als Pause zu markieren, zum Beispiel bei Krankheit oder Urlaub." }));
        return;
      }
      var dt = C.parseYmd(selDate), x = data.days[selDate] || { state: "none" };
      var t = dt.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" }) + ": " + NAME[x.state] +
        (x.state === "part" ? ", " + x.pct + " %" : "") + (x.total ? " (" + x.done + " von " + x.total + " Zielen)" : "") + ".";
      selBox.append(el("p", { class: "cal-sel-t", id: "cal-sel-t", text: t }));
      var st = App.store.state();
      if (x.state === "pause") {
        selBox.append(el("p", { class: "hint", text: "Pausentage zählen nicht als ausgelassen und unterbrechen keine Serie." }),
          el("button", { type: "button", class: "btn", id: "cal-unpause", text: "Pause aufheben", onclick: function () { App.pause.set(selDate, false); App.rerender(); } }));
      } else if (canPause(selDate, x)) {
        selBox.append(el("button", { type: "button", class: "btn", id: "cal-pause", text: "Als Pause markieren", onclick: function () { App.pause.set(selDate, true); App.rerender(); } }));
      } else {
        selBox.append(el("p", { class: "hint", id: "cal-sel-no", text: x.state === "none" ? "Für diesen Tag gibt es keine Daten." : x.state === "ok" || x.state === "part" ? "Tage mit Einträgen lassen sich nicht pausieren." : "Berichte vergangener Wochen ändern sich nicht." }));
      }
    }

    function paint() {
      title.textContent = month.toLocaleDateString("de-DE", { month: "long", year: "numeric" });
      prev.disabled = month <= minM;
      next.disabled = month >= maxM;
      grid.replaceChildren();
      WD.forEach(function (n) { grid.append(el("span", { class: "cal-wd", role: "columnheader", text: n })); });
      var lead = (month.getDay() + 6) % 7, dim = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
      var tk = ymd(today), cnt = { ok: 0, part: 0, miss: 0, pause: 0 };
      for (var i = 0; i < lead; i++) grid.append(el("span", { class: "cal-c blank", "aria-hidden": "true" }));
      for (var d = 1; d <= dim; d++) {
        var dt = new Date(month.getFullYear(), month.getMonth(), d), key = ymd(dt);
        var x = data.days[key] || { state: "none" };
        if (cnt[x.state] !== undefined) cnt[x.state]++;
        var mark = x.state === "ok" ? "✓" : x.state === "part" ? x.pct + "%" : x.state === "miss" ? "×" : x.state === "pause" ? "Pause" : "";
        var label = dt.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" }) + ": " + NAME[x.state] +
          (x.state === "part" ? ", " + x.pct + " %" : "") + (x.total ? ", " + x.done + " von " + x.total + " Zielen" : "");
        grid.append(el("button", { type: "button", class: "cal-c " + x.state + (key === tk ? " today" : "") + (key === selDate ? " sel" : ""), role: "gridcell", "data-d": key, "data-s": x.state, "aria-label": label, "aria-pressed": String(key === selDate),
          onclick: (function (k) { return function () { selDate = selDate === k ? null : k; paint(); }; })(key) },
          el("b", { text: String(d) }), el("small", { text: mark })));
        if (x.state === "ok" || x.state === "part") C.tint(grid.lastChild, x.pct);
      }
      var trained = cnt.ok + cnt.part + cnt.miss;
      sum.textContent = (trained
        ? cnt.ok + " von " + trained + " Trainingstagen komplett geschafft" + (cnt.part ? ", " + cnt.part + " teilweise" : "") + (cnt.miss ? ", " + cnt.miss + " ausgelassen" : "")
        : "In diesem Monat gibt es noch keine Trainingstage mit Daten") + (cnt.pause ? ", " + cnt.pause + (cnt.pause === 1 ? " Pausentag" : " Pausentage") : "") + ".";
      paintSel();
    }
    prev.addEventListener("click", function () { month = monthOf(month, -1); paint(); });
    next.addEventListener("click", function () { month = monthOf(month, 1); paint(); });
    paint();

    return App.fold("cal", "Trainingskalender", "rep-cal", [
      el("div", { class: "cal-head" }, prev, title, next),
      grid, selBox, sum,
      el("div", { class: "legend cal-legend" },
        el("span", null, el("i", { class: "cal-k ok" }), "alles geschafft"),
        el("span", null, el("i", { class: "cal-k part" }), "teilweise"),
        el("span", null, el("i", { class: "cal-k miss" }), "ausgelassen"),
        el("span", null, el("i", { class: "cal-k pause" }), "Pause"),
        el("span", null, el("i", { class: "cal-k rest" }), "Ruhetag")),
      el("p", { class: "hint", text: "Für Wochen ohne gespeicherten Bericht gelten die Trainingstage deines jetzigen Plans als ausgelassen." })
    ]);
  }

  App.calendar = { card: card, build: build };
})();

</script>
<script>
/* Rekorde: bester Tag, beste Woche, beste Übungswerte und längste Serie geschaffter Tagesziele.
   compute() ist reine Rechnung auf den Wochenberichten (inklusive der laufenden Woche), card() baut den Aufklapper für den Reiter Berichte.
   Ein Tagesziel ist geschafft, wenn der Tag 100 % erreicht. Ruhetage unterbrechen die Serie nicht, ein verpasster Trainingstag schon.
   Eine Woche ohne Bericht unterbricht sie ebenfalls. Tage nach heute und der heutige Tag, solange er noch nicht geschafft ist, zählen nicht. */
(function () {
  "use strict";
  var el = App.el, C = App.calc, R = App.reports, S = App.store;
  var DONE = 0.9999;

  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  /* list: Wochen wie R.all() sie liefert, nach Woche sortiert. today: "JJJJ-MM-TT". planDays: Trainingstage des aktuellen Plans (7 Wahrheitswerte), optional. */
  function compute(list, today, planDays) {
    var bestDay = null, bestWeek = null, byEx = {}, exOrder = [];
    var run = 0, runStart = null, runEnd = null, best = null, prevW = null;

    list.forEach(function (r) {
      var mon = C.parseYmd(r.w);
      var wa = C.aggregate(r.d);
      if (wa.slots > 0 && wa.started > 0 && (!bestWeek || wa.perfAll >= bestWeek.ratio)) {
        bestWeek = { w: r.w, ratio: wa.perfAll, live: !!r.live, reached: wa.reached, slots: wa.slots, fullDays: wa.fullDays, trainDays: wa.trainDays };
      }
      if (prevW !== null && C.ymd(C.addDays(C.parseYmd(prevW), 7)) !== r.w) { run = 0; runStart = null; }
      prevW = r.w;

      for (var i = 0; i < 7; i++) {
        var items = r.d[i];
        if (!items) continue;
        var date = C.ymd(C.addDays(mon, i));
        if (date > today) continue;
        var a = C.aggregate([items]);
        if (!a.slots) continue;
        var ok = a.perfAll >= DONE;

        if (a.started > 0 && (!bestDay || a.perfAll >= bestDay.ratio)) {
          bestDay = { date: date, ratio: a.perfAll, items: items.map(function (it) { return { name: it[0], unit: it[1], g: it[2], v: it[3] }; }) };
        }
        items.forEach(function (it) {
          if (!(it[3] > 0)) return;
          var k = it[0] + "|" + it[1], t = byEx[k];
          if (!t) { t = byEx[k] = { name: it[0], unit: it[1], v: 0, g: it[2], date: date }; exOrder.push(k); }
          if (it[3] >= t.v) { t.v = it[3]; t.g = it[2]; t.date = date; }
        });

        if (ok) {
          if (!run) runStart = date;
          run++; runEnd = date;
          if (!best || run >= best.n) best = { n: run, from: runStart, to: runEnd };
        } else if (date === today) {
          /* heute noch offen: bricht die Serie nicht ab */
        } else { run = 0; runStart = null; }
      }
    });

    /* Aktuelle Serie: nur, wenn seit dem letzten geschafften Tag kein Trainingstag (laut aktuellem Plan) ausgefallen ist */
    var current = null;
    if (run > 0 && runEnd) {
      var alive = true;
      for (var d = C.addDays(C.parseYmd(runEnd), 1); C.ymd(d) < today; d = C.addDays(d, 1)) {
        var idx = (d.getDay() + 6) % 7;
        if (!planDays || planDays[idx]) { alive = false; break; }
      }
      if (alive) current = { n: run, from: runStart, to: runEnd };
    }
    return { bestDay: bestDay, bestWeek: bestWeek, exercises: exOrder.map(function (k) { return byEx[k]; }), streak: best, current: current };
  }

  function fmtDate(ymd) {
    return C.parseYmd(ymd).toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }
  function fmtShort(ymd) { return C.parseYmd(ymd).toLocaleDateString("de-DE", { day: "numeric", month: "short" }); }
  function weekText(w) {
    var mon = C.parseYmd(w), sun = C.addDays(mon, 6);
    return "KW " + C.isoWeek(mon) + " · " + C.fmtDay(mon) + " – " + C.fmtDay(sun) + " " + sun.getFullYear();
  }
  function weekOf(ymd) {
    var d = C.parseYmd(ymd);
    return "KW " + C.isoWeek(d);
  }

  function block(id, title, big, sub, extra) {
    return el("section", { class: "rec", id: id },
      el("p", { class: "rec-h", text: title }),
      el("p", { class: "rec-big", text: big }),
      sub ? el("p", { class: "rec-sub", text: sub }) : null,
      extra || null);
  }

  function card() {
    var st = S.state();
    var today = C.ymd(new Date());
    var rec = compute(R.all(), today, st.days);
    var kids = [];

    if (!rec.bestDay && !rec.bestWeek && !rec.streak) {
      kids.push(el("p", { class: "hint", id: "rec-empty", text: "Noch keine Rekorde. Sobald du Übungen einträgst, erscheinen hier dein bester Tag, deine beste Woche und deine längste Serie." }));
    } else {
      if (rec.bestDay) {
        var bd = rec.bestDay, ul = el("ul", { class: "rec-list" });
        bd.items.forEach(function (it) {
          var p = C.pct(it.v / it.g);
          ul.append(el("li", null, el("span", { class: "tn", text: it.name }), el("span", { class: "tv", text: it.v + " von " + it.g + " " + it.unit }), el("span", { class: "tp" + (p > 100 ? " over" : ""), text: p + " %" })));
        });
        kids.push(block("rec-day", "Bester Tag", C.pct(bd.ratio) + " %", fmtDate(bd.date) + " · " + weekOf(bd.date), ul));
      }
      if (rec.bestWeek) {
        var bw = rec.bestWeek;
        kids.push(block("rec-week", "Beste Woche", C.pct(bw.ratio) + " %",
          weekText(bw.w) + (bw.live ? " (läuft)" : ""),
          el("p", { class: "rec-sub", text: bw.reached + " von " + bw.slots + " Übungen erreicht · " + bw.fullDays + " von " + bw.trainDays + " Trainingstagen komplett" })));
      }
      if (rec.streak) {
        var s = rec.streak;
        kids.push(block("rec-streak", "Längste Serie", plural(s.n, "Tag", "Tage") + " in Folge",
          "Tagesziel jeweils erreicht, " + fmtShort(s.from) + " bis " + fmtShort(s.to) + " " + C.parseYmd(s.to).getFullYear() + ". Ruhetage unterbrechen die Serie nicht.",
          el("p", { class: "rec-sub", id: "rec-current", text: rec.current ? "Aktuelle Serie: " + plural(rec.current.n, "Tag", "Tage") + (rec.current.n >= s.n ? " (gleich Rekord)" : "") : "Aktuelle Serie: 0 Tage" })));
      }
      if (rec.exercises.length) {
        var ex = el("ul", { class: "rec-list", id: "rec-ex" });
        rec.exercises.forEach(function (t) {
          ex.append(el("li", null, el("span", { class: "tn", text: t.name }), el("span", { class: "tv", text: t.v + " " + t.unit }), el("span", { class: "tp", text: fmtShort(t.date) })));
        });
        kids.push(el("section", { class: "rec" }, el("p", { class: "rec-h", text: "Bestwert je Übung an einem Tag" }), ex));
      }
    }
    return App.fold("rek", "Rekorde", "rep-records", kids);
  }

  App.records = { compute: compute, card: card };
})();

</script>
<script>
/* Abzeichen: Stufen für Serien, Wochen am Stück, Trainingstage, Übungen über dem Ziel und Gesamtmengen je Übung.
   compute() ist reine Rechnung auf den Wochenberichten (inklusive der laufenden Woche), card() baut den Aufklapper für den Reiter Berichte.
   Eine Stufe bleibt erreicht, auch wenn die Serie später reißt: gezählt wird der Bestwert (Serien) oder die Summe (Mengen).
   Regeln: ein Tag ist geschafft bei 100 %, eine Woche ist geschafft, wenn ihre Gesamtleistung 100 % erreicht.
   Die laufende Woche zählt erst, wenn sie geschafft ist, und unterbricht eine Serie nicht, solange sie offen ist. */
(function () {
  "use strict";
  var el = App.el, C = App.calc, R = App.reports;
  var DONE = 0.9999;

  var TIERS = {
    streak: [3, 7, 14, 30, 60, 100],
    weeks: [2, 4, 10, 26, 52],
    days: [10, 25, 50, 100, 200, 365],
    over: [1, 5, 10, 25, 50],
    reps: [100, 500, 1000, 2500, 5000, 10000],
    mins: [10, 30, 60, 180, 600, 1200]
  };

  function nf(n) { return Math.round(n).toLocaleString("de-DE"); }
  function plural(n, one, many) { return nf(n) + " " + (n === 1 ? one : many); }
  function fmtDays(n) { return plural(n, "Tag", "Tage"); }
  function fmtWeeks(n) { return plural(n, "Woche", "Wochen"); }
  function fmtMins(n) { return n >= 60 && n % 60 === 0 ? nf(n / 60) + " Std." : nf(n) + " Min."; }
  function fmtReps(n) { return nf(n) + " Wdh."; }

  /* Wie viele Stufen sind erreicht und was ist die nächste? */
  function level(value, tiers) {
    var n = 0;
    while (n < tiers.length && value >= tiers[n]) n++;
    return { n: n, total: tiers.length, next: n < tiers.length ? tiers[n] : null };
  }

  /* list: Wochen wie R.all() sie liefert, nach Woche sortiert. today: "JJJJ-MM-TT". planDays: Trainingstage des aktuellen Plans. */
  function compute(list, today, planDays) {
    var rec = App.records.compute(list, today, planDays);
    var days = 0, over = 0, ex = {}, order = [];
    var run = 0, bestRun = 0, lastW = null;

    list.forEach(function (r) {
      var mon = C.parseYmd(r.w), wa = C.aggregate(r.d);
      var good = wa.slots > 0 && wa.perfAll >= DONE;
      if (!(r.live && !good)) {
        if (lastW !== null) {
          var nx = C.ymd(C.addDays(C.parseYmd(lastW), 7));
          while (nx < r.w && App.pause.skipped(nx)) nx = C.ymd(C.addDays(C.parseYmd(nx), 7));
          if (nx !== r.w) run = 0;
        }
        if (good) { run++; lastW = r.w; if (run > bestRun) bestRun = run; }
        else { run = 0; lastW = r.w; }
      }
      for (var i = 0; i < 7; i++) {
        var items = r.d[i];
        if (!items) continue;
        if (C.ymd(C.addDays(mon, i)) > today) continue;
        var a = C.aggregate([items]);
        if (a.started > 0) days++;
        if (a.slots && a.perfAll > 1.0001) over++;
        items.forEach(function (it) {
          if (!(it[3] > 0)) return;
          var k = it[0] + "|" + it[1], t = ex[k];
          if (!t) { t = ex[k] = { name: it[0], unit: it[1], v: 0 }; order.push(k); }
          t.v += it[3];
        });
      }
    });

    /* Aktuelle Wochenserie: nur, wenn keine Woche seit der letzten geschafften ausgefallen ist */
    var curWeeks = 0;
    if (run > 0 && lastW !== null) {
      var thisMon = C.ymd(C.addDays(C.parseYmd(today), -((C.parseYmd(today).getDay() + 6) % 7)));
      var prevMon = C.ymd(C.addDays(C.parseYmd(thisMon), -7));
      if (lastW >= prevMon) curWeeks = run;
    }

    var exercises = order.map(function (k) {
      var t = ex[k], time = t.unit !== "Wdh.";
      var value = t.unit === "Sek." ? t.v / 60 : t.v;
      return { name: t.name, unit: t.unit, total: t.v, value: value, time: time, level: level(value, time ? TIERS.mins : TIERS.reps) };
    });
    var longest = rec.streak ? rec.streak.n : 0;
    var curStreak = rec.current ? rec.current.n : 0;
    var families = [
      { id: "streak", title: "Serie", text: "Tagesziele in Folge", value: longest, cur: curStreak, tiers: TIERS.streak, fmt: fmtDays, level: level(longest, TIERS.streak), curLabel: "Aktuelle Serie" },
      { id: "weeks", title: "Wochen am Stück", text: "Wochenziel (100 %) in aufeinanderfolgenden Wochen", value: bestRun, cur: curWeeks, tiers: TIERS.weeks, fmt: fmtWeeks, level: level(bestRun, TIERS.weeks), curLabel: "Aktuell" },
      { id: "days", title: "Trainingstage", text: "Tage mit mindestens einer eingetragenen Übung", value: days, tiers: TIERS.days, fmt: fmtDays, level: level(days, TIERS.days) },
      { id: "over", title: "Über dem Ziel", text: "Tage mit mehr als 100 %", value: over, tiers: TIERS.over, fmt: fmtDays, level: level(over, TIERS.over) }
    ];
    var earned = 0, total = 0;
    families.forEach(function (f) { earned += f.level.n; total += f.level.total; });
    exercises.forEach(function (e) { earned += e.level.n; total += e.level.total; });
    return { families: families, exercises: exercises, earned: earned, total: total };
  }

  function medals(tiers, value, fmt) {
    var ul = el("ul", { class: "bd-row" });

      var got = value >= t;

  }

  function nextText(lv, value, fmt) {
    if (lv.next === null) return "Alle Stufen erreicht.";
    return "Noch " + fmt(Math.ceil(lv.next - value)) + " bis zur nächsten Stufe (" + fmt(lv.next) + ").";
  }

  function bar(value, lv, tiers) {
    var prev = lv.n ? tiers[lv.n - 1] : 0;
    var p = lv.next === null ? 100 : Math.max(0, Math.min(100, (value - prev) / (lv.next - prev) * 100));

  function card() {
    var st = App.store.state();
    var b = compute(R.all(), C.ymd(new Date()), st.days);
    var kids = [el("p", { class: "hint", id: "bd-sum", text: nf(b.earned) + " von " + nf(b.total) + " Abzeichen erreicht. Eine erreichte Stufe bleibt dir, auch wenn eine Serie später reißt." })];

    b.families.forEach(function (f) {
      var sec = el("section", { class: "rec bd-fam", id: "bd-" + f.id },
        el("p", { class: "rec-h", text: f.title + " · Stufe " + f.level.n + " von " + f.level.total }),
        el("p", { class: "rec-sub", text: f.text }),
        medals(f.tiers, f.value, f.fmt),
        bar(f.value, f.level, f.tiers),
        el("p", { class: "rec-sub bd-next", text: (f.cur !== undefined ? f.curLabel + ": " + f.fmt(f.cur) + " · Bestwert: " + f.fmt(f.value) + ". " : "Bisher: " + f.fmt(f.value) + ". ") + nextText(f.level, f.value, f.fmt) }));
      kids.push(sec);
    });

    kids.push(el("h3", { text: "Gesamtmenge je Übung" }));
    if (!b.exercises.length) {
      kids.push(el("p", { class: "hint", id: "bd-ex-empty", text: "Sobald du Übungen einträgst, sammelst du hier Stufen für die Gesamtmenge, zum Beispiel 1.000 Liegestütze." }));
    } else {
      b.exercises.forEach(function (e) {
        var tiers = e.time ? TIERS.mins : TIERS.reps, fmt = e.time ? fmtMins : fmtReps;
        kids.push(el("section", { class: "rec bd-fam bd-ex" },
          el("p", { class: "rec-h", text: e.name + " · Stufe " + e.level.n + " von " + e.level.total }),
          el("p", { class: "rec-sub", text: "Insgesamt " + (e.time ? fmtMins(e.value) : fmtReps(e.value)) + ". " + nextText(e.level, e.value, fmt) }),
          medals(tiers, e.value, fmt),
          bar(e.value, e.level, tiers)));
      });
    }
    return App.fold("abz", "Abzeichen", "rep-badges", kids);
  }

  App.badges = { compute: compute, card: card, TIERS: TIERS };
})();

<script>
/* Liste per langem Drücken umsortieren und löschen.
   Wer eine Zeile (handleSel) 3 Sekunden lang gedrückt hält, ohne den Finger zu bewegen, hebt sie an.
   Danach folgt sie dem Finger nach oben oder unten. Unten erscheint ein Mülleimer: Loslassen darauf ruft onDelete auf,
   Loslassen woanders ruft onMove(von, nach) auf. Bewegt man sich vorher oder lässt los, ist es ein normales Tippen oder Scrollen.
   Touch und Maus laufen über Pointer-Events. Die Tastatur-Bedienung liegt bei der Ansicht (views/uebungen.js). */
(function () {
  "use strict";
  var el = App.el;
  var HOLD_MS = 3000, SLOP = 8, EDGE = 64, MAX_SCROLL = 16;
  var trash = null;
  /* Ist eine Zeile angehoben, darf der Finger die Seite nicht mehr scrollen. Der Zuhörer steht dauerhaft und nicht-passiv am Dokument,

  document.addEventListener("touchcancel", touchEnd(true));

    trash = el("div", { class: "trash", "aria-hidden": "true" });

    trash.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span>Zum Löschen hierher ziehen</span>';
    document.body.append(trash);
    return trash;

  /* o: { list, itemSel, handleSel, onMove(from, to), onDelete(index), say(text), holdMs } */
  function attach(o) {
    var list = o.list, holdMs = o.holdMs || HOLD_MS;
    var hold = null, suppress = false, suppressTimer = null;
    function say(t) { if (o.say) o.say(t); }

    list.addEventListener("pointerdown", function (ev) {
      if (hold || !ev.isPrimary || (ev.pointerType === "mouse" && ev.button !== 0)) return;
      var handle = ev.target.closest(o.handleSel);
      if (!handle || !list.contains(handle)) return;
      var item = handle.closest(o.itemSel);
      if (!item) return;
      suppress = false;
      clearTimeout(suppressTimer);
      begin(item, ev);
    });
    /* Nach dem Loslassen einer gehaltenen Zeile soll kein Klick mehr ankommen (sonst klappt sie auf) */
    list.addEventListener("click", function (ev) {
      if (!suppress) return;
      suppress = false;
      ev.preventDefault();
      ev.stopPropagation();
    }, true);
    list.addEventListener("contextmenu", function (ev) { if (hold) ev.preventDefault(); });
    list.addEventListener("dragstart", function (ev) { if (hold) ev.preventDefault(); });

    function begin(item, ev) {

    }

      if (!hold) return;

      hold = null;
      clearTimeout(h.timer);

      h.item.style.transform = "";
      (h.items || []).forEach(function (it) { it.style.transform = ""; });

      if (trash) trash.classList.remove("show", "hot");
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onCancel);
      document.removeEventListener("keydown", onKey, true);

      touchDrive = null;
    }

    function arm() {
      if (!hold) return;
      var items = [].slice.call(list.querySelectorAll(o.itemSel)), idx = items.indexOf(hold.item);

      hold.to = idx;
