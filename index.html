<script>
/* Diagnose: hält unerwartete Fehler fest (die letzten 20, im Browser) und baut einen kurzen Bericht zum Kopieren.
   Der Bericht enthält Zahlen und Zustände, aber keine Namen oder Werte deiner Übungen.
   Andere Module melden Probleme mit App.diag.log("Text"). Die Ansicht dazu steht in views/einstellungen.js. */
(function () {
  "use strict";

  var KEY = "trainingswoche-app-log";
  var MAX = 20;
  var list = [];

  try {
    var raw = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (Array.isArray(raw)) {
      list = raw.filter(function (e) { return e && typeof e.t === "number" && typeof e.m === "string"; }).slice(-MAX);
    }
  } catch (e) { /* ohne Speicher läuft das Protokoll nur bis zum Schließen */ }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) { /* ignorieren */ }
  }

  function log(msg) {
    var m = String(msg == null ? "" : msg).replace(/\s+/g, " ").slice(0, 300);
    if (!m) return;
    var last = list[list.length - 1];
    if (last && last.m === m) { last.n = (last.n || 1) + 1; last.t = Date.now(); }
    else list.push({ t: Date.now(), m: m });
    if (list.length > MAX) list.splice(0, list.length - MAX);
    persist();
  }

  function where(file, line, col) {
    if (!file) return "";
    var f = String(file).split("?")[0].split("/").slice(-2).join("/");
    return " (" + f + (line ? ":" + line + (col ? ":" + col : "") : "") + ")";
  }

  window.addEventListener("error", function (ev) {
    if (/ResizeObserver/.test(ev.message || "")) return;
    log((ev.message || "Fehler") + where(ev.filename, ev.lineno, ev.colno));
  });
  window.addEventListener("unhandledrejection", function (ev) {
    var r = ev.reason;
    log("Abgelehntes Versprechen: " + (r && r.message ? r.message : r));
  });

  function fmt(t) {
    return new Date(t).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  /* Zustand der App als Liste [Bezeichnung, Wert], für die Anzeige und für den Bericht */
  function facts() {
    var S = App.store, st = S.state(), i = S.info(), rows = [];
    var standalone = false;
    try { standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { /* egal */ }
    var size = 0;
    try { size = (localStorage.getItem("trainingswoche-app-v1") || "").length; } catch (e) { /* egal */ }
    var trainDays = st.days.filter(Boolean).length;
    var ticks = 0;
    Object.keys(st.done).forEach(function (d) { ticks += Object.keys(st.done[d]).length; });

    rows.push(["Version", App.version]);
    rows.push(["Start", standalone ? "als installierte App" : "im Browser"]);
    rows.push(["Speicher im Browser", i.localOk ? "ok, " + Math.max(1, Math.round(size / 1024)) + " KB" : "FEHLER beim Schreiben"]);
    rows.push(["Konto", !i.cloud ? "nicht verfügbar" : i.connected ? "verbunden" : "nicht verbunden"]);
    if (i.cloud) {
      rows.push(["Zuletzt im Konto gespeichert", i.lastSaved ? fmt(i.lastSaved) : "noch nicht in dieser Sitzung"]);
      rows.push(["Ungespeicherte Änderungen", i.dirty ? "ja" : "nein"]);
      if (i.lastError) rows.push(["Letzter Speicherfehler", i.lastError]);
    }
    rows.push(["Stand", st.exercises.length + " Übungen, " + trainDays + " Trainingstage, " + ticks + " Einträge in der Woche, " + st.reports.length + " Berichte"]);
    rows.push(["Woche ab", st.weekStart]);
    rows.push(["Letzte Änderung", st.updatedAt ? fmt(st.updatedAt) : "–"]);
    rows.push(["Darstellung", ({ system: "System", light: "Hell", dark: "Dunkel", black: "Schwarz" })[st.settings.theme] + (st.settings.accent ? ", eigener Akzent" : ", Standard-Akzent")]);
    var u = App.backup && App.backup.undoInfo();
    rows.push(["Sicherheitskopie", u ? "vorhanden, " + fmt(u.at) : "keine"]);
    rows.push(["Offline-Speicher der App", "serviceWorker" in navigator ? (navigator.serviceWorker.controller ? "aktiv" : "nicht aktiv") : "nicht unterstützt"]);
    rows.push(["Netz", navigator.onLine === false ? "offline" : "online"]);
    rows.push(["Fenster", innerWidth + "×" + innerHeight]);
    return rows;
  }

  function report() {
    var lines = ["Trainingswoche – Diagnose", "Erstellt: " + fmt(Date.now())];
    facts().forEach(function (r) { lines.push(r[0] + ": " + r[1]); });
    lines.push("Gerät: " + String(navigator.userAgent).slice(0, 140));
    lines.push("");
    lines.push(list.length ? "Fehlerprotokoll (" + list.length + "):" : "Fehlerprotokoll: leer");
    list.forEach(function (e) { lines.push("- " + fmt(e.t) + (e.n > 1 ? " (" + e.n + "×)" : "") + ": " + e.m); });
    return lines.join("\n") + "\n";
  }

  App.diag = {
    log: log,
    errors: function () { return list.slice(); },
    clear: function () { list = []; persist(); },
    facts: facts,
    report: report,
    fmt: fmt
  };
})();

</script>
<script>
/* Berechnung: Prozent und Statistik. Reine Funktionen, werden vom Trainingsplan und später von den Berichten genutzt.
   Ein Tag ist eine Liste von Posten [Name, Einheit, Ziel, Erreicht] oder null (Ruhetag). */
(function () {
  "use strict";

  /* Ab 100 % nicht mehr gedeckelt, darunter zeigt die Zahl nie 100 an */
  function pct(x) {
    return x >= 0.9999 ? Math.round(x * 100) : Math.min(99, Math.round(x * 100));
  }

  /* Einheitliche Farbstufen für alle Prozentanzeigen: [hell, kräftig].
     Bis 20 % rot, bis 50 % dunkelorange, bis 90 % gelb, bis 99 % hellgrün, bei 100 % grün, darüber violett. */
  var BANDS = [
    [20, "#ff7a6b", "#d92d20"],
    [50, "#f5a04a", "#c2570c"],
    [90, "#ffe066", "#e0b100"],
    [99, "#c5e86c", "#8cc63f"],
    [100, "#5fd68a", "#1f9d55"],
    [Infinity, "#c39bff", "#7c3aed"]
  ];
  function band(p) { for (var i = 0; i < BANDS.length; i++) if (p <= BANDS[i][0]) return BANDS[i]; return BANDS[BANDS.length - 1]; }
  /* Setzt die Farbvariablen --c0/--c1 am Element; das CSS macht daraus Verlauf, Rand oder Hintergrund */
  function tint(node, p) {
    if (p === null || p === undefined || isNaN(p)) { node.style.removeProperty("--c0"); node.style.removeProperty("--c1"); return node; }
    var b = band(p);
    node.style.setProperty("--c0", b[1]); node.style.setProperty("--c1", b[2]);
    return node;
  }

  /* Legende der Farbstufen für Diagramme: Liste von <span>-Elementen */
  var STEPS = [[20, "bis 20 %"], [50, "bis 50 %"], [90, "bis 90 %"], [99, "bis 99 %"], [100, "100 %"], [101, "über 100 %"]];
  function legendItems() {
    return STEPS.map(function (s) {
      var i = App.el("i", { class: "bd" });
      tint(i, s[0]);
      return App.el("span", null, i, s[1]);
    });
  }

  function doneOf(st, day, id) {
    var d = st.done[day];
    var v = d && d[id];
    return typeof v === "number" && v > 0 ? v : 0;
  }

  function dayItems(st, i) {
    if (!st.days[i]) return null;
    if (st.pauses && st.pauses.indexOf(ymd(addDays(parseYmd(st.weekStart), i))) >= 0) return null;
    return st.exercises.map(function (e) {
      var row = [e.name, e.unit, e.target, doneOf(st, i, e.id)];
      if (e.kcal || e.met || e.sec) {
        row.push(e.kcal || 0);
        if (e.met || e.sec) row.push(e.met || 0, e.sec || 0);
      }
      return row;
    });
  }

  function allDays(st) {
    var out = [];
    for (var i = 0; i < 7; i++) out.push(dayItems(st, i));
    return out;
  }

  function aggregate(days) {
    var r = { slots: 0, reached: 0, started: 0, sumAll: 0, sumStarted: 0, fullDays: 0, trainDays: 0, byEx: {}, order: [] };
    days.forEach(function (items) {
      if (!items) return;
      r.trainDays++;
      var all = items.length > 0;
      items.forEach(function (it) {
        var g = it[2], v = it[3], ratio = v / g;
        r.slots++;
        r.sumAll += ratio;
        if (v >= g) r.reached++; else all = false;
        if (v > 0) { r.started++; r.sumStarted += ratio; }
        var key = it[0] + "|" + it[1];
        var t = r.byEx[key];
        if (!t) { t = r.byEx[key] = { name: it[0], unit: it[1], g: 0, v: 0 }; r.order.push(key); }
        t.g += g;
        t.v += v;
      });
      if (all) r.fullDays++;
    });
    r.perfAll = r.slots ? r.sumAll / r.slots : 0;
    r.perfStarted = r.started ? r.sumStarted / r.started : null;
    return r;
  }

  /* Datumshilfen. Wochen beginnen am Montag und stehen als JJJJ-MM-TT in den Daten. */
  function pad(n) { return String(n).padStart(2, "0"); }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseYmd(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);
  }
  function fmtDay(d) { return d.toLocaleDateString("de-DE", { day: "numeric", month: "short" }); }

  App.calc = {
    pct: pct, band: band, tint: tint, legendItems: legendItems, doneOf: doneOf, dayItems: dayItems, allDays: allDays, aggregate: aggregate,
    ymd: ymd, parseYmd: parseYmd, addDays: addDays, isoWeek: isoWeek, fmtDay: fmtDay
  };
})();

</script>
<script>
/* Speicher: der Plan-Stand (Übungen, Trainingstage, Haken der Woche).
   Wird sofort im Browser gesichert und, wenn verfügbar, gebündelt im Konto. Views lesen mit App.store.state()
   und rufen nach jeder Änderung App.store.touch() auf. Wer beim Wochenwechsel etwas archivieren will,
   meldet sich mit App.store.onRollover(fn); fn bekommt eine Kopie der abgelaufenen Woche. */
(function () {
  "use strict";

  var KEY = "trainingswoche-app-v1";
  var HAS_CLOUD = !!(window.claude && typeof window.claude.use === "function");
  var UNITS = ["Wdh.", "Sek.", "Min."];
  var DEFAULT_DAYS = [true, true, true, false, true, true, false];
  var ISO = /^\d{4}-\d{2}-\d{2}$/;

  function pad(n) { return String(n).padStart(2, "0"); }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function mondayStr() { var d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }
  function num(x, d) { var n = Number(x); return isFinite(n) ? n : d; }
  function uid() { return "e" + Math.random().toString(36).slice(2, 8); }

  function defaults() {
    return {
      v: 1,
      weekStart: mondayStr(),
      exercises: [
        { id: "liegestuetze", name: "Liegestütze", target: 20, unit: "Wdh." },
        { id: "situps", name: "Sit-Ups", target: 30, unit: "Wdh." },
        { id: "plank", name: "Plank", target: 60, unit: "Sek." }
      ],
      archive: [],
      pauses: [],
      days: DEFAULT_DAYS.slice(),
      shift: null,
      done: {},
      notes: {},
      reports: [],
      weights: [],
      settings: { theme: "system", accent: null, profile: { gender: null, height: null, weight: null, target: null, nick: "" }, notify: cleanNotify(null), view: cleanView(null) },
      updatedAt: 0
    };
  }

  /* Übungen bereinigen. seen sammelt die vergebenen IDs, damit keine doppelt vorkommt (auch nicht zwischen Plan und Archiv). */
  function cleanExercises(arr, seen) {
    var ex = [];
    (Array.isArray(arr) ? arr : []).forEach(function (e) {
      if (!e || typeof e !== "object") return;
      var id = typeof e.id === "string" && /^[A-Za-z0-9_-]{1,24}$/.test(e.id) && !seen[e.id] ? e.id : uid();
      seen[id] = 1;
      var item = {
        id: id,
        name: (typeof e.name === "string" && e.name.trim() ? e.name.trim() : "Übung").slice(0, 40),
        target: Math.max(1, Math.floor(num(e.target, 1))),
        unit: UNITS.indexOf(e.unit) >= 0 ? e.unit : "Wdh."
      };
      var kc = cleanKcal(e.kcal);
      if (kc) item.kcal = kc;
      var mt = cleanMet(e.met), sc = cleanSec(e.sec);
      if (mt) item.met = mt;
      if (sc) item.sec = sc;
      ex.push(item);
    });
    return ex;
  }

  /* Baut immer eine frische, veränderbare Kopie. Daten aus dem Konto sind schreibgeschützt. */
  function clean(raw) {
    if (!raw || typeof raw !== "object" || !Array.isArray(raw.exercises)) return null;
    var seen = {};
    var ex = cleanExercises(raw.exercises, seen);
    var arc = cleanExercises(raw.archive, seen).slice(0, 50);
    var done = {};
    if (raw.done && typeof raw.done === "object") {
      for (var i = 0; i < 7; i++) {
        var d = raw.done[i];
        if (!d || typeof d !== "object") continue;
        var o = {};
        Object.keys(d).forEach(function (id) {
          var n = Math.floor(num(d[id], 0));
          if (n > 0) o[id] = Math.min(n, 99999);
        });
        done[i] = o;
      }
    }
    var out = {
      v: 1,
      weekStart: typeof raw.weekStart === "string" && ISO.test(raw.weekStart) ? raw.weekStart : mondayStr(),
      exercises: ex,
      archive: arc,
      pauses: cleanPauses(raw.pauses),
      days: Array.isArray(raw.days) && raw.days.length === 7 ? raw.days.map(Boolean) : DEFAULT_DAYS.slice(),
      shift: null,
      done: done,
      notes: cleanNotes(raw.notes),
      reports: cleanReports(raw.reports),
      weights: cleanWeights(raw.weights),
      settings: cleanSettings(raw.settings),
      updatedAt: Math.max(0, num(raw.updatedAt, 0))
    };
    out.shift = cleanShift(raw.shift);
    return out;
  }

  /* Eigener MET-Wert (0,5 bis 30) und eigene Sekunden je Wiederholung (0,5 bis 120), je zwei Nachkommastellen, sonst null (= Tabelle) */
  function cleanMet(x) {
    var n = typeof x === "number" ? x : NaN;
    if (!isFinite(n) || n < 0.5 || n > 30) return null;
    return Math.round(n * 100) / 100;
  }
  function cleanSec(x) {
    var n = typeof x === "number" ? x : NaN;
    if (!isFinite(n) || n < 0.5 || n > 120) return null;
    return Math.round(n * 100) / 100;
  }

  /* Eigener Kalorienverbrauch je Einheit (je Wiederholung, Sekunde oder Minute): größer 0 bis 1000, drei Nachkommastellen, sonst null (= automatisch) */
  function cleanKcal(x) {
    var n = typeof x === "number" ? x : NaN;
    if (!isFinite(n) || n <= 0 || n > 1000) return null;
    n = Math.round(n * 1000) / 1000;
    return n > 0 ? n : null;
  }

  /* Pausentage: Daten (JJJJ-MM-TT), an denen nicht trainiert wird (Krankheit, Urlaub). Sie zählen nicht als ausgelassen. Höchstens 800, aufsteigend. */
  function cleanPauses(arr) {
    var map = {};
    (Array.isArray(arr) ? arr : []).forEach(function (d) { if (typeof d === "string" && ISO.test(d)) map[d] = 1; });
    return Object.keys(map).sort().slice(-800);
  }

  /* Gewichtsverlauf: [{ d: JJJJ-MM-TT, kg: 20 bis 300, eine Nachkommastelle }], aufsteigend, ein Eintrag je Tag, höchstens 3000 */
  function cleanWeights(arr) {
    var map = {};
    (Array.isArray(arr) ? arr : []).forEach(function (x) {
      if (!x || typeof x !== "object" || typeof x.d !== "string" || !ISO.test(x.d)) return;
      var kg = typeof x.kg === "number" && isFinite(x.kg) ? Math.round(x.kg * 10) / 10 : NaN;
      if (kg >= 20 && kg <= 300) map[x.d] = { d: x.d, kg: kg };
    });
    return Object.keys(map).sort().map(function (k) { return map[k]; }).slice(-3000);
  }

  /* Verschobene Trainingstage der laufenden Woche: { base: fester Plan, moves: [{ from, to }] }, sonst null */
  function cleanShift(raw) {
    if (!raw || typeof raw !== "object" || !Array.isArray(raw.base) || raw.base.length !== 7 || !Array.isArray(raw.moves)) return null;
    var moves = [];
    raw.moves.slice(0, 7).forEach(function (m) {
      if (!m || typeof m !== "object") return;
      var f = Math.floor(num(m.from, -1)), t = Math.floor(num(m.to, -1));
      if (f >= 0 && f <= 6 && t >= 0 && t <= 6 && f !== t) moves.push({ from: f, to: t });
    });
    return moves.length ? { base: raw.base.map(Boolean), moves: moves } : null;
  }

  /* Notizen je Wochentag (0 = Montag): Text bis 500 Zeichen, leere fallen weg */
  var NOTE_MAX = 500;
  function cleanNotes(raw) {
    var out = {};
    if (!raw || typeof raw !== "object") return out;
    for (var i = 0; i < 7; i++) {
      var t = raw[i];
      if (typeof t !== "string") continue;
      t = t.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "").trim().slice(0, NOTE_MAX);
      if (t) out[i] = t;
    }
    return out;
  }

  function cleanSettings(s) {
    s = s && typeof s === "object" ? s : {};
    return {
      theme: ["light", "dark", "black"].indexOf(s.theme) >= 0 ? s.theme : "system",
      accent: typeof s.accent === "string" && /^#[0-9a-fA-F]{6}$/.test(s.accent) ? s.accent.toLowerCase() : null,
      profile: cleanProfile(s.profile),
      notify: cleanNotify(s.notify),
      view: cleanView(s.view)
    };
  }

  /* Ansichtsoptionen, alle aus: sticky = Kacheln oben anheften, hideDone = erledigte Übungen nach unten, swipeNav = Wischen über die Reiterleiste, swipePage = Wischen im Inhalt */
  function cleanView(raw) {
    raw = raw && typeof raw === "object" ? raw : {};
    return { sticky: raw.sticky === true, hideDone: raw.hideDone === true, swipeNav: raw.swipeNav === true, swipePage: raw.swipePage === true };
  }

  /* Erinnerungen (Benachrichtigungen der Android-App): je Art an/aus, Uhrzeit HH:MM und Text mit dem Platzhalter {name} für den Spitznamen */
  var NOTIFY_DEFAULTS = {
    train: { on: true, time: "20:00", text: "Hey {name}, nicht aufgeben, du bist fast am Ziel!" },
    weight: { on: true, time: "18:00", text: "Hey {name}, ab auf die Waage - hinterlege dein aktuelles Gewicht" }
  };
  var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
  function cleanNotify(raw) {
    raw = raw && typeof raw === "object" ? raw : {};
    var out = {};
    Object.keys(NOTIFY_DEFAULTS).forEach(function (k) {
      var d = NOTIFY_DEFAULTS[k], r = raw[k] && typeof raw[k] === "object" ? raw[k] : {};
      var text = typeof r.text === "string" ? r.text.replace(/[\u0000-\u001F\u007F]/g, " ").replace(/\s+/g, " ").trim().slice(0, 140) : "";
      out[k] = { on: typeof r.on === "boolean" ? r.on : d.on, time: typeof r.time === "string" && TIME_RE.test(r.time) ? r.time : d.time, text: text || d.text };
    });
    return out;
  }

  /* Körperwerte, die zu einem Bericht gehören: Gewicht (kg) und Größe (cm), jeweils optional */
  function cleanBody(h) {
    if (!h || typeof h !== "object") return null;
    var p = cleanProfile({ weight: h.kg, height: h.cm });
    return p.weight !== null || p.height !== null ? { kg: p.weight, cm: p.height } : null;
  }

  /* Persönliche Angaben: Geschlecht "m" oder "w" (oder nichts), Größe in cm (ganze Zahl 100 bis 250), Gewicht und Zielgewicht in kg (20 bis 300, eine Nachkommastelle), Spitzname bis 20 Zeichen */
  var NICK_MAX = 20;
  function cleanProfile(p) {
    p = p && typeof p === "object" ? p : {};
    var h = typeof p.height === "number" && isFinite(p.height) ? Math.round(p.height) : null;
    var w = typeof p.weight === "number" && isFinite(p.weight) ? Math.round(p.weight * 10) / 10 : null;
    var nick = typeof p.nick === "string" ? p.nick.replace(/[\u0000-\u001F\u007F]/g, " ").replace(/\s+/g, " ").trim().slice(0, NICK_MAX).trim() : "";
    var t = typeof p.target === "number" && isFinite(p.target) ? Math.round(p.target * 10) / 10 : null;
    return {
      gender: p.gender === "m" || p.gender === "w" ? p.gender : null,
      height: h !== null && h >= 100 && h <= 250 ? h : null,
      weight: w !== null && w >= 20 && w <= 300 ? w : null,
      target: t !== null && t >= 20 && t <= 300 ? t : null,
      nick: nick
    };
  }

  /* Abgeschlossene Wochen. Ein Bericht ist { w: Montag als JJJJ-MM-TT, d: 7 Tage, at: Zeitpunkt, n: Notizen je Tag (nur wenn vorhanden), h: { kg, cm } Körperwerte der Woche (nur wenn vorhanden) }.
     Ein Tag ist null (Ruhetag) oder eine Liste von Posten [Name, Einheit, Ziel, Erreicht] und, falls eingestellt, als fünftes der eigene Kalorienwert je Einheit. */
  function cleanReports(arr) {
    var map = {};
    (Array.isArray(arr) ? arr : []).forEach(function (r) {
      if (!r || typeof r !== "object" || typeof r.w !== "string" || !ISO.test(r.w) || !Array.isArray(r.d)) return;
      var d = [];
      for (var i = 0; i < 7; i++) {
        var day = r.d[i];
        if (!Array.isArray(day)) { d.push(null); continue; }
        var items = [];
        day.slice(0, 50).forEach(function (it) {
          if (!Array.isArray(it)) return;
          var own = cleanKcal(it[4]);
          var row = [
            String(it[0] || "Übung").slice(0, 40),
            UNITS.indexOf(it[1]) >= 0 ? it[1] : "Wdh.",
            Math.min(99999, Math.max(1, Math.floor(num(it[2], 1)))),
            Math.min(99999, Math.max(0, Math.floor(num(it[3], 0))))
          ];
          var mt = cleanMet(it[5]), sc = cleanSec(it[6]);
          if (own || mt || sc) row.push(own || 0);
          if (mt || sc) row.push(mt || 0, sc || 0);
          items.push(row);
        });
        d.push(items);
      }
      var rep = { w: r.w, d: d, at: Math.max(0, num(r.at, 0)) };
      var n = cleanNotes(r.n);
      if (Object.keys(n).length) rep.n = n;
      var h = cleanBody(r.h);
      if (h) rep.h = h;
      map[r.w] = rep;
    });
    return Object.keys(map).sort().map(function (k) { return map[k]; });
  }

  function loadLocal() {
    try {
      var s = localStorage.getItem(KEY);
      return s ? clean(JSON.parse(s)) : null;
    } catch (e) { return null; }
  }
  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); localOk = true; }
    catch (e) {
      if (localOk) App.diag.log("Speichern im Browser fehlgeschlagen: " + (e && e.name));
      localOk = false;
    }
  }

  var localOk = true, lastSaved = 0, lastError = "";
  var local = loadLocal();
  var state = local || defaults();
  var hooks = [], adoptHooks = [], changeHooks = [];
  var dirty = false, timer = null, writing = false, again = false;
  var docRef = null;

  function status(kind) {
    var s = document.getElementById("status");
    if (!s) return;
    s.textContent = kind === "saved" ? "Gespeichert" : HAS_CLOUD ? "Nur auf diesem Gerät gespeichert" : "Auf diesem Gerät gespeichert";
  }

  /* Wochenwechsel: ab Montag beginnt eine neue Woche mit leeren Haken. Das ändert den Zeitstempel nicht,
     denn jedes Gerät kommt aus demselben alten Stand zum selben Ergebnis. */
  function rollover() {
    var cur = mondayStr();
    if (state.weekStart >= cur) return false;
    var old = JSON.parse(JSON.stringify(state));
    hooks.forEach(function (fn) { try { fn(old); } catch (e) { /* ein Modul darf den Wechsel nicht blockieren */ } });
    state.done = {};
    state.notes = {};
    if (state.shift) { state.days = state.shift.base.slice(); state.shift = null; }
    state.weekStart = cur;
    return true;
  }

  function schedule() {
    if (!docRef) { status(); return; }
    clearTimeout(timer);
    timer = setTimeout(flush, 300);
  }

  function flush() {
    timer = null;
    if (!docRef || !dirty) return;
    if (writing) { again = true; return; }
    dirty = false;
    writing = true;
    docRef.set(JSON.parse(JSON.stringify(state))).then(function () {
      lastSaved = Date.now();
      lastError = "";
      status("saved");
    }, function (e) {
      dirty = true;
      lastError = String(e && e.message ? e.message : e || "unbekannt").slice(0, 120);
      App.diag.log("Speichern im Konto fehlgeschlagen: " + lastError);
      status();
    }).then(function () {
      writing = false;
      if (again) { again = false; flush(); }
    });
  }

  function flushNow() {
    if (timer) { clearTimeout(timer); flush(); }
  }

  function fireChange() {
    changeHooks.forEach(function (fn) { try { fn(); } catch (e) { /* ein Modul darf das Speichern nicht stören */ } });
  }

  function touch() {
    state.updatedAt = Date.now();
    dirty = true;
    saveLocal();
    schedule();
    fireChange();
  }

  function check() {
    if (!rollover()) return false;
    dirty = true;
    saveLocal();
    schedule();
    return true;
  }

  /* Konto-Speicher: der neuere Stand gewinnt, Browser oder Konto */
  function initDb() {
    if (!HAS_CLOUD) return;
    var ref = null;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      if (!r[0] || !r[1]) return null;
      return r[1].id().then(function (id) {
        if (!id) return null;
        ref = r[0].doc("data/users/" + id + "/plan");
        return ref.get();
      });
    }).then(function (snap) {
      if (!ref) return;
      var remote = snap && snap.exists ? clean(snap.data()) : null;
      var adopted = false;
      if (remote && remote.updatedAt >= state.updatedAt) {
        state = remote;
        saveLocal();
        adopted = true;
      } else if (remote || local || state.updatedAt > 0) {
        dirty = true;
      }
      docRef = ref;
      var rolled = check();
      if (adopted) adoptHooks.forEach(function (fn) { fn(); });
      if (adopted || rolled) App.rerender();
      if (dirty) flush(); else status("saved");
    }).catch(function (e) {
      docRef = null;
      lastError = String(e && e.message ? e.message : e || "unbekannt").slice(0, 120);
      App.diag.log("Konto nicht erreichbar: " + lastError);
      status();
    });
  }

  /* Ersetzt den ganzen Stand, zum Beispiel beim Einspielen eines Backups. st kommt aus clean(). */
  function replace(st) {
    state = st;
    state.updatedAt = Date.now();
    rollover();
    dirty = true;
    saveLocal();
    schedule();
    adoptHooks.forEach(function (fn) { fn(); });
    fireChange();
  }

  App.store = {
    state: function () { return state; },
    touch: touch,
    clean: clean,
    cleanReports: cleanReports,
    cleanProfile: cleanProfile,
    cleanBody: cleanBody,
    cleanKcal: cleanKcal,
    cleanPauses: cleanPauses,
    cleanMet: cleanMet,
    cleanSec: cleanSec,
    cleanWeights: cleanWeights,
    NICK_MAX: NICK_MAX,
    NOTE_MAX: NOTE_MAX,
    replace: replace,
    cloud: HAS_CLOUD,
    info: function () { return { cloud: HAS_CLOUD, connected: !!docRef, dirty: dirty, lastSaved: lastSaved, lastError: lastError, localOk: localOk }; },
    onRollover: function (fn) { hooks.push(fn); },
    onAdopt: function (fn) { adoptHooks.push(fn); },
    onChange: function (fn) { changeHooks.push(fn); },
    cleanNotify: cleanNotify,
    cleanView: cleanView,
    NOTIFY_DEFAULTS: NOTIFY_DEFAULTS
  };

  /* Start */
  var lastToday = App.todayIdx();
  /* Erst nach dem Laden aller Module, damit sich auch später geladene Module für den Wochenwechsel anmelden können */
  document.addEventListener("DOMContentLoaded", function () {
    if (!HAS_CLOUD) status();
    if (check()) App.rerender();
  });
  window.addEventListener("pagehide", flushNow);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { flushNow(); return; }
    var rolled = check();
    var t = App.todayIdx();
    if (rolled || t !== lastToday) { lastToday = t; App.rerender(); }
  });
  setInterval(function () {
    var rolled = check();
    var t = App.todayIdx();
    if (rolled || t !== lastToday) { lastToday = t; App.rerender(); }
  }, 60000);
  initDb();
})();

</script>
<script>
/* Berichte (Daten): archiviert beim Wochenwechsel die abgelaufene Woche und bietet Liste, Löschen, Import und Export.
   Die Ansicht dazu steht in views/berichte.js. */
(function () {
  "use strict";
  var S = App.store, C = App.calc;
  var FORMAT = "trainingswoche";

  function hasProgress(st) {
    for (var i = 0; i < 7; i++) {
      if (!st.days[i] || !st.done[i]) continue;
      for (var k = 0; k < st.exercises.length; k++) {
        if (C.doneOf(st, i, st.exercises[k].id) > 0) return true;
      }
    }
    return false;
  }

  function sortByWeek(list) {
    return list.sort(function (a, b) { return a.w < b.w ? -1 : a.w > b.w ? 1 : 0; });
  }

  function upsert(list, rep) {
    var out = list.filter(function (r) { return r.w !== rep.w; });
    out.push(rep);
    return sortByWeek(out);
  }

  /* Eine Woche ohne Eintrag wird nicht archiviert */
  S.onRollover(function (old) {
    if (!hasProgress(old)) return;
    var st = S.state();
    var rep = { w: old.weekStart, d: C.allDays(old), at: Date.now() };
    var notes = S.cleanReports([{ w: old.weekStart, d: [], n: old.notes }])[0].n;
    if (notes) rep.n = notes;
    var pr = old.settings && old.settings.profile;
    var body = pr ? S.cleanBody({ kg: pr.weight, cm: pr.height }) : null;
    if (body) rep.h = body;
    st.reports = upsert(st.reports, rep);
  });

  function all() {
    var st = S.state();
    var live = hasProgress(st) ? { w: st.weekStart, d: C.allDays(st), live: true, n: st.notes } : null;
    var list = st.reports.filter(function (r) { return !live || r.w !== live.w; });
    if (live) list.push(live);
    return sortByWeek(list);
  }

  function remove(w) {
    var st = S.state();
    st.reports = st.reports.filter(function (r) { return r.w !== w; });
    S.touch();
  }

  function merge(list) {
    var st = S.state();
    var out = st.reports.slice();
    list.forEach(function (r) { out = upsert(out, r); });
    st.reports = out;
    S.touch();
    return list.length;
  }

  function toJson() {
    var head = '{"app":"' + FORMAT + '","kind":"reports","v":1,"exportedAt":' + JSON.stringify(new Date().toISOString()) + ',"reports":[\n';
    return head + S.state().reports.map(function (r) { return JSON.stringify(r); }).join(",\n") + "\n]}\n";
  }

  /* Für Excel: Semikolon, Zeilenumbruch mit \r\n, UTF-8 mit Kennzeichen. Zellen, die wie Formeln beginnen, werden entschärft. */
  function cell(v) {
    var s = String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function toCsv() {
    var rows = [["Woche (Montag)", "KW", "Datum", "Wochentag", "Übung", "Einheit", "Ziel", "Erreicht", "Prozent", "Kalorien (geschätzt)", "Notiz zum Tag"]];
    S.state().reports.forEach(function (r) {
      var mon = C.parseYmd(r.w), kg = App.health.basis(r).kg;
      r.d.forEach(function (items, i) {
        if (!items) return;
        items.forEach(function (it, k) {
          var kcal = App.health.kcalItem(it[0], it[1], it[3], kg, it[4], it[5], it[6]);
          rows.push([r.w, C.isoWeek(mon), C.ymd(C.addDays(mon, i)), App.DAYS[i].n, it[0], it[1], it[2], it[3], Math.round(it[3] / it[2] * 100), kcal > 0 ? Math.round(kcal) : "", k === 0 && r.n && r.n[i] ? r.n[i] : ""]);
        });
      });
    });
    return "﻿" + rows.map(function (r) { return r.map(cell).join(";"); }).join("\r\n") + "\r\n";
  }

  function parse(text) {
    if (typeof text !== "string" || !text.trim()) return { ok: false, error: "Es wurde kein Inhalt gefunden." };
    if (text.length > 2000000) return { ok: false, error: "Die Datei ist zu groß." };
    var obj;
    try { obj = JSON.parse(text.replace(/^﻿/, "")); } catch (e) { return { ok: false, error: "Das ist keine gültige JSON-Datei." }; }
    if (!obj || obj.app !== FORMAT) return { ok: false, error: "Diese Datei stammt nicht aus der Trainingswoche." };
    if (obj.kind === "backup") return { ok: false, error: "Das ist ein Gesamt-Backup. Importiere es unter „Einstellungen“." };
    if (obj.kind !== "reports" || !Array.isArray(obj.reports)) return { ok: false, error: "Diese Datei enthält keine Berichte." };
    var list = S.cleanReports(obj.reports.slice(0, 1000));
    if (!list.length) return { ok: false, error: "In der Datei sind keine Berichte enthalten." };
    var f = function (w) { return C.parseYmd(w).toLocaleDateString("de-DE"); };
    return { ok: true, reports: list, range: f(list[0].w) + " bis " + f(list[list.length - 1].w) };
  }

  App.reports = {
    all: all,
    archivedCount: function () { return S.state().reports.length; },
    remove: remove,
    merge: merge,
    toJson: toJson,
    toCsv: toCsv,
    parse: parse
  };
})();

</script>
<script>
/* Pausentage: einzelne Tage, an denen nicht trainiert wird (Krankheit, Urlaub). Ein Pausentag zählt nicht als ausgelassen,
   hat keine Ziele und unterbricht keine Serie. Eine ganze Woche, in der alle Trainingstage pausiert sind, wird bei Serien übersprungen.
   Gespeichert als Liste von Daten (JJJJ-MM-TT) im Stand: state.pauses. */
(function () {
  "use strict";
  var S = App.store, C = App.calc;

  function is(date) { return S.state().pauses.indexOf(date) >= 0; }

  /* Datum des Wochentags i (0 = Montag) in der laufenden Woche */
  function dateOfDay(i) { return C.ymd(C.addDays(C.parseYmd(S.state().weekStart), i)); }

  /* Ob an diesem Tag schon etwas eingetragen ist: dann lässt er sich nicht pausieren */
  function hasProgress(date) {
    var st = S.state(), i = Math.round((C.parseYmd(date) - C.parseYmd(st.weekStart)) / 86400000);
    if (i >= 0 && i <= 6) {
      return st.exercises.some(function (e) { return C.doneOf(st, i, e.id) > 0; });
    }
    /* frühere Wochen: aus dem Bericht */
    var mon = C.ymd(C.addDays(C.parseYmd(date), -((C.parseYmd(date).getDay() + 6) % 7)));
    var r = st.reports.filter(function (x) { return x.w === mon; })[0];
    var j = Math.round((C.parseYmd(date) - C.parseYmd(mon)) / 86400000);
    return !!(r && r.d[j] && r.d[j].some(function (it) { return it[3] > 0; }));
  }

  /* Gibt true zurück, wenn sich der Zustand geändert hat */
  function set(date, on) {
    var st = S.state(), i = st.pauses.indexOf(date);
    if (on) {
      if (i >= 0 || hasProgress(date)) return false;
      st.pauses.push(date);
      st.pauses.sort();
      if (st.pauses.length > 800) st.pauses = st.pauses.slice(-800);
    } else {
      if (i < 0) return false;
      st.pauses.splice(i, 1);
    }
    S.touch();
    return true;
  }

  /* Montag w einer Woche ohne Bericht, in der alle Trainingstage des jetzigen Plans pausiert sind */
  function skipped(w) {
    var st = S.state();
    if (!st.pauses.length || st.reports.some(function (r) { return r.w === w; }) || w === st.weekStart) return false;
    var mon = C.parseYmd(w), any = false;
    for (var i = 0; i < 7; i++) {
      if (!st.days[i]) continue;
      any = true;
      if (st.pauses.indexOf(C.ymd(C.addDays(mon, i))) < 0) return false;
    }
    return any;
  }

  App.pause = { is: is, set: set, dateOfDay: dateOfDay, hasProgress: hasProgress, skipped: skipped };
})();

</script>
<script>
/* Dateien: Speichern, Kopieren und Lesen. Im Artifact über die Fähigkeit "downloads", in der installierten Web-App
   über das Teilen-Menü, sonst als normaler Download. Wird von Berichten und später von den Einstellungen genutzt. */
(function () {
  "use strict";
  var IN_VIEWER = !!(window.claude && typeof window.claude.use === "function");

  function standalone() {
    try { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
    catch (e) { return false; }
  }

  /* Handy oder Tablet (Touch als Hauptgerät): dort ist das Teilen-Menü der bequemste Weg zu Drive, E-Mail oder Dateien */
  function mobile() {
    try { return !!(window.matchMedia && matchMedia("(pointer: coarse)").matches); } catch (e) { return false; }
  }

  /* In der Android-App (Capacitor): Datei im Zwischenspeicher anlegen und über das Teilen-Menü weitergeben.
     Ein normaler Download funktioniert in dieser Umgebung nicht. */
  function nativePlugins() {
    var c = window.Capacitor;
    try { if (!c || !c.isNativePlatform || !c.isNativePlatform()) return null; } catch (e) { return null; }
    function get(name) {
      try {
        if (c.Plugins && c.Plugins[name]) return c.Plugins[name];
        if (typeof c.registerPlugin === "function") return c.registerPlugin(name);
      } catch (e) { /* kein Plugin */ }
      return null;
    }
    var fs = get("Filesystem"), sh = get("Share");
    return fs && sh ? { Filesystem: fs, Share: sh } : null;
  }

  function viaNative(P, name, text) {
    return Promise.resolve().then(function () {
      return P.Filesystem.writeFile({ path: name, data: text, directory: "CACHE", encoding: "utf8" });
    }).then(function (r) {
      return P.Share.share({ title: name, dialogTitle: "Speichern oder senden", files: [r.uri] }).then(function () { return "ok"; }, function (e) {
        return /cancel/i.test(String(e && (e.message || e))) ? "cancel" : "error";
      });
    }, function () { return "error"; });
  }

  function viaBrowser(name, text, mime) {
    function download() {
      try {
        var url = URL.createObjectURL(new Blob([text], { type: mime + ";charset=utf-8" }));
        var a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        return "ok";
      } catch (e) { return "error"; }
    }
    try {
      if ((standalone() || mobile()) && navigator.canShare && window.File) {
        var f = new File([text], name, { type: mime });
        if (navigator.canShare({ files: [f] })) {
          return navigator.share({ files: [f] }).then(function () { return "ok"; }, function (e) {
            return e && e.name === "AbortError" ? "cancel" : download();
          });
        }
      }
    } catch (e) { /* weiter mit normalem Download */ }
    return Promise.resolve(download());
  }

  /* Ergebnis: "ok", "cancel", "unsupported" oder "error" */
  function save(name, text, mime) {
    if (!IN_VIEWER) {
      var P = nativePlugins();
      return P ? viaNative(P, name, text) : viaBrowser(name, text, mime);
    }
    return window.claude.use("downloads").then(function (dl) {
      if (!dl) return "unsupported";
      return dl.save({ filename: name, data: text }).then(function () { return "ok"; }, function (e) {
        var c = e && e.code;
        if (c === "declined") return "cancel";
        if (c === "unavailable" || c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return "unsupported";
        return "error";
      });
    }, function () { return "unsupported"; });
  }

  function copy(text) {
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.append(ta);
        ta.select();
        var ok = document.execCommand("copy");
        ta.remove();
        return ok;
      } catch (e) { return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    }
    return Promise.resolve(fallback());
  }

  function read(file) {
    if (file.size > 3000000) return Promise.reject(new Error("zu groß"));
    if (file.text) return file.text();
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result)); };
      r.onerror = function () { reject(r.error); };
      r.readAsText(file);
    });
  }

  /* Einlesen mit Vorschau: Datei wählen oder Text einfügen, o.parse(text) prüft, dann bestätigt der Nutzer eine Aktion.
     parse liefert { ok: false, error } oder { ok: true, text, actions: [{ label, primary, confirm, run }] }.
     confirm ist der Text für den zweiten Klick bei riskanten Aktionen. Gibt { node, say } zurück. */
  function importBox(o) {
    var el = App.el;
    var msg = el("p", { class: "msg", role: "status", id: o.id + "-msg" });
    var prev = el("div", { class: "imp-preview" });
    function say(t, err) { msg.textContent = t || ""; msg.classList.toggle("err", !!err); }

    function check(text) {
      var r = o.parse(text);
      prev.replaceChildren();
      if (!r.ok) { say(r.error, true); return; }
      say("");
      var btns = el("div", { class: "btns" });
      r.actions.forEach(function (a) {
        var run = function () { prev.replaceChildren(); a.run(); };
        btns.append(a.confirm
          ? App.confirmButton(a.label, a.confirm, run)
          : el("button", { type: "button", class: "btn" + (a.primary ? " primary" : ""), text: a.label, onclick: run }));
      });
      btns.append(el("button", { type: "button", class: "btn", text: "Abbrechen", onclick: function () { prev.replaceChildren(); } }));
      prev.append(el("p", { text: r.text }), btns);
    }

    var file = el("input", { type: "file", id: o.id + "-file", class: "vh", accept: ".json,application/json,text/plain" });
    file.addEventListener("change", function () {
      var f = file.files && file.files[0];
      if (!f) return;
      read(f).then(check, function () { say("Die Datei konnte nicht gelesen werden.", true); });
      file.value = "";
    });
    var ta = el("textarea", { class: "in paste", id: o.id + "-text", rows: "4", placeholder: "Inhalt der JSON-Datei hier einfügen", "aria-label": "Inhalt der JSON-Datei" });

    var node = el("div", { class: "imp" },
      el("div", { class: "btns" }, file, el("label", { class: "btn", for: o.id + "-file", text: "Datei wählen" })),
      el("details", { class: "paste-box" },
        el("summary", { text: "Stattdessen Text einfügen" }),
        el("div", { class: "paste-in" }, ta, el("div", null, el("button", { type: "button", class: "btn", text: "Prüfen", onclick: function () { check(ta.value); } })))
      ),
      prev, msg
    );
    return { node: node, say: say };
  }

  App.files = { canShareFiles: function () { if (nativePlugins()) return true; try { return !IN_VIEWER && (standalone() || mobile()) && !!navigator.canShare && !!window.File && navigator.canShare({ files: [new File(["x"], "x.json", { type: "application/json" })] }); } catch (e) { return false; } }, save: save, copy: copy, read: read, importBox: importBox };
})();

</script>
<script>
/* Aussehen: Modus (System, Hell, Dunkel, Schwarz) und Akzentfarbe. Die Werte liegen in state.settings.
   Eine gewählte Akzentfarbe wird bei Bedarf etwas aufgehellt oder abgedunkelt, damit sie in jedem Modus lesbar bleibt. */
(function () {
  "use strict";
  var S = App.store;
  var themeSet = false;

  var PRESETS = [["Blau", "#2f7de1"], ["Türkis", "#12a39a"], ["Grün", "#2e9b57"], ["Violett", "#8a63e0"], ["Orange", "#d9731a"], ["Rosa", "#d6457a"]];

  function lin(c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function lum(h) {
    return 0.2126 * lin(parseInt(h.substr(1, 2), 16)) + 0.7152 * lin(parseInt(h.substr(3, 2), 16)) + 0.0722 * lin(parseInt(h.substr(5, 2), 16));
  }
  function mix(h, target, a) {
    var out = "#";
    for (var i = 1; i < 7; i += 2) {
      var c = parseInt(h.substr(i, 2), 16);
      out += ("0" + Math.round(c + (target - c) * a).toString(16)).slice(-2);
    }
    return out;
  }
  /* Helligkeit zwischen 0,10 und 0,30: auf Weiß und auf Schwarz mindestens 3:1 */
  function fit(h) {
    for (var n = 0; n < 24; n++) {
      var L = lum(h);
      if (L < 0.10) h = mix(h, 255, 0.08);
      else if (L > 0.30) h = mix(h, 0, 0.08);
      else break;
    }
    return h;
  }
  function ink(h) {
    var L = lum(h);
    return 1.05 / (L + 0.05) >= (L + 0.05) / 0.057 ? "#ffffff" : "#0b1620";
  }

  function meta() {
    var m = document.querySelector('meta[name="theme-color"]');
    if (!m) { m = document.createElement("meta"); m.name = "theme-color"; document.head.append(m); }
    requestAnimationFrame(function () { m.content = getComputedStyle(document.body).backgroundColor; });
  }

  function apply() {
    var s = S.state().settings, root = document.documentElement, st = root.style;
    if (s.theme !== "system") { root.setAttribute("data-theme", s.theme); themeSet = true; }
    else if (themeSet) { root.removeAttribute("data-theme"); themeSet = false; }
    if (s.accent) {
      var a = fit(s.accent);
      st.setProperty("--accent", a);
      st.setProperty("--accent-ink", ink(a));
    } else {
      st.removeProperty("--accent");
      st.removeProperty("--accent-ink");
    }
    meta();
  }

  function setTheme(v) {
    S.state().settings.theme = ["light", "dark", "black"].indexOf(v) >= 0 ? v : "system";
    S.touch();
    apply();
  }

  function setAccent(hex) {
    S.state().settings.accent = hex ? fit(hex.toLowerCase()) : null;
    S.touch();
    apply();
  }

  S.onAdopt(apply);
  if (window.matchMedia) {
    try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", meta); } catch (e) { /* ältere Browser */ }
  }
  apply();

  App.theme = { apply: apply, setTheme: setTheme, setAccent: setAccent, fit: fit, PRESETS: PRESETS };
})();

</script>
<script>
/* Persönliche Angaben (Geschlecht, Größe, Gewicht, Spitzname) und ihre Nutzung. Die Werte liegen in state.settings.profile.
   Der Spitzname macht Hinweise der App persönlicher: App.persona.nick() liefert ihn oder einen leeren Text,
   App.persona.addr(text) hängt ihn mit Komma an, wenn er gesetzt ist ("Heute ist Pause" -> "Heute ist Pause, Liri"). */
(function () {
  "use strict";
  var S = App.store;

  function get() {
    var st = S.state();
    if (!st.settings.profile) st.settings.profile = S.cleanProfile(null);
    return st.settings.profile;
  }

  function C_today() { return App.calc.ymd(new Date()); }

  function nick() { return get().nick || ""; }

  /* Neue Werte prüfen und speichern, liefert das gespeicherte Profil */
  function set(patch) {
    var st = S.state();
    var merged = Object.assign({}, get(), patch);
    st.settings.profile = S.cleanProfile(merged);
    /* Ein geändertes Gewicht zählt als Eintrag für heute im Gewichtsverlauf */
    if (patch && typeof patch.weight === "number" && st.settings.profile.weight !== null && App.weight) {
      App.weight.add(C_today(), st.settings.profile.weight);
    }
    S.touch();
    return st.settings.profile;
  }

  function addr(text) { var n = nick(); return n ? text + ", " + n : text; }

  App.persona = { get: get, set: set, nick: nick, addr: addr };
})();

</script>
<script>
/* Gewichtsverlauf: Einträge { d: Datum, kg } in state.weights, aufsteigend nach Datum, höchstens ein Eintrag je Tag.
   Das jüngste Gewicht gilt als aktuelles Gewicht und steht auch in den Persönlichen Angaben (profile.weight).
   Wer sein Gewicht in den Einstellungen ändert, trägt damit für heute einen Eintrag ein (siehe persona.js).
   App.weight.at(datum) liefert das Gewicht, das an einem Tag galt: der letzte Eintrag an oder vor dem Tag, sonst null. */
(function () {
  "use strict";
  var S = App.store, C = App.calc;
  var MAX = 3000;

  function list() {
    var st = S.state();
    if (!Array.isArray(st.weights)) st.weights = [];
    return st.weights;
  }

  function today() { return C.ymd(new Date()); }

  /* Das jüngste Gewicht in die Persönlichen Angaben übernehmen */
  function sync() {
    var l = list();
    if (!l.length) return;
    var st = S.state();
    if (!st.settings.profile) st.settings.profile = S.cleanProfile(null);
    st.settings.profile.weight = l[l.length - 1].kg;
  }

  /* Liefert true, wenn gespeichert wurde. Ungültige Werte und Zukunftsdaten werden abgelehnt. */
  function add(date, kg) {
    var c = S.cleanWeights([{ d: date, kg: kg }])[0];
    if (!c || c.d > today()) return false;
    var l = list().filter(function (x) { return x.d !== c.d; });
    l.push(c);
    l.sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
    S.state().weights = l.slice(-MAX);
    sync();
    S.touch();
    return true;
  }

  function remove(date) {
    var st = S.state();
    st.weights = list().filter(function (x) { return x.d !== date; });
    sync();
    S.touch();
  }

  function at(date) {
    var l = list(), r = null;
    for (var i = 0; i < l.length; i++) { if (l[i].d <= date) r = l[i].kg; else break; }
    return r;
  }

  App.weight = { list: list, add: add, remove: remove, at: at, sync: sync };
})();

</script>
<script>
/* Wiege-Erinnerung: Öffnest du die App an einem Sonntag und hast für heute noch kein Gewicht eingetragen, erscheint ein Pop-up.
   Die App kann nichts melden, solange sie geschlossen ist; die Erinnerung kommt also beim Öffnen.
   Gespeichert wird nur auf diesem Gerät: { on: Erinnerung an/aus (Standard an) }. Pro Seitenaufruf und Tag erscheint das Pop-up höchstens einmal.
   „Später“ blendet es bis zum nächsten Öffnen aus, „Nicht mehr erinnern“ schaltet es aus (wieder an unter Einstellungen > Persönliche Angaben). */
(function () {
  "use strict";
  var el = App.el, C = App.calc;
  var KEY = "trainingswoche-app-weightremind";
  var handled = "";
  var open = null;

  function isOn() {
    try { var o = JSON.parse(localStorage.getItem(KEY) || "null"); return !(o && o.on === false); } catch (e) { return true; }
  }
  function setOn(v) {
    try { localStorage.setItem(KEY, JSON.stringify({ on: !!v })); return true; } catch (e) { return false; }
  }

  function todayStr() { return C.ymd(new Date()); }
  function isSunday() { return new Date().getDay() === 0; }
  function hasToday() { return App.weight.list().some(function (x) { return x.d === todayStr(); }); }
  function due() { return !window.__noWR && isOn() && isSunday() && !hasToday(); }

  function kgText(n) { return n.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " kg"; }

  function close() {
    if (!open) return;
    open.done();
  }

  function show() {
    if (open || !due()) return;
    handled = todayStr();
    var list = App.weight.list(), last = list[list.length - 1];
    var prevFocus = document.activeElement, prevOverflow = document.body.style.overflow;
    var msg = el("p", { class: "msg err", role: "alert", id: "wr-msg" });
    var inp = el("input", { type: "text", class: "in num", id: "wr-kg", inputmode: "decimal", autocomplete: "off", maxlength: "6", placeholder: last ? String(last.kg).replace(".", ",") : "70,5", "aria-label": "Gewicht in Kilogramm" });
    var title = el("h2", { id: "wr-t", tabindex: "-1", text: App.persona.addr("Sonntag: Zeit zum Wiegen") });
    var save = el("button", { type: "button", class: "btn primary", id: "wr-save", text: "Eintragen" });
    var later = el("button", { type: "button", class: "btn", id: "wr-later", text: "Später" });
    var off = el("button", { type: "button", class: "btn", id: "wr-off", text: "Nicht mehr erinnern" });
    var box = el("div", { class: "dlg", role: "dialog", "aria-modal": "true", "aria-labelledby": "wr-t", "aria-describedby": "wr-d" },
      title,
      el("p", { id: "wr-d", text: "Trage dein Gewicht von heute ein, damit Verlauf, BMI und Kalorien stimmen." + (last ? " Zuletzt: " + kgText(last.kg) + "." : "") }),
      el("div", { class: "hv-form" }, inp, el("span", { class: "kc-u", text: "kg" })),
      msg,
      el("div", { class: "btns" }, later, save),
      off);
    var back = el("div", { class: "dlg-back top", id: "wr-back" }, box);

    function done() {
      document.removeEventListener("keydown", key, true);
      back.remove();
      document.body.style.overflow = prevOverflow;
      open = null;
      try { if (prevFocus && document.contains(prevFocus)) prevFocus.focus(); } catch (e) { /* egal */ }
    }
    function key(ev) {
      if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); done(); }
      else if (ev.key === "Enter" && ev.target === inp) { ev.preventDefault(); doSave(); }
      else if (ev.key === "Tab") {
        ev.preventDefault();
        var f = [inp, later, save, off], i = f.indexOf(document.activeElement);
        f[i < 0 ? 0 : (i + (ev.shiftKey ? f.length - 1 : 1)) % f.length].focus();
      }
    }
    function doSave() {
      var v = Math.round(Number(inp.value.trim().replace(",", ".")) * 10) / 10;
      if (!(v >= 20 && v <= 300)) { msg.textContent = "Bitte gib ein Gewicht zwischen 20 und 300 kg ein."; inp.focus(); return; }
      if (!App.weight.add(todayStr(), v)) { msg.textContent = "Das konnte nicht gespeichert werden."; return; }
      done();
      App.rerender();
    }
    save.addEventListener("click", doSave);
    later.addEventListener("click", done);
    off.addEventListener("click", function () { setOn(false); done(); });
    back.addEventListener("click", function (ev) { if (ev.target === back) done(); });
    document.addEventListener("keydown", key, true);
    document.body.style.overflow = "hidden";
    document.body.append(back);
    title.focus();
    open = { done: done };
  }

  /* Prüfen, ob das Pop-up jetzt erscheinen soll: einmal pro Tag und Seitenaufruf */
  function check() {
    if (handled === todayStr() || open) return;
    if (due()) show();
  }

  /* Schalter für Einstellungen > Persönliche Angaben */
  function settingsNode() {
    var c = el("input", { type: "checkbox", class: "tgl-in", role: "switch", id: "pf-wr" });
    c.checked = isOn();
    c.addEventListener("change", function () { setOn(c.checked); });
    return el("label", { class: "tgl", for: "pf-wr" }, el("span", { text: "Sonntags ans Wiegen erinnern" }), c);
  }

  /* Die App braucht einen Moment, bis auch Daten aus dem Konto da sind, erst dann prüfen */
  document.addEventListener("DOMContentLoaded", function () { setTimeout(check, 1500); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) setTimeout(check, 400); });
  App.store.onAdopt(function () { if (open && !due()) close(); });

  App.weightRemind = { due: due, show: show, check: check, isOn: isOn, setOn: setOn, settingsNode: settingsNode };
})();

</script>
<script>
/* Gesundheitswerte: BMI und geschätzter Kalorienverbrauch aus den persönlichen Angaben und den eingetragenen Übungen.
   Alles sind Richtwerte, keine Messung und keine Diagnose.
   Kalorien = MET x Gewicht (kg) x Dauer (Stunden). MET ist der Energieaufwand einer Tätigkeit im Vergleich zum Ruhezustand (Compendium of Physical Activities).
   Bei Zeit-Übungen (Sek., Min.) zählt die eingetragene Zeit, bei Wiederholungen eine feste Dauer je Wiederholung.
   Ein Bericht trägt den Stand von Gewicht und Größe der Woche (r.h = { kg, cm }), damit alte Berichte sich nicht ändern, wenn sich dein Gewicht ändert. */
(function () {
  "use strict";
  var el = App.el, C = App.calc, S = App.store;

  /* [Muster im Namen, MET, Sekunden je Wiederholung]. Der erste Treffer gilt. */
  var REPS = [
    [/liegest|push/, 8, 3], [/klimm|pull|chin/, 8, 4], [/burpee/, 10, 4], [/dip/, 8, 3],
    [/seil|spring|jump/, 11, 1], [/sit|crunch|bauch/, 5, 3], [/kniebeug|squat/, 5, 3], [/ausfall|lunge/, 5, 3]
  ];
  var REPS_DEFAULT = [5, 3];
  /* Zeit-Übungen: [Muster, MET] */
  var TIMED = [
    [/seil|rope|spring|jump/, 11.8], [/lauf|jogg|run|renn/, 9.8], [/rad|bike|cycl/, 7.5], [/schwimm|swim/, 7],
    [/dehn|stretch|yoga/, 2.5], [/plank|stütz|stuetz|unterarm/, 3.8]
  ];
  var TIMED_DEFAULT = 4.5;

  function secondsOf(unit, v) { return unit === "Min." ? v * 60 : v; }

  /* Geschätzte kcal für einen Posten: name, Einheit, Menge, Gewicht in kg */
  /* Vorgabe aus der Tabelle: { met, sec } (sec = Sekunden je Wiederholung, nur bei Wdh.) */
  function defaults(name, unit) {
    var n = String(name).toLowerCase();
    if (unit === "Wdh.") {
      var m = REPS_DEFAULT;
      for (var i = 0; i < REPS.length; i++) if (REPS[i][0].test(n)) { m = [REPS[i][1], REPS[i][2]]; break; }
      return { met: m[0], sec: m[1] };
    }
    var met = TIMED_DEFAULT;
    for (var j = 0; j < TIMED.length; j++) if (TIMED[j][0].test(n)) { met = TIMED[j][1]; break; }
    return { met: met, sec: null };
  }

  /* Geschätzte kcal für einen Posten: name, Einheit, Menge, Gewicht in kg.
     own = eigener kcal-Wert je Einheit (hat Vorrang), cmet / csec = eigener MET-Wert / eigene Sekunden je Wiederholung (sonst Tabelle) */
  function kcalItem(name, unit, v, kg, own, cmet, csec) {
    if (!(v > 0)) return 0;
    if (own > 0) return own * v;
    if (!(kg > 0)) return 0;
    var d = defaults(name, unit);
    var met = cmet > 0 ? cmet : d.met;
    var sec = unit === "Wdh." ? v * (csec > 0 ? csec : d.sec) : secondsOf(unit, v);
    return met * kg * sec / 3600;
  }

  /* Gewicht für Berechnungen heute: letzter Eintrag im Gewichtsverlauf, sonst die persönliche Angabe */
  function currentKg() {
    var l = App.weight && App.weight.at ? App.weight.at(C.ymd(new Date())) : null;
    return l !== null && l !== undefined ? l : App.persona.get().weight;
  }

  /* Ein Tag ist null (Ruhetag) oder eine Liste [Name, Einheit, Ziel, Erreicht] */
  function kcalDay(items, kg) {
    if (!items) return 0;
    return items.reduce(function (s, it) { return s + kcalItem(it[0], it[1], it[3], kg, it[4], it[5], it[6]); }, 0);
  }
  function kcalDays(days, kg) {
    return days.reduce(function (s, items) { return s + kcalDay(items, kg); }, 0);
  }

  /* Automatischer Wert je Einheit (eine Wiederholung, eine Sekunde oder eine Minute), nur mit Gewicht */
  function autoPer(name, unit, kg, cmet, csec) { return kcalItem(name, unit, 1, kg, 0, cmet, csec); }

  function bmi(cm, kg) {
    if (!(cm > 0) || !(kg > 0)) return null;
    var m = cm / 100;
    return kg / (m * m);
  }
  /* Bereiche für Erwachsene nach WHO */
  function bmiCat(b) {
    return b < 18.5 ? "Untergewicht" : b < 25 ? "Normalgewicht" : b < 30 ? "Übergewicht" : "Adipositas";
  }

  function fmt1(n) { return n.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function fmtKcal(n) { return "≈ " + Math.round(n).toLocaleString("de-DE") + " kcal"; }

  /* Gewicht und Größe, die für einen Bericht gelten. Laufende Woche und alte Berichte ohne Stand nutzen die heutigen Angaben (now = true bei alten). */
  function basis(r) {
    var cur = App.persona.get();
    /* Gewicht aus dem Gewichtsverlauf: das letzte an oder vor dem Ende der Woche (bei der laufenden Woche: heute) */
    var end = C.ymd(C.addDays(C.parseYmd(r.w), 6)), now = C.ymd(new Date());
    if (end > now) end = now;
    var logged = App.weight.at(end);
    if (r.live) return { kg: logged !== null ? logged : cur.weight, cm: cur.height, now: false };
    if (r.h) return { kg: logged !== null ? logged : r.h.kg == null ? null : r.h.kg, cm: r.h.cm == null ? null : r.h.cm, now: false };
    return { kg: logged !== null ? logged : cur.weight, cm: cur.height, now: logged === null };
  }

  function goSettings() { App.fold.show("pers"); location.hash = "#optionen"; }

  var flash = "";
  var NS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs, text) {
    var n = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function fmtDate(d) { return C.parseYmd(d).toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "numeric" }); }
  function fmtShort(d) { return C.parseYmd(d).toLocaleDateString("de-DE", { day: "numeric", month: "numeric" }); }
  function kgText(n) { return n.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " kg"; }
  function signed(n) { return (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " kg"; }

  /* Linie über die letzten 60 Einträge, Zeitachse nach Datum */
  function weightChart(list, target) {
    var pts = list.slice(-60);
    var W = 320, H = 170, L = 38, R = 14, T = 12, B = 26;
    var vals = pts.map(function (x) { return x.kg; });
    if (target > 0) vals.push(target);
    var lo = Math.floor(Math.min.apply(null, vals) - 0.5), hi = Math.ceil(Math.max.apply(null, vals) + 0.5);
    if (hi - lo < 2) { hi += 1; lo -= 1; }
    var t0 = C.parseYmd(pts[0].d).getTime(), t1 = C.parseYmd(pts[pts.length - 1].d).getTime(), span = Math.max(1, t1 - t0);
    function X(d) { return L + (C.parseYmd(d).getTime() - t0) / span * (W - L - R); }
    function Y(v) { return T + (hi - v) / (hi - lo) * (H - T - B); }
    var first = pts[0], last = pts[pts.length - 1];
    var g = svg("svg", { viewBox: "0 0 " + W + " " + H, class: "wl", role: "img",
      "aria-label": "Gewichtsverlauf von " + fmtDate(first.d) + " bis " + fmtDate(last.d) + ", von " + kgText(first.kg) + " auf " + kgText(last.kg) });
    [lo, (lo + hi) / 2, hi].forEach(function (v) {
      g.appendChild(svg("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), class: "wl-grid" }));
      g.appendChild(svg("text", { x: L - 6, y: Y(v) + 4, class: "wl-t", "text-anchor": "end" }, String(Math.round(v * 10) / 10).replace(".", ",")));
    });
    g.appendChild(svg("text", { x: L, y: H - 6, class: "wl-t", "text-anchor": "start" }, fmtShort(first.d)));
    if (pts.length > 1) g.appendChild(svg("text", { x: W - R, y: H - 6, class: "wl-t", "text-anchor": "end" }, fmtShort(last.d)));
    if (target > 0) {
      g.appendChild(svg("line", { x1: L, x2: W - R, y1: Y(target), y2: Y(target), class: "wl-target" }));
      g.appendChild(svg("text", { x: W - R, y: Y(target) - 4, class: "wl-t", "text-anchor": "end" }, "Ziel " + String(target).replace(".", ",")));
    }
    g.appendChild(svg("polyline", { points: pts.map(function (x) { return X(x.d).toFixed(1) + "," + Y(x.kg).toFixed(1); }).join(" "), class: "wl-line", fill: "none" }));
    pts.forEach(function (x, i) {
      var c = svg("circle", { cx: X(x.d).toFixed(1), cy: Y(x.kg).toFixed(1), r: i === pts.length - 1 ? 4.5 : 3, class: "wl-dot" });
      c.appendChild(svg("title", {}, fmtDate(x.d) + ": " + kgText(x.kg)));
      g.appendChild(c);
    });
    return g;
  }

  /* Farbverlauf vom Start (rot) über Orange, Gelb und Hellgrün bis zum Ziel (dunkelgrün) */
  var STOPS = [[0, [2, 78, 48]], [0.3, [28, 90, 50]], [0.55, [48, 95, 48]], [0.8, [95, 60, 48]], [1, [140, 65, 30]]];
  function hsl(c) { return "hsl(" + c[0] + " " + c[1] + "% " + c[2] + "%)"; }
  function colorAt(p) {
    p = Math.max(0, Math.min(1, p));
    for (var i = 1; i < STOPS.length; i++) {
      if (p <= STOPS[i][0]) {
        var a = STOPS[i - 1], b = STOPS[i], t = (p - a[0]) / (b[0] - a[0]);
        return hsl(a[1].map(function (v, k) { return Math.round(v + (b[1][k] - v) * t); }));
      }
    }
    return hsl(STOPS[STOPS.length - 1][1]);
  }

  /* Wie weit das aktuelle Gewicht vom Zielgewicht entfernt ist. Start ist der erste Eintrag im Gewichtsverlauf. */
  function goalState(list, P) {
    if (!(P.target > 0) || !(P.weight > 0)) return null;
    var cur = P.weight, tg = P.target, start = list.length ? list[0].kg : null;
    var left = Math.round(Math.abs(cur - tg) * 10) / 10;
    var p = null;
    if (start !== null) {
      var denom = start - tg;
      p = Math.abs(denom) < 0.05 ? (left < 0.05 ? 1 : 0) : (start - cur) / denom;
    }
    var reached = p !== null ? p >= 1 - 1e-9 : false;
    if (p === null) reached = left < 0.05;
    return { cur: cur, target: tg, start: start, p: p, left: left, reached: reached, beyond: reached && left >= 0.05 && p !== null && p > 1 };
  }

  function goalBlock(list, P) {
    var g = goalState(list, P);
    if (!g) {
      return el("p", { class: "hint", id: "hv-goal-none", text: P.target > 0 ? "Für den Abstand zum Ziel fehlt dein aktuelles Gewicht." : "Dein Zielgewicht legst du unter Einstellungen > Persönliche Angaben fest, dann siehst du hier, wie weit du noch davon entfernt bist." });
    }
    var text = g.reached
      ? (g.beyond ? "Ziel erreicht und " + kgText(g.left) + " darüber hinaus." : "Ziel erreicht.")
      : "Noch " + kgText(g.left) + " bis zum Ziel von " + kgText(g.target) + ".";
    var kids = [el("p", { class: "goal-t", id: "hv-goal-text", text: text })];
    if (g.p !== null) {
      var pos = Math.max(0, Math.min(1, g.p));
      var pin = el("span", { class: "goal-pin", id: "hv-goal-pin" });
      pin.style.left = (pos * 100) + "%";
      pin.style.background = colorAt(g.p);
      var track = el("div", { class: "goal-track", "aria-hidden": "true" }, pin);
      var pct = Math.round(pos * 100);
      var wrap = el("div", { class: "goal-bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(pct), "aria-valuetext": pct + " Prozent des Wegs zum Zielgewicht geschafft" }, track,
        el("div", { class: "goal-ends", "aria-hidden": "true" }, el("span", { text: "Start " + kgText(g.start) }), el("span", { text: "Ziel " + kgText(g.target) })));
      kids.push(wrap);
      kids.push(el("p", { class: "hint", id: "hv-goal-pct", text: pct + " % des Wegs geschafft." }));
    }
    var sec = el("section", { class: "rec goalbox" }, el("p", { class: "rec-h", text: "Abstand zum Zielgewicht" }));
    kids.forEach(function (k) { sec.append(k); });
    return sec;
  }

  function weightSection() {
    var list = App.weight.list();
    var todayStr = C.ymd(new Date());
    var msg = el("p", { class: "msg", role: "status", id: "hv-w-msg", text: flash });
    flash = "";
    function say(t) { msg.textContent = t; msg.classList.add("err"); }

    var inp = el("input", { type: "text", class: "in num", id: "hv-w", inputmode: "decimal", autocomplete: "off", maxlength: "6", placeholder: "70,5", "aria-label": "Gewicht in Kilogramm" });
    var date = el("input", { type: "date", class: "in", id: "hv-wd", max: todayStr, "aria-label": "Datum" });
    date.value = todayStr;
    function save() {
      var v = Math.round(Number(inp.value.trim().replace(",", ".")) * 10) / 10;
      if (!(v >= 20 && v <= 300)) { say("Bitte gib ein Gewicht zwischen 20 und 300 kg ein."); return; }
      var d = date.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d > todayStr) { say("Bitte wähle ein Datum bis heute."); return; }
      if (!App.weight.add(d, v)) { say("Das konnte nicht gespeichert werden."); return; }
      flash = kgText(v) + " für " + fmtDate(d) + " gespeichert.";
      App.fold.show("ges");
      App.rerender();
    }
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); save(); } });

    var kids = [
      el("h3", { text: "Gewichtsverlauf" }),
      el("div", { class: "hv-form" },
        el("label", { class: "lab", for: "hv-w", text: "Gewicht" }), inp, el("span", { class: "kc-u", text: "kg" }),
        el("label", { class: "sr", for: "hv-wd", text: "Datum" }), date,
        el("button", { type: "button", class: "btn primary", id: "hv-wadd", text: "Eintragen", onclick: save })),
      msg
    ];
    if (!list.length) {
      kids.push(el("p", { class: "hint", id: "hv-w-empty", text: "Trage dein Gewicht ein, zum Beispiel einmal pro Woche. Der BMI und die Kalorien rechnen dann mit dem Gewicht, das zu dem Zeitraum passt." }));
      kids.push(goalBlock(list, App.persona.get()));
      return kids;
    }
    var first = list[0], last = list[list.length - 1];
    var P = App.persona.get();
    if (list.length > 1) kids.push(weightChart(list, P.target));
    kids.push(el("p", { class: "sum", id: "hv-w-sum", text: "Aktuell " + kgText(last.kg) + " (" + fmtDate(last.d) + ")" +
      (list.length > 1 ? " · seit " + fmtDate(first.d) + ": " + signed(Math.round((last.kg - first.kg) * 10) / 10) : "") }));
    kids.push(goalBlock(list, P));
    var ul = el("ul", { class: "wl-list" });
    list.slice().reverse().slice(0, 60).forEach(function (x) {
      ul.append(el("li", null,
        el("span", { class: "wl-d", text: fmtDate(x.d) }), el("strong", { text: kgText(x.kg) }),
        App.confirmButton("Löschen", "Wirklich löschen", function () { App.weight.remove(x.d); App.fold.show("ges"); App.rerender(); }, { "aria-label": "Eintrag vom " + fmtDate(x.d) + " löschen" })));
    });
    kids.push(el("details", { class: "wl-all" }, el("summary", { text: "Alle Einträge (" + list.length + ")" }), ul));
    return kids;
  }

  /* Aufklapper für den Reiter Berichte */
  function card() {
    var P = App.persona.get(), st = S.state();
    var kids = weightSection();

    var b = bmi(P.height, P.weight);
    kids.push(el("h3", { text: "BMI" }));
    if (b === null) {
      kids.push(el("p", { class: "hint", id: "hv-bmi-missing", text: "Für den BMI fehlen Körpergröße und Gewicht." }));
    } else {
      kids.push(el("section", { class: "rec", id: "hv-bmi" },
        el("p", { class: "rec-big", text: fmt1(b) }),
        el("p", { class: "rec-sub", id: "hv-bmi-cat", text: "Bereich: " + bmiCat(b) }),
        el("p", { class: "rec-sub", text: "Bei " + P.height + " cm und " + String(P.weight).replace(".", ",") + " kg." })));
      kids.push(el("p", { class: "hint", text: "Der BMI ist nur eine grobe Orientierung für Erwachsene (Bereiche der WHO) und keine Diagnose. Muskelmasse und Körperbau rechnet er nicht ein." }));
    }

    kids.push(el("h3", { text: "Kalorienverbrauch (geschätzt)" }));
    var day = kcalDay(C.dayItems(st, App.todayIdx()), P.weight);
    var week = kcalDays(C.allDays(st), P.weight);
    var anyOwn = st.exercises.some(function (e) { return e.kcal > 0; });
    if (!(P.weight > 0) && !anyOwn) {
      kids.push(el("p", { class: "hint", id: "hv-kcal-missing", text: "Für die Schätzung fehlt dein Gewicht." }));
    } else {
      kids.push(el("div", { class: "hv-two" },
        el("section", { class: "rec", id: "hv-day" }, el("p", { class: "rec-h", text: "Heute" }), el("p", { class: "rec-big", id: "hv-kcal-day", text: fmtKcal(day) })),
        el("section", { class: "rec", id: "hv-week" }, el("p", { class: "rec-h", text: "Diese Woche" }), el("p", { class: "rec-big", id: "hv-kcal-week", text: fmtKcal(week) }))));
      kids.push(el("p", { class: "hint", text: "Berechnet aus deinen eingetragenen Übungen und deinem Gewicht. Wiederholungen zählen mit etwa 3 Sekunden, bei Zeit-Übungen zählt die eingetragene Zeit. Einen eigenen Wert je Übung stellst du im Reiter Übungen ein. Ein grober Richtwert, der echte Verbrauch weicht ab." }));
    }
    if (b === null || (!(P.weight > 0) && !anyOwn)) {
      kids.push(el("div", null, el("button", { type: "button", class: "btn", id: "hv-go", text: "Persönliche Angaben eintragen", onclick: goSettings })));
    }
    return App.fold("ges", "Gesundheitswerte", "rep-health", kids);
  }

  App.health = { defaults: defaults, currentKg: currentKg, kcalItem: kcalItem, kcalDay: kcalDay, kcalDays: kcalDays, autoPer: autoPer, goalState: goalState, colorAt: colorAt, bmi: bmi, bmiCat: bmiCat, basis: basis, fmt1: fmt1, fmtKcal: fmtKcal, card: card };
})();
